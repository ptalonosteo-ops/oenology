function renderCoupe(t){
  if(!t.coupe)return'<div style="padding:1rem;font-size:14px;color:#9a9080;font-style:italic">Coupe topographique non disponible pour ce terroir.</div>';
  const zones=t.coupe.z;
  const W=440,H=155,mL=44,mR=12,mT=36,mB=24;
  const cW=W-mL-mR,cH=H-mT-mB,n=zones.length,zw=cW/n;
  const maxH=Math.max(...zones.map(z=>z.h));
  const aY=h=>mT+cH-(h/maxH)*cH*0.82;
  const tY=zones.map(z=>aY(z.h));tY.push(aY(zones[n-1].h));
  let svg=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  svg+=`<rect width="${W}" height="${H}" fill="#d8eaf6" rx="6"/>`;
  svg+=`<text x="${W/2}" y="14" text-anchor="middle" font-size="11" fill="#4a3010" font-weight="700">${esc(t.coupe.tit||'')}</text>`;
  // Colored zone polygons
  zones.forEach((z,i)=>{
    const x1=mL+i*zw,x2=mL+(i+1)*zw,y1=tY[i],y2=tY[i+1],bot=mT+cH;
    svg+=`<polygon points="${x1},${y1} ${x2},${y2} ${x2},${bot} ${x1},${bot}" fill="${z.c}" opacity=".88"/>`;
    if(i>0)svg+=`<line x1="${x1}" y1="${tY[i]}" x2="${x1}" y2="${bot}" stroke="rgba(0,0,0,.08)" stroke-width=".6"/>`;
    // Number badge on zone (no text overlapping terrain line)
    const cx=mL+i*zw+zw/2,midY=(tY[i]+bot)/2;
    svg+=`<circle cx="${cx}" cy="${midY}" r="11" fill="rgba(255,255,255,.75)"/>`;
    svg+=`<text x="${cx}" y="${midY+4}" text-anchor="middle" font-size="11" fill="#3a2010" font-weight="700">${i+1}</text>`;
  });
  // Terrain outline (the hillside — drawn ON TOP of zones, clean)
  const pts=zones.map((_,i)=>`${mL+i*zw},${tY[i]}`).join(' ')+` ${mL+n*zw},${tY[n]}`;
  svg+=`<polyline points="${pts}" fill="none" stroke="#2a1000" stroke-width="3" stroke-linejoin="round"/>`;
  // Altitude axis
  svg+=`<line x1="${mL}" y1="${mT}" x2="${mL}" y2="${mT+cH}" stroke="#8a8070" stroke-width="1"/>`;
  [100,50].forEach(pct=>{
    const y=aY(maxH*pct/100);
    if(y>mT+4&&y<mT+cH-4){
      svg+=`<line x1="${mL-2}" y1="${y}" x2="${W-mR}" y2="${y}" stroke="rgba(0,0,0,.04)" stroke-width=".5"/>`;
      svg+=`<text x="${mL-5}" y="${y+4}" text-anchor="end" font-size="9" fill="#8a8070">${Math.round(maxH*pct/100*3.5)}m</text>`;
    }
  });
  svg+=`<text x="${mL-5}" y="${mT+4}" text-anchor="end" font-size="9" fill="#8a8070">${Math.round(maxH*3.5)}m</text>`;
  svg+=`<text x="${mL-5}" y="${mT+cH+4}" text-anchor="end" font-size="9" fill="#8a8070">0</text>`;
  // Direction arrow at bottom
  const dirs=(t.coupe.tit||'').split('\u2192');
  const d0=esc((dirs[0]||'').trim()),d1=esc((dirs[1]||'').trim());
  svg+=`<text x="${mL+2}" y="${H-5}" font-size="10" fill="#5a5040" font-weight="600">${d0}</text>`;
  svg+=`<text x="${W-mR-2}" y="${H-5}" text-anchor="end" font-size="10" fill="#5a5040" font-weight="600">${d1}</text>`;
  svg+=`<line x1="${mL+18}" y1="${H-10}" x2="${W-mR-18}" y2="${H-10}" stroke="#8a8070" stroke-width=".9"/>`;
  svg+=`<polygon points="${W-mR-18},${H-10} ${W-mR-24},${H-13} ${W-mR-24},${H-7}" fill="#8a8070"/>`;
  svg+='</svg>';
  // LEGEND — completely separate, no overlap with diagram
  const legend=zones.map((z,i)=>`
    <div style="display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #ede9e2">
      <div style="width:26px;height:26px;min-width:26px;background:${z.c};border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#2a1000;border:1px solid rgba(0,0,0,.12)">${i+1}</div>
      <div style="flex:1;min-width:0">
        <p style="margin:0;font-size:14px;font-weight:600;color:#1a1710">${esc(z.n)}</p>
        <p style="margin:2px 0 0;font-size:13px;color:#6b6458;font-style:italic">${esc(z.s||'')}</p>
      </div>
      ${z.a?`<div style="font-size:12px;padding:3px 10px;border-radius:20px;background:#fff3e0;color:#b05010;font-weight:600;white-space:nowrap;flex-shrink:0">${esc(z.a)}</div>`:'<div style="font-size:12px;color:#aaa;font-style:italic;flex-shrink:0">—</div>'}
    </div>`).join('');
  return `<div>
    ${svg}
    <div style="margin-top:12px">
      <p style="font-size:12px;color:#9a9080;margin:0 0 8px;letter-spacing:.05em;text-transform:uppercase;font-weight:700">Légende — N° · Zone · Sol · Appellation</p>
      <div style="border:1px solid #e5e0d8;border-radius:8px;padding:0 10px;background:#fff">
        ${legend}
      </div>
    </div>
  </div>`;
}

function renderClimat(t){
  const tp=t.t,pr=t.p,w=380,h=155,pL=30,pR=28,pT=18,pB=26;
  const cw=w-pL-pR,ch=h-pT-pB,mw=cw/12;
  const maxP=Math.max(...pr,80),minT=Math.min(...tp,-2),maxT=Math.max(...tp,28);
  const rng=maxT-minT;
  const sT=v=>pT+ch-(v-minT)/rng*ch;
  const sP=v=>pT+ch-Math.min(v/maxP,1)*ch;
  const ms=['J','F','M','A','M','J','J','A','S','O','N','D'];
  let out=`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="background:#f9f7f3;border-radius:6px">`;
  // Grid
  [0,50,100].filter(v=>v<=maxP).forEach(v=>{out+=`<line x1="${pL}" y1="${sP(v)}" x2="${w-pR}" y2="${sP(v)}" stroke="#e5e0d8" stroke-width=".5"/>`;});
  out+=`<line x1="${pL}" y1="${sT(0)}" x2="${w-pR}" y2="${sT(0)}" stroke="#f0d8c0" stroke-width="1" stroke-dasharray="3,2"/>`;
  // Precip bars
  pr.forEach((p,i)=>{const x=pL+i*mw+1.5,bh=Math.round((p/maxP)*ch),y=pT+ch-bh;out+=`<rect x="${x}" y="${y}" width="${mw-3}" height="${bh}" fill="#6090c8" opacity=".75"/>`;});
  // Temp line
  const pts=tp.map((v,i)=>`${pL+i*mw+mw/2},${sT(v)}`).join(' ');
  out+=`<polyline points="${pts}" fill="none" stroke="#c05050" stroke-width="2"/>`;
  // Labels
  ms.forEach((m,i)=>{out+=`<text x="${pL+i*mw+mw/2}" y="${h-3}" text-anchor="middle" font-size="8" fill="#6b6458">${m}</text>`;});
  [-5,0,10,20].filter(v=>v>=minT&&v<=maxT).forEach(v=>{out+=`<text x="${pL-2}" y="${sT(v)+3}" text-anchor="end" font-size="7.5" fill="#c05050">${v}°</text>`;});
  [50,100].filter(v=>v<=maxP).forEach(v=>{out+=`<text x="${w-pR+3}" y="${sP(v)+3}" font-size="7.5" fill="#6090c8">${v}</text>`;});
  out+=`<text x="${pL}" y="${pT-4}" font-size="8" fill="#c05050">°C</text>`;
  out+=`<text x="${w-pR}" y="${pT-4}" text-anchor="end" font-size="8" fill="#6090c8">mm</text>`;
  if(t.lat&&t.lat<0)out+=`<text x="${w/2}" y="${h-2}" text-anchor="middle" font-size="7" fill="#9a9080">Hémisphère sud : Jan = été</text>`;
  out+='</svg>';
  return out;
}

function terSetCpg(c){

function terSetPays(p){

function render(){
  const app=document.getElementById('app');
  app.innerHTML=`<div class="wrap">${renderNav()}${renderSection()}</div>`;
}
function renderNav(){
  const tabs=[{id:'dashboard',e:'◧',l:'Tableau de bord'},{id:'essentiels',e:'⭐',l:'Les cépages essentiels'},{id:'cepages',e:'🍇',l:'Cépages'},{id:'geologie',e:'🪨',l:'Géologie'},{id:'terroirs',e:'🗺',l:'Terroirs'},{id:'exercices',e:'🎯',l:'Exercices'},{id:'settings',e:'⚙',l:'Paramètres'}];

    <div class="nav-brand"><h1>Œnologie App</h1><p>Gestion des contenus</p></div>

    ${S.saved?'<span class="saved-badge">✓ Sauvegardé</span>':''}
  </nav>`;
}
function essSelect(id){
  const willOpen = S.ess_sel!==id;
  update({ess_sel:S.ess_sel===id?null:id});
  if(willOpen){
    setTimeout(()=>{
      const el=document.getElementById('ess-detail');
      if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    },60);
  }
}
function essBackTop(){
  update({ess_sel:null});
  setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),60);
}

function renderEssentiels(){
  const {cepages}=S.data;
  const sel = S.ess_sel ? cepages.find(c=>c.id===S.ess_sel) : null;

  const groupes = [
    {key:'rouge', titre:'Cépages rouges',  emoji:'🍷', col:'#7c2d3a', bg:'#fbeef0',
     filtre:c=>c.type==='rouge'},
    {key:'blanc', titre:'Cépages blancs',  emoji:'🥂', col:'#9a7b1e', bg:'#fbf6e7',
     filtre:c=>c.type==='blanc'},
    {key:'rose',  titre:'Cépages à rosé',  emoji:'🌸', col:'#c2567a', bg:'#fcedf3',
     filtre:c=>c.rose===true},
  ];

  const carte = (c, accent) => `
    <button onclick="essSelect('${c.id}')" style="
      display:flex;align-items:center;gap:10px;text-align:left;cursor:pointer;
      border:2px solid ${S.ess_sel===c.id?accent:'#e5e0d5'};border-radius:12px;
      padding:11px 13px;background:${S.ess_sel===c.id?'#fff':'#fff'};
      transition:border-color .15s;width:100%">
      <span style="font-size:22px;flex-shrink:0">${c.icon||'🍇'}</span>
      <span style="flex:1;min-width:0">
        <span style="display:block;font-size:14px;font-weight:600;color:#1a1710">${esc(c.name)}</span>
        <span style="display:block;font-size:11px;color:#9a9080;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.famille||'')} · ${esc((c.origine||'').split(',')[0])}</span>
      </span>
    </button>`;

  return `<div class="section">
    <div style="margin-bottom:1.25rem">
      <h2 style="font-family:Georgia,serif;font-size:22px;font-weight:400;margin:0 0 .35rem;color:#1a1710">⭐ Les cépages essentiels</h2>
      <p style="margin:0;font-size:13.5px;color:#6b6458;line-height:1.6">Les cépages incontournables à connaître, classés par couleur. Cliquez sur un cépage pour afficher sa fiche complète.</p>
    </div>

    ${groupes.map(g=>{
      const list = cepages.filter(g.filtre);
      if(!list.length) return '';
      return `<div style="margin-bottom:1.5rem">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:.7rem;padding:7px 12px;background:${g.bg};border-radius:8px">
          <span style="font-size:18px">${g.emoji}</span>
          <span style="font-size:14px;font-weight:700;color:${g.col}">${g.titre}</span>
          <span style="font-size:12px;color:#9a9080;margin-left:auto">${list.length} cépage${list.length>1?'s':''}</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px">
          ${list.map(c=>carte(c,g.col)).join('')}
        </div>
      </div>`;
    }).join('')}

    ${sel?`<div id="ess-detail" style="margin-top:1.25rem;scroll-margin-top:80px">
      <div class="flex-row" style="gap:8px;margin-bottom:1rem">
        <button class="btn btn-sm" onclick="essBackTop()" style="background:#f0ece5;border:1px solid #e0dbd3">↑ Revenir aux essentiels</button>
        <button class="btn btn-sm" onclick="nav('dashboard')" style="background:#f0ece5;border:1px solid #e0dbd3">🏠 Revenir à l'accueil</button>
      </div>
      ${renderCepageDetail(sel)}
    </div>`:''}
  </div>`;
}

function renderSection(){
  if(S.nav==='dashboard') return renderDashboard();
  if(S.nav==='essentiels') return renderEssentiels();
  if(S.nav==='cepages') return renderCepages();
  if(S.nav==='geologie') return renderGeologie();
  if(S.nav==='terroirs') return renderTerroirs();
  if(S.nav==='exercices') return renderExercices();
  if(S.nav==='settings') return renderSettings();
  return '';
}

function setFamilleTab(t){ S.famille_tab=t; update({}); }
function toggleFamille(f){
  S.famille_open = S.famille_open===f ? null : f;
  S.famille_tab='arbre';
  update({});
}
function selCepage(id){
  S.cp_sel=id;
  update({});
}

// ─────────── CÉPAGES ───────────
function renderCepages(){
  const {cepages}=S.data;
  const filtered=cepages.filter(c=>(S.cp_filter==='all'||c.type===S.cp_filter)&&(!S.cp_search||c.name.toLowerCase().includes(S.cp_search.toLowerCase())));
  const sel=cepages.find(c=>c.id===S.cp_sel);
  return `<div class="section">
    <div class="flex-row" style="margin-bottom:1rem">
      <h2 style="font-family:Georgia,serif;font-size:20px;font-weight:400;margin:0;flex:1">Cépages <span style="font-size:14px;color:#6b6458;font-family:inherit">(${cepages.length})</span></h2>
      <input type="text" placeholder="Rechercher…" value="${esc(S.cp_search)}" oninput="cpSearch(this.value)" style="width:170px">
      ${['all','rouge','blanc'].map(f=>`<button class="btn btn-sm ${S.cp_filter===f?'btn-primary':''}" onclick="cpFilter('${f}')">${f==='all'?'Tous':f.charAt(0).toUpperCase()+f.slice(1)}</button>`).join('')}
      <button class="btn btn-sm btn-primary" onclick="cpNew()">+ Nouveau</button>
    </div>
    ${S.cp_edit&&(S.cp_new||sel)?renderCepageForm(S.cp_new?null:sel):''}
    <div class="grid-4" style="margin-bottom:${sel&&!S.cp_edit?'1rem':'0'}">
      ${filtered.map(c=>renderCepageCard(c)).join('')}
    </div>
    ${sel&&!S.cp_edit?`<div id="cepage-detail" style="margin-top:1rem;scroll-margin-top:80px">${renderCepageDetail(sel)}</div>`:''}
  </div>`;
}

  const ts=typeStyle(c.type),ns=nivStyle(c.niveau);
  return `<div class="card ${S.cp_sel===c.id?'selected':''}" onclick="cpSelect('${c.id}')">
    <div class="flex-row" style="margin-bottom:10px">
      <span style="font-size:22px">${c.icon}</span>
      <div style="flex:1"><p style="margin:0;font-size:13px;font-weight:500">${esc(c.name)}</p>${badge(c.type,ts.bg,ts.tc)}</div>
      ${badge(NIVEAUX[c.niveau]||c.niveau,ns.bg,ns.tc)}
    </div>
    ${barRow('Acidité',c.structure.a,'#2563eb')}
    ${barRow('Tannins',c.structure.t,'#dc2626')}
    ${barRow('Corps',c.structure.c,'#6b6458')}
    ${barRow('Garde',c.structure.g,GOLD)}
  </div>`;
}

// ─────────── ACTIONS ───────────
function nav(id){update({nav:id,cp_sel:null,cp_edit:false,cp_new:false,form:{}});}

// Cépages
function cpFilter(f){update({cp_filter:f});}
function cpSearch(v){update({cp_search:v});}
function backToCepages(){
  update({cp_sel:null,cp_edit:false,cp_new:false,form:{}});
  setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),60);
}
function cpSelect(id){
  const willOpen = S.cp_sel!==id;
  update({cp_sel:S.cp_sel===id?null:id,cp_edit:false,cp_new:false,form:{}});
  if(willOpen){
    setTimeout(()=>{
      const el=document.getElementById('cepage-detail');
      if(el) el.scrollIntoView({behavior:'smooth',block:'start'});
    },60);
  }
}
function cpNew(){update({cp_new:true,cp_edit:true,cp_sel:null,form:{}});}
function cpEdit(){update({cp_edit:true,cp_new:false,form:{}});}
function cpCancelEdit(){update({cp_edit:false,cp_new:false,form:{}});}
function cpDelete(id){
  if(!confirm('Supprimer ce cépage ?')) return;
  S.data.cepages=S.data.cepages.filter(c=>c.id!==id);
  persist();update({cp_sel:null});
}
function cpSave(){
  const f=S.form;
  const arr=(s)=>s.split('\n').map(x=>x.trim()).filter(Boolean);
  const obj={id:f.id||(f.name||'').toLowerCase().replace(/\s+/g,'-').replace(/[^\w-]/g,''),name:f.name,icon:f.icon,type:f.type,famille:f.famille,origine:f.origine,description:f.description,structure:{a:+f.sa,t:+f.st,c:+f.sc,g:+f.sg},aromes:arr(f.aromes||''),terroirs_fr:arr(f.terroirs_fr||''),terroirs_monde:arr(f.terroirs_monde||''),accords:arr(f.accords||''),key_point:f.key_point,niveau:f.niveau,exercice:false};
  if(S.cp_new){S.data.cepages.push(obj);}else{S.data.cepages=S.data.cepages.map(c=>c.id===S.cp_sel?{...c,...obj,id:S.cp_sel}:c);}
  persist();update({cp_edit:false,cp_new:false,cp_sel:obj.id,form:{}});
}

function geoSetCpg(id){update({geo_cpg:id,geo_soil:0,geo_mode:'resume',geo_editing_sol:false,geo_editing_fiche:false,geo_new_sol:false,form:{}});}
function geoSetTab(t){update({geo_tab:t,geo_soil:0,geo_mode:'resume',geo_editing_sol:false,geo_editing_fiche:false,geo_new_sol:false,form:{}});}
function geoSetSoil(i){update({geo_soil:i,geo_mode:'resume',geo_editing_sol:false,geo_editing_fiche:false,form:{}});}
function geoSetMode(m){update({geo_mode:m,form:{}});}
function geoNewSol(){update({geo_new_sol:true,geo_editing_sol:false,geo_editing_fiche:false,form:{}});}
function geoEditSol(){update({geo_editing_sol:true,geo_new_sol:false,geo_editing_fiche:false,form:{}});}
function geoEditFiche(){update({geo_editing_fiche:true,geo_editing_sol:false,geo_new_sol:false,form:{}});}
function geoCancelSol(){update({geo_editing_sol:false,geo_new_sol:false,form:{}});}
function geoCancelFiche(){update({geo_editing_fiche:false,form:{}});}
function geoDelSol(){
  if(!confirm('Supprimer ce sous-sol ?')) return;
  const cur=S.data.geo[S.geo_cpg]||{fr:[],monde:[]};
  cur[S.geo_tab]=cur[S.geo_tab].filter((_,i)=>i!==S.geo_soil);
  S.data.geo[S.geo_cpg]=cur;
  persist();update({geo_soil:0,form:{}});
}
function geoSaveSol(){
  const f=S.form;
  const arr=(s)=>s.split('\n').map(x=>x.trim()).filter(Boolean);
  const obj={n:f.n,r:f.r,a:f.a,d:f.d,s:{a:+f.sa,t:+f.st,c:+f.sc,g:+f.sg},ar:arr(f.ar||''),k:f.k};
  if(!S.data.geo[S.geo_cpg]) S.data.geo[S.geo_cpg]={fr:[],monde:[]};
  const cur=S.data.geo[S.geo_cpg];
  if(S.geo_new_sol){cur[S.geo_tab]=[...(cur[S.geo_tab]||[]),obj];}
  else{const arr2=[...(cur[S.geo_tab]||[])];arr2[S.geo_soil]={...(arr2[S.geo_soil]||{}), ...obj};cur[S.geo_tab]=arr2;}
  persist();update({geo_editing_sol:false,geo_new_sol:false,form:{}});
}
function geoSaveFiche(){
  const f={};
  FICHE_SECTIONS.forEach(sec=>f[sec.id]=S.form[sec.id]||'');
  if(!S.data.geo[S.geo_cpg]) S.data.geo[S.geo_cpg]={fr:[],monde:[]};
  const cur=S.data.geo[S.geo_cpg];
  const arr=[...(cur[S.geo_tab]||[])];
  arr[S.geo_soil]={...(arr[S.geo_soil]||{}),fiche:f};
  cur[S.geo_tab]=arr;
  persist();update({geo_editing_fiche:false,form:{}});
}

// Exercices
function exNew(){update({ex_edit:'new',ex_form:true,form:{}});}
function exEdit(id){update({ex_edit:id,ex_form:true,form:{}});}
function exCancel(){update({ex_form:false,ex_edit:null,form:{}});}
function exDelete(id){
  if(!confirm('Supprimer cet exercice ?')) return;
  S.data.exos=S.data.exos.filter(e=>e.id!==id);
  persist();update({});
}
function exSave(){
  const f=S.form;
  const arr=(s)=>s.split('\n').map(x=>x.trim()).filter(Boolean);
  const id=S.ex_edit==='new'?('ex'+Date.now()):S.ex_edit;
  const obj={id,titre:f.titre,type:f.type,niveau:f.niveau,cepages:arr(f.cepages||''),ai:true,statut:f.statut,description:f.description};
  if(S.ex_edit==='new'){S.data.exos.push(obj);}else{S.data.exos=S.data.exos.map(e=>e.id===id?obj:e);}
  persist();update({ex_form:false,ex_edit:null,form:{}});
}

// Settings
function exportData(){
  const blob=new Blob([JSON.stringify(S.data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='oenologie-data.json';a.click();
}
function resetData(){
  if(!confirm('Réinitialiser toutes les données ?')) return;
  S.data={cepages:[...CEPAGES_INIT],geo:JSON.parse(JSON.stringify(GEO_INIT)),exos:[...EXOS_INIT]};
  persist();update({});
}

// ─────────── INIT ───────────
loadSaved();
render();
if(location.hostname!=='') loadFromServer();
</script>
