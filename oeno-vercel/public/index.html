<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Œnologie App</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:#f4f1ec;color:#1a1710;min-height:100vh}
a{color:inherit}
input,select,textarea{font-family:inherit;font-size:13px;padding:6px 10px;border:1px solid #ccc;border-radius:6px;width:100%;outline:none;background:#fff;color:#1a1710}
input:focus,select:focus,textarea:focus{border-color:#c9a84c;box-shadow:0 0 0 2px #c9a84c22}
textarea{resize:vertical;line-height:1.6}
input[type=range]{padding:0;height:20px;cursor:pointer}
button{font-family:inherit;cursor:pointer}
#app{max-width:1140px;margin:0 auto;padding:12px}
.wrap{background:#fff;border:1px solid #e0dbd3;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05)}

/* NAV */
.nav{display:flex;align-items:center;padding:0 1rem;border-bottom:1px solid #e0dbd3;background:#fff;flex-wrap:wrap;gap:0}
.nav-brand{padding:.75rem 1rem .75rem 0;margin-right:.5rem;border-right:1px solid #e0dbd3}
.nav-brand h1{font-family:Georgia,serif;font-size:16px;font-weight:400;color:#1a1710}
.nav-brand p{font-size:10px;color:#9a9080;margin-top:1px}
.nav-tab{padding:13px 10px;background:transparent;border:none;border-bottom:2px solid transparent;color:#6b6458;font-size:12px;display:flex;align-items:center;gap:5px;white-space:nowrap}
.nav-tab.on{color:#1a1710;border-bottom-color:#c9a84c;font-weight:500}
.nav-tab:hover:not(.on){color:#1a1710}
.saved-badge{margin-left:auto;font-size:11px;color:#16a34a;background:#f0fdf4;padding:3px 10px;border-radius:20px;border:1px solid #bbf7d0}

/* LAYOUT */
.section{padding:1.25rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}

/* CARDS */
.card{background:#fff;border:1px solid #e0dbd3;border-radius:10px;padding:1rem;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card.selected{border-color:#c9a84c;box-shadow:0 0 0 3px #c9a84c22}
.card-sm{background:#f4f1ec;border-radius:8px;border:1px solid #e0dbd3;padding:.75rem 1rem}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 15px;border-radius:7px;font-size:13px;font-weight:500;border:1px solid #ccc;background:#fff;color:#1a1710;white-space:nowrap}
.btn:hover{background:#f4f1ec}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-primary{background:#c9a84c;border-color:#c9a84c;color:#fff}
.btn-primary:hover{background:#b8943f}
.btn-danger{border-color:#ef4444;color:#ef4444;background:#fff}
.btn-danger:hover{background:#fef2f2}
.btn-ghost{border-color:transparent;background:transparent;color:#6b6458}
.btn-ghost:hover{background:#f4f1ec}
.flex-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* LABELS */
.sl{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#8a6f32;font-weight:600;margin:0 0 6px;display:block}
.badge{font-size:12px;padding:3px 10px;border-radius:20px;display:inline-block;white-space:nowrap}
.tag{font-size:13px;padding:4px 11px;border-radius:20px;border:1px solid #e0dbd3;background:#f4f1ec;color:#6b6458;display:inline-block;margin:2px 2px 2px 0}

/* BARS */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.bar-label{font-size:11px;color:#6b6458;min-width:80px}
.bar-bg{flex:1;height:4px;border-radius:2px;background:#e8e4de;overflow:hidden}
.bar-fill{height:100%;border-radius:2px}

/* KEY BLOCK */
.key-block{border-left:3px solid #c9a84c;padding-left:12px;border-radius:0}
.key-block .kl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#8a6f32;font-weight:600;margin:0 0 4px}
.key-block p{font-size:12px;color:#6b6458;margin:0;line-height:1.6;font-style:italic}

/* FORMS */
.field{margin-bottom:10px}
.field label{display:block;font-size:13px;color:#6b6458;margin-bottom:4px;font-weight:500}
.field-hint{font-size:10px;color:#9a9080;margin-bottom:4px;display:block}

/* MODE SWITCH */
.mode-switch{display:flex;gap:3px;background:#f4f1ec;border-radius:8px;padding:3px;border:1px solid #e0dbd3;margin-bottom:1rem}
.mode-btn{flex:1;padding:6px 10px;border:none;border-radius:6px;font-size:12px;color:#6b6458;background:transparent;font-weight:400}
.mode-btn.on{background:#fff;color:#1a1710;font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* MISC */
.divider{border:none;border-top:1px solid #e0dbd3;margin:10px 0}
.empty-state{padding:2rem;text-align:center;color:#9a9080}
.empty-state p{margin:0 0 12px;font-size:13px}
.timeline-item{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid #e0dbd3}
.timeline-item:last-child{border-bottom:none}
.timeline-date{font-size:11px;font-weight:600;color:#c9a84c;min-width:60px;flex-shrink:0}
.timeline-text{font-size:12px;color:#6b6458;line-height:1.5}

@media(max-width:600px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr}.nav{overflow-x:auto}}

.ter-layout{display:grid;grid-template-columns:220px 1fr;min-height:500px}
.ter-sb{border-right:1px solid #e5e0d8;overflow-y:auto;max-height:580px}
.ter-main{overflow-y:auto;max-height:580px;padding:1rem}
.ter-item{padding:9px .875rem;border-bottom:1px solid #f0ede8;cursor:pointer}
.ter-item:hover{background:#faf8f4}
.ter-item.on{background:#fffbeb;border-left:3px solid #c9a84c;padding-left:calc(.875rem - 3px)}
.ter-item h3{font-size:14px;font-weight:500;margin:0 0 2px}
.ter-item p{font-size:12px;color:#9a9080;margin:0}
.viz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.viz-box{background:#f9f7f3;border:1px solid #e5e0d8;border-radius:8px;padding:10px}
.viz-box h4{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:#8a6f32;font-weight:700;margin:0 0 10px}
.viz-box svg{display:block;width:100%;height:auto}
.ic{background:#f4f1ec;border-radius:7px;padding:.5rem .875rem}
.ic .il{font-size:12px;color:#9a9080;margin:0 0 2px}
.ic .iv{font-size:14px;font-weight:500;color:#1a1710}
.at{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:13px}
.at th{background:#f4f1ec;padding:5px 8px;text-align:left;color:#6b6458;font-weight:500;border-bottom:1px solid #e5e0d8}
.at td{padding:5px 8px;border-bottom:1px solid #f0ede8;vertical-align:top;line-height:1.45}
.fc{font-size:14px;color:#1a1710;line-height:1.75;white-space:pre-wrap;margin-bottom:10px;padding:.75rem;background:#f9f7f3;border-radius:8px;border:1px solid #e5e0d8}
.cpg-pills{padding:.75rem;border-bottom:1px solid #e5e0d8;display:flex;flex-wrap:wrap;gap:4px}
.cpg-pill{padding:5px 12px;border-radius:20px;border:1px solid #ddd;background:#fff;color:#6b6458;font-size:13px;cursor:pointer}
.cpg-pill.on{background:#c9a84c;border-color:#c9a84c;color:#fff}
.pays-tab{flex:1;padding:10px;font-size:13px;color:#9a9080;background:transparent;border:none;border-bottom:2px solid transparent;cursor:pointer}
.pays-tab.on{color:#1a1710;border-bottom-color:#c9a84c;font-weight:600}
.pays-tabs{display:flex;border-bottom:1px solid #e5e0d8}
@media(max-width:700px){.viz-grid,.ter-layout{grid-template-columns:1fr}}
</style>
</head>

  'pinot-noir':{
    fr:[
      {n:'Calcaire jurassique + argile bleue',r:'Côte de Nuits — Gevrey-Chambertin, Vosne-Romanée',a:'Jurassique — 150-165 Ma',
       d:'Le sol des Grands Crus de Bourgogne. Calcaire dur kimméridgien fissuré, combiné à une argile bleue riche en magnésium à mi-coteau. Le drainage est parfait : ni trop sec ni trop humide. La vigne souffre juste assez pour concentrer ses arômes sans perdre la finesse. C\'est ce sol, à quelques mètres de différence, qui sépare un Grand Cru d\'un Village.',
       s:{a:80,t:40,c:48,g:78},ar:['Cerise rouge','Framboise','Violette','Sous-bois','Truffe (âge)'],
       k:'L\'argile bleue contient du magnésium = finesse et longévité. C\'est elle qui distingue les Grands Crus des Villages à quelques mètres de distance.',fiche:{geographie:'La Côte de Nuits s\'étend 22 km N-S (Marsannay à Corgoloin). Exposition Est ou Sud-Est — soleil levant, plateau calcaire protège à l\'ouest. Altitude 250-320 m. La bande mi-coteau (70 m de dénivelé) sépare un Grand Cru d\'un simple Bourgogne. Les \'combes\' (gorges perpendiculaires) créent des risques de gel printanier — l\'air froid s\'y accumule la nuit.',geologie_detail:'Lecture verticale :\n▪ 0-30 cm : Terre calcaire brune légèrement argileuse\n▪ 30-80 cm : Argile bleue riche en magnésium — le cœur du terroir. Stress hydrique modéré.\n▪ 80 cm+ : Calcaire jurassique fissuré. Racines de 50 ans descendent 5-8 m.\n\nLe magnésium de l\'argile bleue intervient dans la synthèse des anthocyanes → finesse et longévité. Comparer avec l\'argile ROUGE ferrugineuse de la Côte de Beaune (arômes floraux) vs argile BLEUE magnésique de la Côte de Nuits (profondeur, truffe).',appellations:'24 des 33 Grands Crus de Bourgogne en Côte de Nuits.\n\nDu bas en haut du coteau :\n▪ Bourgogne Côte de Nuits → plaine et plateau\n▪ Villages : Gevrey, Chambolle, Vosne, Nuits-Saint-Georges\n▪ Premiers Crus → lieux-dits délimités\n▪ Grands Crus → Chambertin, Clos de Bèze, Musigny, Clos de Vougeot (50 ha, 80 propriétaires), Romanée-Conti, La Tâche, Richebourg\n\nFait unique : Nuits-Saint-Georges n\'a AUCUN Grand Cru malgré 40 Premiers Crus.',evolution:'4 phases :\n1-4 ans → Cerise fraîche, framboise, rose. Tanins soyeux. Géologie absente.\n4-12 ans → Sous-bois, champignons. Premiers Crus révèlent leur terroir.\n12-25 ans → Truffe noire, gibier, cuir — signature argile bleue magnésique. GC à l\'apogée.\n25-50 ans → Réservé GC grands millésimes. Romanée-Conti, Chambertin, La Tâche : 40-50 ans.',degustation:'Indices à l\'aveugle :\nCOULEUR : Grenat translucide. Jamais opaque.\nNEZ : Jeune → cerise+rose. Évolué → champignon+truffe. Vieux → cuir+gibier.\nBOUCHE : Tanins TOUJOURS soyeux. \'Pierre mouillée\' en finale = signature argile bleue.\nDISTINGUER : Côte de Beaune → violette, pas truffe. Sancerre → zéro tanin. Bourgogne générique → finale courte.',histoire:'VIIIe s. : Moines bénédictins de l\'abbaye de Bèze cartographient les premières \'climata\'.\n1162 : Clos de Vougeot fondé — premier vignoble muré du monde.\n1395 : Philippe le Hardi interdit le Gamay — 1ère réglementation viticole mondiale.\n1789 : Révolution morcelle les propriétés monastiques → 80+ propriétaires du Clos de Vougeot.\n2015 : 1 247 Climats de Bourgogne inscrits au Patrimoine Mondial UNESCO.'}},
      {n:'Calcaire oolithique + argile rouge (fer)',r:'Côte de Beaune — Pommard, Volnay, Savigny',a:'Jurassique — 155 Ma',
       d:'Calcaire oolithique (micro-billes de calcite) sur argile rouge chargée en oxyde de fer. L\'argile rouge est plus chaude et plus oxydante que l\'argile bleue de la Côte de Nuits. Elle libère des arômes de violette, pivoine et fraise plutôt que de truffe et sous-bois. C\'est pourquoi Volnay sent la violette et Chambolle la rose, alors que Vosne sent la truffe.',
       s:{a:75,t:32,c:45,g:70},ar:['Fraise','Violette','Pivoine','Cerise noire légère','Rose'],
       k:'Argile ROUGE (fer) = arômes floraux. Argile BLEUE (magnésium) = profondeur et truffe. Même cépage, deux sols, deux expressions radicalement différentes.',fiche:{geographie:'La Côte de Beaune (25 km N-S) est plus large et diverse que la Côte de Nuits. Exposition variable : Est, Sud-Est, parfois Sud. Altitude 250-380 m. L\'argile rouge ferrugineuse est le marqueur distinctif. Pommard et Volnay dominent les rouges ; Meursault et Puligny-Montrachet les blancs d\'exception.',geologie_detail:'Différence fondamentale avec la Côte de Nuits :\nArgile ROUGE (oxyde de fer) → arômes floraux (violette, pivoine, fraise)\nvs Argile BLEUE (magnésium) de la Côte de Nuits → profondeur, truffe, longévité\n\nLe calcaire oolithique (microsphères de calcite de 0.5-2 mm) draine parfaitement et emmagasine la chaleur. Maturité régulière du Pinot Noir malgré une latitude nordique.',appellations:'Un seul GC rouge : Corton (Aloxe-Corton).\n\nRouges remarquables :\n  Volnay → style \'féminin\', floral, soyeux\n  Pommard → plus structuré, tannique\n  Beaune → 40+ 1ers Crus, 0 GC\n\nBlancs célèbres : Montrachet, Chevalier-Montrachet, Bâtard-Montrachet (Puligny+Chassagne). Meursault : Perrières, Charmes, Genevrières (0 GC officiel mais excellence réelle).',evolution:'Évolution plus rapide que la Côte de Nuits :\n1-3 ans → Fraise, cerise, violette. Très accessible.\n3-8 ans → Cerise noire, cuir léger, épices douces.\n8-15 ans → Meilleurs 1ers Crus s\'ouvrent. Complexité florale-épicée.\n15+ ans → Réservé aux 1ers Crus d\'exception (Volnay Clos des Ducs, Pommard Rugiens).',degustation:'Côte de Beaune rouge à l\'aveugle :\nCOULEUR : Grenat limpide, légèrement plus clair que Côte de Nuits à même âge.\nNEZ : Floral en premier (violette, rose, pivoine) plutôt que truffe. Fruit rouge dominant.\nBOUCHE : Tanins plus soyeux et légers qu\'en Côte de Nuits. Finale plus courte mais délicate.\nPommard vs Volnay : Pommard = plus de corps, tanins visibles. Volnay = légèreté absolue.',histoire:'Beaune est la capitale viticole de Bourgogne. Hospices de Beaune fondés en 1443 par Nicolas Rolin. Vente aux enchères de novembre = baromètre mondial des prix bourguignons.\nMontrachet inspire Alexandre Dumas : \'À genoux, tête découverte.\' Voltaire faisait une exception pour ce vin.\n1934 : Confrérie des Chevaliers du Tastevin fondée à Vougeot pour promouvoir la Bourgogne à l\'international.'}},
      {n:'Kimméridgien crayeux',r:'Sancerre rouge — Chavignol, Bué, Amigny',a:'Kimméridgien — 155 Ma',
       d:'Le même calcaire à huîtres fossiles que Chablis, mais planté en Pinot Noir. Résultat surprenant : un Pinot quasi translucide, d\'une acidité tranchante, sans tanins perceptibles. Le kimméridgien interdit toute concentration tannique — seule l\'acidité subsiste. Ce Pinot Noir révèle que le sol prime le cépage : même cépage qu\'en Bourgogne, vin radicalement différent.',
       s:{a:92,t:20,c:30,g:45},ar:['Framboise acide','Groseille rouge','Pierre à fusil','Fleur de cerisier'],
       k:'Même sol que Chablis → même acidité tranchante → Pinot Noir ultra-léger de Sancerre. Preuve absolue que le terroir prime le cépage.',fiche:{geographie:'Sancerre est une colline fortifiée à 400 m dominant la Loire. Vignoble exposé Sud et Sud-Est sur versants calcaires. Le Pinot Noir représente < 20% de l\'appellation — le Sauvignon Blanc domine depuis les années 1970. La Loire joue un rôle thermorégulateur important.',geologie_detail:'Le kimméridgien de Sancerre est identique à celui de Chablis (100 km au NE) : calcaire crayeux blanc avec fossiles d\'huîtres Exogyra virgula. Mais résultat radicalement différent !\n\nMême sol, cépage différent → styles opposés :\n  Sur Chardonnay (Chablis) → acidité + iode = Chablis minéral\n  Sur Pinot Noir (Sancerre) → acidité extrême + légèreté absolue = Sancerre rouge sans tanins\n\nConclusion clé : le sol n\'est pas tout. Le cépage est le filtre par lequel le terroir s\'exprime.',appellations:'Sancerre AOC (rouge + blanc + rosé) :\n  Blanc → 80% de la production\n  Rouge → ~15% (Pinot Noir)\n  Rosé → ~5% (Pinot Noir)\n\nLieux-dits réputés pour les rouges : Clos du Chêne Marchand (Bué), La Croix du Roy, Le Grand Chemarin.\n\nHiérarchie : AOC communale sans 1ers Crus ni GC officiels. Les \'lieux-dits\' sont reconnus mais non codifiés légalement.',evolution:'Vin de plaisir précoce, pas de garde :\n1-3 ans → Framboise, groseille, cerise acidulée. Légèreté absolue. Servir frais (14-15°C).\n3-6 ans → Légère évolution, sous-bois léger. Meilleurs lieux-dits révèlent leur minéralité.\n6-10 ans → Maximum pour les meilleures cuvées. Après, le vin s\'efface.\n\nServir à 14-15°C — comme un blanc léger. 18°C tue la fraîcheur.',degustation:'Test décisif à l\'aveugle :\nCOULEUR : Rose saumoné à rouge très pâle, translucide. On peut lire un journal à travers le verre.\nNEZ : Groseille rouge, framboise acide, cerise de Montmorency. Zéro sous-bois, zéro truffe.\nBOUCHE : ZÉRO tannin. Acidité élevée et tranchante. Corps très léger. Court en bouche.\n\nConfusion fréquente avec un rosé corsé — la couleur est si pâle. C\'est souvent le piège des dégustations à l\'aveugle.',histoire:'Sancerre était planté à 80% en Pinot Noir avant le phylloxéra. La reconstitution post-phylloxéra a favorisé le Sauvignon Blanc, plus résistant et porteur commercialement.\nRenaissance des années 1960-70 portée par Henri Bourgeois, Lucien Crochet et autres pionniers.\nHenri Bourgeois a été le 1er à exporter massivement vers USA et Grande-Bretagne — propulsant le Sauvignon Blanc à la notoriété mondiale.'}},
      {n:'Granit hercynien acide',r:'Alsace — Pinot Noir sur Grands Crus granitiques',a:'Hercynien — 300 Ma',
       d:'Granit acide et pauvre des contreforts vosgiens. Le Pinot Noir alsacien est le plus pâle de France malgré un ensoleillement record et une sécheresse unique (550 mm/an à Colmar). La pauvreté en nutriments du granit interdit la richesse tannique. Les meilleurs Pinot Noirs alsaciens proviennent de Grands Crus calcaires ou marneux, pas granitiques.',
       s:{a:78,t:18,c:35,g:52},ar:['Fraise des bois','Cerise légère','Rose séchée','Épices douces'],
       k:'Granit pauvre + sécheresse extrême = Pinot Noir pâle et délicat en Alsace. Le paradoxe : la région la plus sèche donne les Pinot Noirs les plus légers.',fiche:{geographie:'L\'Alsace forme un ruban de 120 km × 2-5 km entre les Vosges et la plaine du Rhin. Vignes de Pinot Noir concentrées sur pentes granitiques du Haut-Rhin et Grands Crus. Paradoxe : région la plus sèche et ensoleillée de France, et pourtant Pinot Noirs parmi les plus légers. La géologie l\'emporte sur le climat.',geologie_detail:'Granit hercynien (300 Ma) décomposé en arène sablonneuse gravillonneuse. Très drainant, très pauvre en calcium et magnésium.\n\nPauvreté en calcium = peu d\'extraction tannique. Même sous fort ensoleillement, les tanins restent maigres sur granit acide. Le SOL dicte l\'absence de structure, pas le manque de chaleur.\n\nContraste : sur Grands Crus calcaires (Hengst, Muenchberg), le Pinot Noir alsacien est nettement plus structuré.',appellations:'L\'Alsace est unique : le cépage figure sur l\'étiquette (pratique héritée de la période allemande 1871-1919).\n\nHiérarchie :\n  Alsace AOC Pinot Noir → production générale\n  Alsace Grand Cru (51 lieux-dits) + mention Pinot Noir\n\nGrands Crus réputés pour Pinot Noir :\n  Hengst (Wintzenheim) → calcaire argileux\n  Muenchberg (Nothalten) → grès + calcaire\n  Rangen de Thann → volcanite unique (plus structuré)',evolution:'Vin de courte garde en général :\n1-3 ans → Fruité direct, fraise des bois, cerise légère. Souvent quasi rosé visuellement.\n3-7 ans → Les meilleurs Grands Crus sur calcaire développent légère complexité. Épices douces, champignons.\n7+ ans → Seuls quelques GC exceptionnels.\n\nServir frais (14-15°C). Idéal avec charcuterie alsacienne, flamenkuche, baeckeoffe.',degustation:'À l\'aveugle :\nCOULEUR : Très pâle, presque rosé. Parmi les rouges les plus pâles de France.\nNEZ : Fraise des bois, cerise acidulée, rose séchée. Épices douces alsaciennes. Absence totale de sous-bois.\nBOUCHE : Très léger, tanins inexistants ou presque, acidité marquée.\n\nLe grand piège : confusion avec Sancerre rouge ou Pinot Gris léger. La différence : les épices alsaciennes absentes à Sancerre.',histoire:'Histoire mouvementée franco-allemande : alsacienne jusqu\'en 1871, allemande jusqu\'en 1919, française, annexée 1940-44, française définitivement.\nSous la période allemande, le vignoble produisait massivement du vin ordinaire. Renaissance qualitative dans les années 1960-70 (Hugel, Trimbach, Zind-Humbrecht).\n1975 : Création des Grands Crus d\'Alsace — première classification officielle du vignoble alsacien.'}},
      {n:'Marnes calcaires bleues',r:'Jura — Pinot Noir d\'Arbois et des Côtes du Jura',a:'Lias + Jurassique — 180-195 Ma',
       d:'Les marnes bleues jurassiennes (argiles calcaires imperméables) donnent un Pinot Noir d\'un style très particulier : vif, acide, avec une légère rusticité. Le sol froid et humide ralentit la maturation. Le Jura produit le Pinot Noir le plus nordique et le plus tendu de France, souvent vinifié en macération longue pour extraire le peu de couleur disponible.',
       s:{a:85,t:28,c:38,g:62},ar:['Cerise griotte','Cassis légère','Herbes sauvages','Pierre grise'],
       k:'Marnes bleues + altitude jurassienne = Pinot Noir le plus nordique et acide de France. Style proche d\'un Sancerre rouge mais avec plus de structure.',fiche:{geographie:'Jura viticole : 80 km N-S sur piémont occidental du massif jurassien, 250-400 m d\'altitude. Pinot Noir ≈ 10% du vignoble. Climat semi-continental : hivers froids (-10°C possibles), étés chauds (35°C), printemps tardifs (risque gel). Cette continentalité explique l\'acidité naturelle élevée.',geologie_detail:'Marnes bleues = argiles calcaires imperméables, riches en carbonates, pauvres en nutriments. Elles retiennent l\'eau et ralentissent la maturation — contrairement aux sols drainants bourguignons.\n\nImpact sur Pinot Noir : maturation lente → acidité haute maintenue → tanins peu nombreux mais vifs → vins légers et nerveux.\n\nComparaison : Bourgogne (calcaire + argile drainante) = finesse tannique. Jura (marnes imperméables) = même légèreté mais acidité encore plus tranchante.',appellations:'Appellations Jura pour Pinot Noir :\n  Arbois (1ère AOC de France, 1936) → Pinot Noir + Poulsard + Trousseau\n  Côtes du Jura → Pinot Noir + cépages locaux\n  Crémant du Jura → assemblage avec Pinot Noir\n\nLe Poulsard (Ploussard) est souvent préféré par les connaisseurs : encore plus léger, presque translucide, acidité unique. Les deux partagent les mêmes marnes bleues.',evolution:'Vin de consommation rapide :\n1-3 ans → Groseille, cerise griotte, herbe fraîche. Très léger, vif, désaltérant.\n3-6 ans → Meilleurs terroirs marno-calcaires développent une minéralité pierreuse.\n6+ ans → Exceptionnel. Quelques cuvées d\'Arbois de grandes années tiennent bien.\n\nServir à 13-14°C. Idéal avec comté jeune, charcuteries jurassiennes.',degustation:'À l\'aveugle :\nCOULEUR : Encore plus pâle qu\'en Alsace. Rouge rubis très clair, presque cerise translucide.\nNEZ : Groseille, cerise de Montmorency, herbes sauvages. Note minérale terreuse des marnes.\nBOUCHE : Acidité très vive, tanins imperceptibles, corps très léger, finale courte mais minérale.\n\nDISTINGUER du Sancerre rouge : le Jura a une note herbeuse-terreuse absente à Sancerre. Minéralité de marne ≠ minéralité de kimméridgien.',histoire:'Louis Pasteur est né à Dole (Jura) en 1822, a grandi à Arbois. En observant les vins de son père vigneron, il commence ses recherches fondamentales sur la fermentation (1857) et les levures.\nSans Pasteur, pas de microbiologie moderne ni de compréhension de la vinification.\nHenri Maire a été le grand promoteur du Jura viticole au XXe siècle, rendant les vins locaux célèbres en France.'}},

    monde:[
      {n:'Basalte de Jory + lœss glaciaire',r:'Willamette Valley — Dundee Hills, Oregon (USA)',a:'Basalte 15 Ma + lœss 15 000 ans',
       d:'Sur les collines de Willamette Valley, le basalte rouge de Columbia River (riche en fer) est recouvert par endroits de lœss glaciaire déposé lors des inondations de Missoula (il y a 15 000 ans). Ce sol volcanique donne une minéralité ferrugineuse unique, différente du calcaire bourguignon, mais à la même latitude (45°N). Les étés secs grâce aux Cascades permettent une maturation parfaite.',
       s:{a:76,t:38,c:52,g:72},ar:['Cerise noire','Framboise intense','Terre volcanique','Épices douces'],
       k:'Basalte de Jory + 45°N = Pinot Oregon comparable à la Bourgogne en style, mais minéralité ferrugineuse ≠ minéralité calcaire. Même latitude, même cépage, deux géologies différentes.',fiche:{geographie:'Willamette Valley (240 km N-S, 80 km E-O) : protégée à l\'est par les Cascades (volcaniques) et à l\'ouest par la Coast Range (basaltique). Microclimat tempéré maritime avec étés secs. Même latitude que Beaune (45°N). Hivers pluvieux, étés secs grâce aux Cascades — parfait pour Pinot Noir.',geologie_detail:'Deux types de sols :\n1. Basalte de Jory (rouge sombre) : Basalte de Columbia River (15 Ma), riche en fer. Dominant dans les collines de Dundee et Eola-Amity. Drainage parfait.\n2. Lœss glaciaire (limon gris-brun) : Déposé lors des inondations de Missoula (15 000 ans). Couvre les fonds de vallée.\n\nLe basalte de Jory donne la minéralité ferrugineuse signature de l\'Oregon — différente du calcaire bourguignon mais aussi complexe.',appellations:'Oregon AVA System :\n  Willamette Valley AVA (principale)\n    Dundee Hills AVA → basalte de Jory, style \'bourguignon\'\n    Eola-Amity Hills AVA → sédiments marins, plus frais\n    Chehalem Mountains AVA → lœss + basalte + calcaire\n    McMinnville AVA → sédiments marins, épicé\n\nLoi Oregon : max 15% autres cépages dans un vin étiqueté cépage (vs 25% Californie) — garantie de pureté.',evolution:'1-3 ans → Cerise noire, framboise, notes terreuses. Plus fruité qu\'en Bourgogne.\n3-8 ans → Champignon, sous-bois, épices. Minéralité ferrugineuse du basalte.\n8-15 ans → Apogée des meilleurs vins. Analogues à un bon 1er Cru de Côte de Nuits.\n15+ ans → Rarissimes (Domaine Drouhin, Beaux Frères, Cristom exceptionnels).',degustation:'À l\'aveugle :\nCOULEUR : Grenat légèrement plus sombre que la Bourgogne.\nNEZ : Cerise noire et framboise plus intenses. Notes terreuses de basalte rouge (différent de la truffe bourguignonne). Épices légères.\nBOUCHE : Tanins un peu plus présents que Bourgogne (basalte = plus d\'extraction que calcaire). Acidité bien présente. Plus fruité et direct.\n\nDISTINGUER de Bourgogne : Oregon est plus fruité, moins tertiaire. Minéralité ferrugineuse ≠ calcaire.',histoire:'1966 : David Lett (Eyrie Vineyards) plante les premiers Pinot Noir de Willamette. Tout le monde le dit fou.\n1979 : Son 1975 bat des Bourgognes à l\'aveugle à Paris — le \'Jugement de Paris du Pinot Noir\'.\n1988 : Robert Drouhin (Beaune) investit en Oregon — premier Bourguignon à valider la région.\nAujourd\'hui : seul terroir hors Bourgogne produisant du Pinot Noir comparable aux meilleurs Crus bourguignons.'}},
      {n:'Schiste métamorphique',r:'Central Otago — Bannockburn, Gibbston Valley (Nouvelle-Zélande)',a:'Précambrien/Paléozoïque — 300-500 Ma',
       d:'Schiste très ancien, pauvre et fissuré, dans la région viticole la plus méridionale du monde (45°S). Les vignes creusent leurs racines profondément dans les fissures. Stress hydrique intense en été. Climat continental unique en Nouvelle-Zélande — pas maritime comme le reste du pays. Écarts thermiques jour/nuit de 15-20°C préservent une acidité haute malgré le soleil intense.',
       s:{a:82,t:42,c:55,g:75},ar:['Cerise noire concentrée','Thym sauvage','Épices orientales','Pierre sèche'],
       k:'Schiste + climat continental unique en NZ + 45°S + 15-20°C d\'écart thermique = le Pinot Noir le plus concentré et le plus original du Nouveau Monde.',fiche:{geographie:'Central Otago est entouré de montagnes sur 3 côtés : Alpes du Sud (3 700 m) à l\'ouest, Remarkables au sud, Hawkdun au nord. Microclimat continental rarissime en NZ. Position : 45°S — même latitude que la Bourgogne dans l\'hémisphère sud. Altitude vignes : 200-450 m. Lacs Dunstan et Hawea thermorégulent.',geologie_detail:'Schiste métamorphique 300-500 Ma (Précambrien-Paléozoïque). Très altéré, friable, s\'émiettant facilement. Sol extrêmement pauvre, très drainant, peu de rétention d\'eau.\n\nStress hydrique intense en été — irrigation souvent nécessaire. La finesse du schiste permet aux racines de pénétrer profondément dans les fissures : 8-10 m pour une vigne adulte.\n\nÉcarts thermiques jour/nuit de 15-20°C — préservent acidité malgré l\'ensoleillement intense.',appellations:'Central Otago GI (Géographic Indication NZ) :\n  Bannockburn → le plus réputé. Schiste + alluvions. Pinot le plus complexe.\n  Gibbston Valley → la plus haute et froide. Le plus élégant.\n  Cromwell Basin (Bendigo, Lowburn, Pisa) → riches et concentrés.\n  Wanaka → émergent. Altitude très élevée.\n\nProducteurs références : Felton Road, Rippon, Ata Rangi, Mt Difficulty.',evolution:'1-3 ans → Cerise noire intense, épices orientales, thym. Structure solide.\n3-8 ans → Apogée de la majorité. Complexité tertiaire de schiste (pierre, argile sèche).\n8-15 ans → Bannockburn d\'exception (Felton Road Block 3, 5) tiennent bien.\n15+ ans → Rarissimes mais possibles dans grands millésimes chauds (2015, 2020).',degustation:'À l\'aveugle :\nCOULEUR : Rouge grenat plus sombre et profond que la Bourgogne — chaleur estivale intense concentre les anthocyanes.\nNEZ : Cerise noire, cerise confite, thym sauvage, épices orientales. Plus exotique et épicé.\nBOUCHE : Tanins plus présents. Corps plus généreux. Acidité élevée malgré la chaleur. Finale épicée et pierreuse.\n\nRègle d\'or : si c\'est le Pinot le plus concentré et épicé du groupe — c\'est Central Otago.',histoire:'Central Otago était une région aurifère (ruée vers l\'or 1861). Des vignes plantées pour les mineurs, puis abandonnées.\n1987 : Rippon Vineyard (Wanaka) relance le vignoble. En 30 ans : 0 → 2 200 ha.\n1998-2000 : Felton Road plante à Bannockburn sur conseils de Clive Dougall — ces vins deviennent la référence absolue du Pinot Noir de l\'hémisphère sud.\nAujourd\'hui : région la plus méridionale au monde à produire de grands vins rouges.'}},
      {n:'Granit volcanique — Kaiserstuhl',r:'Bade — Kaiserstuhl, Ortenau (Allemagne)',a:'Volcanique Tertiaire — 16 Ma',
       d:'Le Kaiserstuhl est un ancien volcan dont le sol de basalte, granite et lœss volcanique est le plus chaud d\'Allemagne. Le Spätburgunder (Pinot Noir allemand) y produit ses vins les plus concentrés, comparables à de bons Premiers Crus de Côte de Beaune. La chaleur volcanique compense la latitude nordique et permet une vraie maturité tannique.',
       s:{a:72,t:35,c:50,g:68},ar:['Cerise mûre','Figue légère','Réglisse','Fumée douce'],
       k:'Kaiserstuhl volcanique = le seul sol allemand qui permet au Pinot Noir d\'atteindre une vraie profondeur. L\'Allemagne produit un Pinot aussi grand que la Bourgogne dans ses meilleurs terroirs.',fiche:{geographie:'Le Kaiserstuhl est un ancien volcan isolé de 557 m d\'altitude dans la plaine du Rhin, frontière franco-allemande. Il crée son propre microclimat — plus chaud de 2-3°C que la plaine. Face à l\'Alsace de l\'autre côté du Rhin. Expositions variées sur 360° autour du massif (S, SE, SW).',geologie_detail:'Basalte et tuf volcanique du Tertiaire (16 Ma). En surface : lœss volcanique + basalte altéré + terres brunes calcaires selon la position.\n\nLa chaleur du sol volcanique sombre accélère la maturation du Spätburgunder — permettant une maturité quasi-méditerranéenne sous une latitude nordique (48°N).\n\nLe lœss volcanique retient juste assez d\'eau pour éviter le stress excessif.',appellations:'Baden = l\'une des 13 régions viticoles allemandes (Anbaugebiete).\n\nBereiche du Kaiserstuhl :\n  Kaiserstuhl → meilleurs rouges\n  Tuniberg → plaine adjacente, vins plus simples\n\nClassification VDP (Verband Deutscher Prädikatsweingüter) :\n  Grosses Gewächs (GG) = équivalent Grand Cru\n\nProducteurs références : Bernhard Huber (Malterdingen), Franz Keller, Dr. Heger.',evolution:'1-4 ans → Cerise mûre, figue légère, épices. Accessible précocement.\n4-10 ans → Les Grosses Gewächs s\'ouvrent. Complexité tertiaire, réglisse, fumée douce.\n10-20 ans → Les meilleurs (Huber Bienenberg) rivalisent avec des 1ers Crus de Côte de Beaune.\n\nRéputation croissante de la \'grande Bourgogne allemande\'.',degustation:'À l\'aveugle :\nCOULEUR : Plus sombre que Bourgogne, moins qu\'Oregon. Grenat profond avec reflets violacés.\nNEZ : Cerise mûre, légère figue, réglisse, note fumée (basalte). Plus charnu et chaud qu\'une Bourgogne classique.\nBOUCHE : Tanins plus présents que Bourgogne mais soyeux. Corps médium-plus. Acidité modérée.\n\nTest : ressemble à un Pinot avec plus de chaleur et de corps, sans être Nouveau Monde → Allemagne du Sud.',histoire:'Kaiserstuhl mentionné dans des chroniques viticoles depuis le VIIIe siècle (moines bénédictins de Saint-Gall).\n1950-70 : Remembrement massif du vignoble — de nombreuses vieilles vignes en terrasses détruites pour mécanisation.\n1992 : Bernhard Huber lance la renaissance qualitative du Spätburgunder — montrant que des vins comparables à la Bourgogne sont possibles. Son fils Julian continue après sa mort prématurée (2014).'}},

  'chardonnay':{
    fr:[
      {n:'Kimméridgien (calcaire à huîtres fossiles)',r:'Chablis — Grands Crus : Blanchot, Les Clos, Vaudésir',a:'Kimméridgien — 155 Ma',
       d:'Calcaire crayeux et fissuré chargé de fossiles d\'huîtres de l\'espèce Exogyra virgula. Ces fossiles libèrent de l\'iode en se décomposant. La note minérale iodée de Chablis n\'est pas une métaphore : c\'est une réalité géochimique mesurable en laboratoire. Sol très froid qui génère une acidité naturelle extrême — les 7 Grands Crus occupent 100 ha orientés plein sud-ouest sur la rive droite du Serein.',
       s:{a:95,t:0,c:55,g:82},ar:['Citron frais','Iode','Craie blanche','Pomme verte','Amande grillée'],
       k:'Fossiles d\'huîtres → libération d\'iode → minéralité iodée de Chablis. La géologie explique directement l\'arôme signature. C\'est de la chimie, pas de la poésie.',fiche:{geographie:'Chablis est à 100 km au nord de la Côte d\'Or, dans la vallée du Serein. Les 7 Grands Crus occupent 100 ha sur la rive droite du Serein, orientés plein sud-ouest — l\'exposition maximale. Sol très froid. Gel de printemps = risque majeur : la vallée est un couloir d\'air froid. Les vignerons utilisent des bougies anti-gel ou des asperseurs d\'eau.',geologie_detail:'Kimméridgien (155 Ma) : calcaire crayeux très fissuré chargé de fossiles d\'huîtres Exogyra virgula. Ces fossiles libèrent de l\'iode en se décomposant → note minérale iodée mesurable en laboratoire.\n\nPortlandien (plus jeune, moins fissuré, moins drainant) couvre le plateau → Petit Chablis (moins complexe).\n\nHiérarchie géologique = hiérarchie des appellations : plus le sol est kimméridgien fissuré, meilleure est l\'appellation.',appellations:'Hiérarchie Chablis de la qualité la plus simple à la plus complexe :\n  Petit Chablis → sol portlandien, plateau\n  Chablis → sol kimméridgien de base\n  Chablis 1er Cru (40 lieux-dits) → Montée de Tonnerre, Fourchaume, Montmains, Côte de Léchet\n  Chablis Grand Cru (7 GC, 100 ha) → Blanchot, Bougros, Les Clos, Grenouilles, Preuses, Valmur, Vaudésir\n\nLes 7 GC sont tous sur la rive droite du Serein, en un seul coteau continu de 100 ha.',evolution:'Chablis évolue différemment selon le niveau :\n\nPetit Chablis / Chablis : boire dans 1-3 ans. Acidité vive, minéralité directe.\n1ers Crus : 3-8 ans. La complexité iodée se développe. Minéralité plus profonde.\nGrands Crus : 5-20 ans. Les Clos et Valmur tiennent 20 ans dans les grands millésimes. L\'iode et la noisette grillée dominent. Texture quasi huileuse en finale.',degustation:'Chablis à l\'aveugle :\nCOULEUR : Jaune pâle avec reflets verts (jeune). Doré (avec âge). Jamais doré intense ni ambré.\nNEZ : L\'iode est la signature. Citron, pomme verte, craie, notes marines. ZÉRO beurre ni noisette (contrairement à Meursault).\nBOUCHE : Acidité tranchante. Corps léger à médium. Finale minérale pierreuse.\n\nTest décisif : l\'iode. Si vous sentez l\'huître ou la mer, c\'est Chablis.',histoire:'Chablis était au XIXe siècle l\'un des vignobles les plus grands de France (40 000 ha). Le phylloxéra + deux guerres mondiales réduisent le vignoble à 500 ha dans les années 1950.\nRenaissance dans les années 1970-80 grâce à la réputation croissante du \'style Chablis\' (acidité + minéralité iodée) à l\'export.\nCuriosité : \'Chablis\' est devenu un nom commun aux USA pour désigner tout vin blanc bon marché (le \'Chablis de jug\'). Ce qui a poussé le vrai Chablis à communiquer massivement sur sa spécificité.'}},
      {n:'Calcaire oolithique + argile blanche siliceuse',r:'Meursault — Perrières, Charmes, Genevrières',a:'Jurassique — 155-160 Ma',
       d:'Calcaire oolithique (microsphères de calcite) avec une argile blanche siliceuse unique à cette zone. Cette argile est riche en silice et pauvre en fer — elle crée la texture huileuse et crémeuse caractéristique de Meursault, indépendamment du passage en barrique. C\'est le sol, pas le boisé, qui génère le beurre. Meursault est le seul village de Bourgogne à n\'avoir aucun Grand Cru officiel tout en étant l\'un des plus connus du monde.',
       s:{a:78,t:0,c:72,g:85},ar:['Beurre frais','Noisette grillée','Pomme dorée','Miel de fleurs','Craie'],
       k:'Argile blanche siliceuse = texture huileuse et crémeuse de Meursault. Ce n\'est pas le bois qui crée le beurre — c\'est le sol. Réponse géologique à un préjugé courant.',fiche:{geographie:'Meursault et Puligny-Montrachet sont séparés de quelques centaines de mètres. La bande mi-coteau à 250-280 m d\'altitude est la zone idéale : assez haute pour drainer, assez basse pour emmagasiner la chaleur. Le Montrachet (8,7 ha) est partagé entre Puligny (4,6 ha) et Chassagne (4,1 ha) — au contact de deux formations géologiques différentes.',geologie_detail:'Argile blanche siliceuse unique à la zone de Meursault → texture huileuse et crémeuse caractéristique. Riche en silice, pauvre en fer.\n\nC\'est le SOL qui crée le beurre de Meursault — pas le boisé. Beaucoup de vins beurés du monde doivent leur texture à l\'élevage boisé ; Meursault doit la sienne au sol.\n\nLe Montrachet = contact entre formation calcaire de Puligny (nord, minérale) et sol argilo-calcaire de Chassagne (sud, opulent). Cette bande étroite combine les deux qualités.',appellations:'Hiérarchie Côte de Beaune blancs :\n  Bourgogne blanc → plaine\n  Meursault village → bas de côte\n  Meursault 1er Cru (Perrières, Charmes, Genevrières) → mi-coteau\n  Puligny-Montrachet 1er Cru → mi-coteau\n  Puligny-Montrachet GC : Montrachet (8.7 ha), Chevalier-Montrachet, Bâtard-Montrachet, Bienvenues-Bâtard-Montrachet\n  Chassagne-Montrachet GC : Montrachet (partie), Bâtard-Montrachet (partie), Criots-Bâtard-Montrachet\n\nParadoxe de Meursault : 0 Grand Cru officiel mais village plus connu que la plupart des villages à GC.',evolution:'Les blancs de Côte de Beaune évoluent lentement mais sûrement :\n\n1-4 ans → Acidité vive, citron, pomme, noisette légère. Encore fermé.\n4-10 ans → Le beurre et la noisette grillée s\'épanouissent. 1ers Crus au meilleur niveau.\n10-20 ans → Les GC atteignent leur plénitude. Miel d\'acacia, amande grillée, pierre à fusil.\n20-30 ans → Montrachet des grandes années (Leroy, DRC, Leflaive) : sublime. Complexité inégalable.',degustation:'Côte de Beaune blanc à l\'aveugle :\nCOULEUR : Jaune doré à dorée profonde selon l\'âge. Plus doré que Chablis.\nNEZ : Beurre frais, noisette grillée, pomme dorée, miel de fleurs, craie. Le beurre est la signature de Meursault.\nBOUCHE : Texture huileuse et crémeuse (argile blanche siliceuse). Acidité intégrée (jamais tranchante comme Chablis). Finale longue et opulente.\n\nDISTINGUER Meursault de Puligny : Meursault plus beurré/opulent. Puligny plus minéral/floral.',histoire:'Le Montrachet : Alexandre Dumas écrit \'Il faut le boire à genoux, la tête découverte.\' Voltaire, qui n\'aimait pas le vin, faisait une exception pour ce vin.\nHospices de Beaune (fondés 1443 par Nicolas Rolin) — la vente de novembre est le baromètre des prix bourguignons.\nDomaine de la Romanée-Conti (DRC) : propriétaire du Montrachet et de La Tâche, Richebourg, Romanée-Conti. Les bouteilles de DRC Montrachet atteignent plusieurs milliers d\'euros.'}},
      {n:'Calcaire oolithique (Montrachet)',r:'Puligny-Montrachet et Chassagne-Montrachet',a:'Jurassique — 158 Ma',
       d:'La parcelle du Montrachet (8,7 ha) se trouve exactement au contact de deux formations géologiques : le calcaire plus minéral de Puligny (nord) et le sol plus argileux et opulent de Chassagne (sud). Cette bande étroite au contact de deux formations donne un vin qui combine minéralité ET richesse — unique au monde. Voltaire disait qu\'on doit le boire \'à genoux, tête découverte\'.',
       s:{a:82,t:0,c:78,g:92},ar:['Amande fraîche','Miel d\'acacia','Pierre à fusil','Agrumes confits','Fleur de lys'],
       k:'Montrachet = point de contact entre deux géologies. Minéralité de Puligny + richesse de Chassagne = le blanc sec le plus complexe du monde selon beaucoup de critiques.',fiche:{geographie:'Le Montrachet occupe une position unique : contact entre Puligny (nord, plus calcaire, plus minéral) et Chassagne (sud, plus argile, plus opulent). Cette bande étroite de 8,7 ha est divisée politiquement entre deux communes mais géologiquement unifiée.\n\nAltitude 245-260 m. Exposition Est-Sud-Est parfaite. Le sol est le plus complexe de la Côte de Beaune.',geologie_detail:'Contact géologique unique :\n  Nord (Puligny) → calcaire oolithique + peu d\'argile → minéralité, tension\n  Sud (Chassagne) → calcaire + argile rouge → opulence, richesse\n  Le Montrachet → zone de transition qui combine les deux caractères\n\nC\'est l\'une des rares parcelles au monde où deux formations géologiques distinctes se rencontrent dans une même appellation, créant une complexité impossible à reproduire ailleurs.',appellations:'Grands Crus de la bande de Puligny-Montrachet :\n  Le Montrachet (8.7 ha) → partagé Puligny + Chassagne\n  Chevalier-Montrachet (7.4 ha) → au-dessus du Montrachet. Encore plus minéral.\n  Bâtard-Montrachet (11.9 ha) → en dessous. Plus opulent.\n  Bienvenues-Bâtard-Montrachet (3.7 ha) → sous Chevalier. Floral et délicat.\n  Criots-Bâtard-Montrachet (1.6 ha) → tout en bas sur Chassagne.\n\nChaque Grand Cru reflète une micro-variation géologique autour du même sol.',evolution:'Le Montrachet est l\'un des blancs secs qui vieillit le mieux au monde :\n\n1-5 ans → Encore fermé. Citron, fleur de lys, amande. Décevant pour le non-initié.\n5-15 ans → S\'ouvre progressivement. Miel, pierre à fusil, noisette grillée profonde.\n15-30 ans → Apogée. Complexité inégalable. Safran, cire d\'abeille, amande amère, minéralité calcaire.\n30+ ans → Légendaire dans les grandes années. Rarissime d\'en trouver dans ce état.',degustation:'Test ultime à l\'aveugle :\nCOULEUR : Doré profond, brillant.\nNEZ : Combinaison unique d\'amande fraîche (Chevalier-type) + miel d\'acacia + pierre à fusil. Ni simplement fruité ni simplement minéral : les deux simultanément.\nBOUCHE : Texture la plus ample et la plus complexe de tous les blancs secs. Finale de 45 secondes ou plus.\n\nRègle : si c\'est le blanc le plus complexe, le plus long et le plus indéfinissable du groupe — c\'est Montrachet.',histoire:'Le Montrachet est mentionné dans des chartes depuis le XIIe siècle. Les moines cisterciens de l\'abbaye de Maizières possédaient des vignes ici.\nVoltaire écrit à son médecin (1775) : \'Je suis condamné par mes médecins à boire du Montrachet.\' Il dit cela comme si c\'était une médecine — en réalité c\'est le plus grand compliment.\nDRC (Domaine de la Romanée-Conti) possède 0.25 ha de Montrachet — moins de 600 bouteilles par an. Une des allocations les plus recherchées au monde.'}},
      {n:'Craie sénonienne',r:'Champagne — Côte des Blancs (Avize, Le Mesnil-sur-Oger)',a:'Crétacé supérieur — 85-90 Ma',
       d:'Craie blanche très poreuse (40% de son volume est d\'eau). La craie retient l\'eau en profondeur et la libère lentement — les vignes ne stressent jamais, même lors des étés secs. Résultat : acidité constante et élevée, indispensable pour les bulles. Les caves creusées dans la craie maintiennent 10°C toute l\'année — température idéale pour la seconde fermentation et le vieillissement.',
       s:{a:92,t:0,c:58,g:88},ar:['Citron vert','Craie minérale','Brioche','Fleurs blanches','Pierre'],
       k:'Craie poreuse = réservoir d\'eau permanent = pas de stress hydrique = acidité stable = bulles parfaites. La craie est l\'ingrédient technique invisible du Champagne.',fiche:{geographie:'La Champagne viticole s\'étend sur 120 km autour d\'Épernay. La Côte des Blancs (20 km au sud d\'Épernay) est le cœur du Blanc de Blancs : un coteau orienté à l\'Est, exposé au soleil levant, protégé à l\'ouest par la butte crayeuse. Altitude 90-200 m. Les caves dans la craie (20-30 m de profondeur) maintiennent 10°C toute l\'année.',geologie_detail:'La craie sénonienne (85-90 Ma) est le sol le plus poreux du monde viticole : 40% de son volume est de l\'eau. Elle retient l\'humidité en profondeur et la libère lentement — la vigne ne stresse jamais.\n\nRésultat : acidité naturelle constante et élevée, indispensable pour les bulles (la pression de CO₂ = 5-6 bars nécessite une acidité haute pour l\'équilibre).\n\nLes coquillages fossilisés dans la craie libèrent des minéraux calcaires qui contribuent à la minéralité du Champagne.',appellations:'5 grandes zones :\n  Montagne de Reims → Pinot Noir + Meunier dominant\n  Vallée de la Marne → Meunier dominant\n  Côte des Blancs → Chardonnay dominant : Avize, Cramant, Le Mesnil-sur-Oger, Oger, Chouilly (tous Grands Crus)\n  Côte de Sézanne → Chardonnay secondaire\n  Côte des Bar (Aube) → Pinot Noir dominant\n\nStyles :\n  Blanc de Blancs (100% Chard) → Côte des Blancs\n  Blanc de Noirs (Pinot+Meunier) → Montagne de Reims\n  Rosé → Assemblage ou macération courte',evolution:'Le Champagne est le vin blanc le plus lent à révéler son potentiel :\n\nNon-millésimé (NV) → boire dans 3-5 ans après achat. Fruité direct, brioche.\nMillésimé → 10-20 ans après vendange. Complexité croissante.\nPrestige Cuvée (Dom Pérignon, Cristal, Belle Époque) → 15-30 ans. Profondeur extraordinaire.\nOld Champagne → Rarissime. Un Krug 1988 dégusté en 2020 = sublime. Café, truffe, brioche brûlée.',degustation:'Champagne Blanc de Blancs à l\'aveugle :\nCOULEUR : Jaune pâle, parfois presque incolore. Bulles fines et persistantes.\nNEZ : Citron vert, craie, brioche légère, fleurs blanches. Minéralité calcaire très présente. Sans beurre ni noisette (contrairement à Meursault).\nBOUCHE : Acidité haute, mousse crémeuse, finale minérale et longue.\n\nDISTINGUER Blanc de Blancs de Blanc de Noirs : les Blancs de Noirs ont plus de corps et de fruit rouge en bouche.',histoire:'Dom Pérignon (1638-1715) n\'a PAS inventé le Champagne — il a essayé de l\'empêcher de buller ! Les Anglais aimaient les vins pétillants et ont créé la demande.\nLa bouteille de Champagne résiste à 5-6 bars — avant la standardisation du XIXe siècle, les caves explosaient régulièrement (jusqu\'à 30% des bouteilles perdues).\nLe dégorgement mécanique (gyropalette) inventé par Pommery en 1884. Le remuage manuel subsiste dans quelques grandes maisons de prestige.\nLe Champagne est le vin le plus bu au monde lors des célébrations. Sa production mondiale : ~300 millions de bouteilles/an.'}},
      {n:'Granit + grès vosgien et calcaire',r:'Mâconnais — Pouilly-Fuissé, Saint-Véran, Viré-Clessé',a:'Hercynien + Trias — 250-300 Ma',
       d:'Sols très variés : granit (nord de Pouilly-Fuissé), grès vosgien et schiste (Vergisson), calcaire (Fuissé). La Roche de Solutré et la Roche de Vergisson dominent le vignoble — leurs falaises calcaires créent des microclimats. Le Chardonnay mâconnais est plus charnu, plus fruité et moins tendu qu\'en Côte d\'Or. Accessible jeune, moins de garde.',
       s:{a:72,t:0,c:70,g:68},ar:['Pêche blanche','Pomme golden','Fleurs de tilleul','Beurre légèrement salé'],
       k:'Granit + schiste + calcaire mêlés + climat plus chaud = Chardonnay fruité et charnu du Mâconnais. Accessible jeune — le contraire de Chablis.',fiche:{geographie:'Le Mâconnais s\'étend de Tournus (nord) à Pouilly-Fuissé (sud), au sud de la Côte Chalonnaise. Vignes à 200-500 m d\'altitude. La Roche de Solutré (493 m) et la Roche de Vergisson (485 m) — deux falaises calcaires iconiques — dominent le vignoble et créent des microclimats locaux. Climat plus chaud que la Côte d\'Or : le Chardonnay y mûrit facilement.',geologie_detail:'Sols très variés dans le Mâconnais :\n  Granit (nord de Pouilly-Fuissé, Viré-Clessé) → Chardonnay le plus frais du Mâconnais\n  Grès vosgien + schiste (pied des Roches de Solutré et Vergisson) → intermédiaire\n  Calcaire + argile (Pouilly, Fuissé, Chaintré) → Chardonnay le plus opulent\n\nContrairement à la Côte d\'Or, le Mâconnais n\'a pas de hiérarchie rigoureuse entre les sous-zones. Le Chardonnay y est plus facile à mûrir et les vins sont plus accessibles.',appellations:'Appellations du Mâconnais (du plus simple au plus complexe) :\n  Mâcon → vin de base, cépage Chardonnay obligatoire\n  Mâcon Villages + nom de commune (Mâcon-Uchizy, Mâcon-Vire) → communes désignées\n  Viré-Clessé AOC → 2 communes sur calcaire et grès\n  Saint-Véran AOC → entourant Pouilly-Fuissé\n  Pouilly-Fuissé AOC → les meilleurs terroirs. 1ers Crus depuis 2020 !\n  Pouilly-Loché, Pouilly-Vinzelles → satellites de Pouilly-Fuissé',evolution:'Le Mâconnais produit des vins de plaisir précoce :\n\nMâcon Villages → boire dans 1-2 ans. Fruité direct, simple, désaltérant.\nViré-Clessé / Saint-Véran → 2-5 ans. Plus de caractère.\nPouilly-Fuissé → 3-10 ans pour les meilleurs. Les 1ers Crus (depuis 2020) peuvent vieillir 8-12 ans.\n\nLes vins du Mâconnais ne cherchent pas la longévité bourguignonne — leur force est la générosité immédiate.',degustation:'Mâconnais à l\'aveugle :\nCOULEUR : Jaune dorée, brillant. Plus doré et chaud que Chablis.\nNEZ : Pêche blanche, fleurs de tilleul, pomme golden, beurre léger. Plus fruité et moins minéral que la Côte d\'Or.\nBOUCHE : Corps généreux, acidité modérée (moins que Chablis), texture ronde. Finale moyenne.\n\nTest : si le Chardonnay est le plus fruité, le plus rond et le moins tendu du groupe — c\'est probablement le Mâconnais.',histoire:'Pouilly-Fuissé existait comme vin reconnu avant la Révolution (cité au XVIIIe siècle par Thomas Jefferson, ambassadeur des USA en France, qui l\'a commandé pour la Maison Blanche).\nLa Roche de Solutré a été rendue célèbre par François Mitterrand qui y montait chaque Pentecôte avec ses amis — pèlerinage annuel médiatisé.\n2020 : Création des Premiers Crus de Pouilly-Fuissé — reconnaissance tardive mais méritée de la hiérarchie qualitative du Mâconnais.'}},

    monde:[
      {n:'Alluvions de rivière + argile volcanique',r:'Napa Valley — Carneros, Russian River (Californie, USA)',a:'Alluvions Quaternaire + volcanite Tertiaire',
       d:'Carneros (frais, influence Baie de San Francisco) : alluvions argileuses drainantes. Russian River (encore plus frais, influence Pacifique directe) : alluvions et grès. Ces zones froides de Californie donnent un Chardonnay radicalement différent des vins gras des vallées chaudes intérieures. La fraîcheur maritime préserve l\'acidité — indispensable pour un blanc de qualité.',
       s:{a:70,t:0,c:75,g:78},ar:['Pomme verte','Pêche jaune','Noisette grillée','Toast','Citrus léger'],
       k:'Carneros et Russian River frais = Chardonnay californien à l\'européenne. Preuve que le climat prime en Californie : même État, même cépage, qualités opposées selon la localisation.',fiche:{geographie:'Carneros (frais, influence Baie de San Francisco) : alluvions argileuses. Russian River Valley (encore plus froid, brouillard Pacifique) : alluvions et grès. Anderson Valley (Mendocino) : très froid et venteux, similaire à l\'Alsace. Ces zones fraîches de Californie produisent des Chardonnay radicalement différents des vallées chaudes intérieures.',geologie_detail:'Carneros : argile lourde + galets sur alluvions. Très différent du calcaire bourguignon. L\'argile retient l\'eau, ralentit la maturation, et maintient l\'acidité — des qualités vitales pour un bon blanc sous le soleil californien.\n\nRussian River : grès et sable sur alluvions. Sol plus drainant que Carneros. La brume matinale (et parfois l\'après-midi entier) du Pacifique maintient les températures basses — acidité naturellement haute pour la Californie.',appellations:'California AVA System (American Viticultural Area) :\n  Los Carneros AVA → Chardonnay + Pinot Noir. Partagé entre Napa et Sonoma.\n  Russian River Valley AVA → Chardonnay + Pinot Noir de prestige\n  Anderson Valley AVA (Mendocino) → Chardonnay très froid\n  Sta. Rita Hills AVA (Santa Barbara) → Pinot Noir + Chardonnay frais\n\nProducteurs références : Kistler, Peter Michael, Marcassin, Ramey, Flowers.',evolution:'Le Chardonnay californien de qualité évolue mieux que sa réputation bon marché ne le laisse croire :\n\n1-4 ans → Pomme verte, pêche, noisette grillée, vanille (si barrique neuve). Fruité et direct.\n4-8 ans → Complexité croissante. Miel, toast, minéralité californienne.\n8-15 ans → Les grands producteurs (Kistler, Marcassin) : profondeur bourguignonne.\n\nLa clé : éviter le beurre excessif (excès de malolactique) — les meilleurs producteurs le limitent.',degustation:'Californie Chardonnay à l\'aveugle :\nCOULEUR : Jaune doré à dorée intense. Souvent plus coloré que la Bourgogne.\nNEZ : Pomme, pêche, noisette grillée, vanille (boisé). Parfois beurré (si vinification classique californienne).\nBOUCHE : Généreux, corps ample, alcool souvent élevé (13.5-15%). Acidité modérée.\n\nTest : si le Chardonnay a beaucoup d\'alcool, de boisé et de corps sans grande tension — Californie classique. Si acide et minéral — zone froide (Russian River, Carneros).',histoire:'Ernest et Julio Gallo ont popularisé le Chardonnay californien dans les années 1960-70, créant un marché de masse.\n1976 : \'Jugement de Paris\' — Chateau Montelena Chardonnay 1973 bat les meilleurs Bourgognes blancs. La France est scandalisée. Événement fondateur de la viticulture mondiale moderne.\n2000s : La \'Anything But Chardonnay\' (ABC) movement de sommeliers américains critiquait les Chardonnay trop boisés et beurré — forçant les producteurs à s\'améliorer.'}},
      {n:'Calcaire et Terra Rossa (Limestone Coast)',r:'Coonawarra et Padthaway — Australie du Sud',a:'Calcaire Tertiaire — 10-25 Ma',
       d:'La Limestone Coast (côte calcaire) d\'Australie du Sud est sur une formation calcaire ancienne recouverte de terra rossa (terre rouge argileuse en surface). Le Chardonnay y produit des vins plus frais et plus minéraux que dans la plupart des régions australiennes — style comparable à un Mâconnais de qualité. Preuve que le calcaire donne partout de la tension et de la minéralité.',
       s:{a:76,t:0,c:68,g:72},ar:['Pomme','Citron confit','Craie australienne','Noisette légère','Pêche'],
       k:'Calcaire australien (Limestone Coast) = fraîcheur et minéralité atypiques. Preuve que le calcaire donne toujours de la tension au Chardonnay, quelle que soit la latitude.',fiche:{geographie:'La Limestone Coast d\'Australie du Sud s\'étend de Padthaway au nord à Wrattonbully au sud, avec Coonawarra comme zone centrale et la plus réputée. Altitude modeste (50-80 m) dans une région relativement plate. Latitude : 37°S — même latitude que la Méditerranée dans l\'hémisphère sud. Influence maritime modérée de l\'Océan Austral.',geologie_detail:'Terra Rossa sur calcaire : fine couche de terre argileuse rouge (oxyde de fer) de 10 à 50 cm d\'épaisseur, sur calcaire blanc compact. Le drainage est parfait (la Terra Rossa est poreuse) mais les racines atteignent vite le calcaire.\n\nImpact sur le Chardonnay : le calcaire maintient une fraîcheur relative et une acidité supérieure aux autres régions australiennes. Le Chardonnay de Coonawarra est atypiquement frais pour l\'Australie.',appellations:'Appellations de la Limestone Coast :\n  Coonawarra GI → Le plus réputé. \'Terra Rossa\' est une marque déposée par certains producteurs.\n  Padthaway GI → Au nord de Coonawarra. Chardonnay de style similaire.\n  Wrattonbully GI → Sols légèrement différents. Rouges souvent préférés.\n  Bordertown, Mt Benson GI → Zones émergentes\n\nProducteurs : Wynns Coonawarra Estate, Katnook, Penola, Leconfield.',evolution:'Le Chardonnay de Limestone Coast évolue mieux que beaucoup de Chardonnay australiens :\n\n1-3 ans → Pomme, citron, noisette légère. Plus frais que Barossa ou McLaren Vale.\n3-7 ans → Complexité calcaire se développe. Minéralité atypique pour l\'Australie.\n7-12 ans → Les meilleurs crus (Katnook Odyssey) tiennent bien et révèlent une vraie profondeur.',degustation:'Limestone Coast Chardonnay à l\'aveugle :\nCOULEUR : Jaune dorée modérée — moins intense que les Chardonnay du Barossa.\nNEZ : Pomme, citron confit, noisette légère. Plus frais et plus minéral que les autres Chardonnay australiens.\nBOUCHE : Corps médium. Acidité correcte pour l\'Australie. Finale calcaire.\n\nTest : si le Chardonnay australien est le plus \'européen\' du groupe — Limestone Coast.',histoire:'La Terra Rossa de Coonawarra a été identifiée comme exceptionnelle pour la viticulture en 1890 par John Riddoch, qui a planté les premières vignes. La réputation du terroir a mis 100 ans à s\'établir internationalement.\nCoonawarra est surtout célèbre pour ses Cabernet Sauvignon (les meilleurs d\'Australie selon beaucoup). Le Chardonnay est secondaire mais mérite l\'attention.'}},
      {n:'Schiste précambrien (Margaret River)',r:'Margaret River — Australie Occidentale',a:'Précambrien — 600-1 000 Ma',
       d:'Schiste très ancien sur une presqu\'île baignée par l\'Océan Indien au nord et l\'Océan Austral au sud. Double influence maritime intense. Le Chardonnay de Margaret River est l\'un des plus élégants du Nouveau Monde — souvent comparé au style bourguignon pour sa finesse et sa minéralité. Sol pauvre qui force la vigne à creuser profondément.',
       s:{a:80,t:0,c:70,g:80},ar:['Citron','Nectarine','Pamplemousse','Craie marine','Amande'],
       k:'Margaret River : double influence maritime + schiste précambrien = Chardonnay le plus proche du style bourguignon en Australie. La pauvreté du sol vieux crée la finesse.',fiche:{geographie:'Margaret River est une presqu\'île dans l\'extrême sud-ouest de l\'Australie Occidentale, à 300 km au sud de Perth. Deux côtes opposées : Océan Indien au nord (chaud), Océan Austral au sud (froid). Cette double influence maritime crée un microclimat unique. Comparée parfois à Bordeaux pour son environnement naturel exceptionnel.',geologie_detail:'Schiste précambrien très ancien (600-1000 Ma), associé à des sables et des graviers en surface. Sol pauvre, très drainant. Les vignes doivent creuser profondément pour trouver eau et nutriments.\n\nLa double influence maritime assure des températures modérées toute l\'année — jamais de gel, rarement de canicule. L\'humidité relative est élevée mais les vents marins sèchent les raisins.\n\nComparaison : Margaret River est l\'Australie où le sol et le climat ressemblent le plus à la Bourgogne.',appellations:'Margaret River GI (Geographic Indication WA) est subdivisée en sous-zones :\n  Northern Margaret River → plus chaud, Cabernet et Chardonnay\n  Central Margaret River → cœur de la région, meilleurs terroirs\n  Southern Margaret River → plus frais, Pinot Noir émergent\n\nProducteurs références Chardonnay : Leeuwin Estate (Art Series), Cullen, Vasse Felix, Pierro, Stella Bella.',evolution:'Margaret River Chardonnay évolue comme les meilleurs blancs de Bourgogne :\n\n1-4 ans → Citron, nectarine, pamplemousse, noisette. Frais et élégant.\n4-10 ans → La minéralité marine s\'affirme. Complexité croissante. Texture crémeuse sans lourdeur.\n10-20 ans → Leeuwin Art Series des grandes années : profondeur comparable à un 1er Cru de Puligny.\n\nL\'un des rares Chardonnay hors Bourgogne capables de vieillir 15+ ans avec dignité.',degustation:'Margaret River Chardonnay à l\'aveugle :\nCOULEUR : Jaune dorée pâle à modérée. Brillant.\nNEZ : Citron frais, nectarine, pamplemousse, noisette légère. Notes marines légères. Plus délicat et frais que la plupart des Chardonnay australiens.\nBOUCHE : Équilibre acidité/alcool excellent. Corps médium. Texture crémeuse sans lourdeur. Finale minérale.\n\nTest : si c\'est le Chardonnay le plus \'bourguignon\' du groupe hors Bourgogne — Margaret River.',histoire:'Margaret River a été identifiée comme zone viticole potentielle en 1965 par le Dr. John Gladstones (université de l\'Australie Occidentale) sur la base d\'une analyse climatologique. Les premières vignes plantées en 1967 (Vasse Felix).\nLeeuwin Estate (fondé 1972 par l\'invitation de Robert Mondavi) a lancé la réputation internationale de la région avec son Art Series Chardonnay — régulièrement comparé aux Grands Crus bourguignons dans les concours internationaux.'}},

  'cabernet-sauvignon':{
    fr:[
      {n:'Graves (galets quartzeux sur argile)',r:'Médoc — Pauillac, Margaux, Saint-Julien',a:'Pliocène — 2-5 Ma',
       d:'Galets de quartz roulés par la Garonne ancienne, déposés sur argile rouge. Drainage parfait + chaleur emmagasinée le jour et restituée la nuit = radiateur naturel. Sans les graves, le Cabernet Sauvignon — un cépage tardif — ne mûrirait pas sous le climat atlantique pluvieux du Médoc. Les \'croupes\' de graves (éminences de 10-40 m) abritent tous les grands châteaux.',
       s:{a:68,t:90,c:82,g:92},ar:['Cassis','Cèdre','Graphite','Tabac','Poivron rôti (jeune)'],
       k:'Graves = radiateur naturel. La chaleur solaire emmagasinée la journée est restituée aux raisins la nuit. Sans ce mécanisme, le Cab Sauv ne mûrirait pas à Bordeaux.',fiche:{geographie:'Le Médoc est une presqu\'île de 80 km entre l\'Atlantique et l\'estuaire de la Gironde. L\'estuaire joue un rôle de thermostat naturel : ses 300 000 ha d\'eau tempèrent les hivers (pas de gel) et les étés (fraîcheur nocturne). Les meilleures propriétés sont en 1ère ligne face à l\'estuaire. Les \'croupes\' de graves (éminences de 10-40 m) abritent tous les grands châteaux.',geologie_detail:'Galets de quartz roulés par la Garonne ancienne sur argile rouge.\n\nFonctions des graves :\n1. Drainage parfait — le Cabernet Sauvignon déteste l\'eau stagnante\n2. Emmagasinage de la chaleur solaire (400 W/m²) → restitution nocturne aux raisins\n3. Réflexion de la lumière vers les grappes basses\n\nSans les graves, le Cabernet Sauvignon ne mûrirait pas sous le climat atlantique pluvieux du Médoc. Les croupes de graves (de 10 à 40 m de hauteur seulement !) concentrent les meilleures propriétés.',appellations:'Classification de 1855 (créée pour l\'Exposition Universelle de Paris) :\n  1er Grand Cru Classé : Lafite-Rothschild, Latour, Mouton Rothschild (ajouté en 1973), Margaux, + Haut-Brion (Pessac)\n  2e Cru Classé : Léoville-Las Cases, Pichon-Baron, Cos d\'Estournel...\n  3e, 4e, 5e Cru Classé : ...\n  Cru Bourgeois : niveau supérieur non classifié\n\nFait notable : la classification de 1855 n\'a été modifiée qu\'UNE FOIS en 170 ans (promotion de Mouton en 1er Cru en 1973).',evolution:'Le Cabernet du Médoc est conçu pour le temps long :\n\n0-5 ans : Rouge sombre, presque opaque. Tanins austères. Cassis, poivron, cèdre. Difficile d\'accès.\n5-15 ans : Les tanins s\'assouplissent. Le cèdre, le graphite et le cuir émergent. Premières dégustations sérieuses.\n15-30 ans : Apogée pour les Crus Classés. Bouquet tertiaire complexe : tabac, boîte à cigares, truffe, gibier.\n30-50 ans : Réservé aux 1ers Crus de grandes années. Latour 1961, Mouton 1945 : encore parfaits à 60 ans.',degustation:'Médoc à l\'aveugle :\nCOULEUR : Rouge profond, presque opaque (jeune). Grenat sombre (évolué).\nNEZ : Cassis très mûr, cèdre, graphite, poivron rôti (jeune). Cuir, tabac, truffes (évolué).\nBOUCHE : Tanins puissants mais soyeux. Corps imposant. Alcool modéré pour la concentration (12.5-13.5%). Longue finale sèche.\n\nDISTINGUER de Saint-Émilion : le Médoc est plus sec, plus austère, plus long. Saint-Émilion est plus opulent, plus précoce.',histoire:'Le Classement de 1855 : Napoléon III commande une classification des vins de Bordeaux pour l\'Exposition Universelle de Paris. Les courtiers de la Place de Bordeaux établissent une hiérarchie basée sur le prix des vins au fil des décennies.\nMouton Rothschild (2e Cru en 1855) passe 120 ans à essayer de devenir 1er Cru. Philippe de Rothschild crée le slogan \'Premier ne puis, Second ne daigne, Mouton suis\' et finance un lobbying intense. En 1973, Jack Lang obtient le décret présidentiel.'}},
      {n:'Calcaire éocène + argile',r:'Saint-Émilion — plateau calcaire et côtes argileuses',a:'Éocène — 35-40 Ma',
       d:'Plateau calcaire de Saint-Émilion : calcaire compact sur argile froide. La rive droite est dominée par le Merlot et le Cabernet Franc — le Cabernet Sauvignon y est minoritaire car il mûrit plus lentement. Quand il est bien exposé sur les côtes argilo-calcaires (Figeac, Cheval Blanc), il apporte une structure de garde incomparable.',
       s:{a:65,t:82,c:80,g:88},ar:['Mûre','Prune séchée','Violette','Tabac blond'],
       k:'Calcaire + argile froide de rive droite = maturité plus lente du Cab Sauv. C\'est pourquoi le Merlot domine ici — il mûrit 2 semaines plus tôt sur ce sol.',fiche:{geographie:'Saint-Émilion est sur la rive droite de la Dordogne, à l\'opposé du Médoc (rive gauche de la Gironde). Topographie vallonnée avec un plateau calcaire central, des côtes argilo-calcaires et une plaine argileuse au bas. Le Cabernet Sauvignon est minoritaire ici (le Merlot et le Cabernet Franc dominent) mais sur les meilleures côtes calcaires, il contribue à la structure de garde.',geologie_detail:'Trois types de sols à Saint-Émilion :\n1. Plateau calcaire (Figeac, Cheval Blanc) → calcaire éocène compact + argile argileuse froide. Le Cabernet Franc et le Cabernet Sauvignon y excellent.\n2. Côtes argilo-calcaires (Ausone, Angélus) → argile + calcaire érodé. Terrasse exposée. Meilleure exposition.\n3. Plaine de sables et de graves (près de Pomerol) → argile sableuse. Merlot domine totalement.\n\nConclusion : le Cabernet Sauvignon réussit uniquement sur les côtes argilo-calcaires bien exposées — il ne mûrit pas dans la plaine argileuse froide.',appellations:'Saint-Émilion a sa propre classification (indépendante du classement 1855 du Médoc) :\n  Saint-Émilion Grand Cru AOC → niveau de base\n  Saint-Émilion Grand Cru Classé → ~60 propriétés\n  Saint-Émilion Premier Grand Cru Classé B → ~14 propriétés (Angélus, Beauséjour, Beau-Séjour Bécot...)\n  Saint-Émilion Premier Grand Cru Classé A → Ausone + Cheval Blanc + Figeac (depuis 2022) + Pavie + Angélus (depuis 2022)\n\nLa classification est révisée tous les 10 ans — ce qui crée des controverses.',evolution:'Plus accessible précocement que le Médoc :\n0-3 ans : Rouge rubis profond. Mûre, prune, violette. Tanins ronds (Merlot majoritaire).\n3-10 ans : Complexité croissante. Cuir léger, épices, truffes naissantes. Point idéal.\n10-25 ans : Les 1ers GC (Ausone, Cheval Blanc) atteignent leur plénitude. Profondeur remarquable.\n25+ ans : Réservé aux grandes années. Ausone 1995 ou 2000 : encore magnifique à 30 ans.',degustation:'Saint-Émilion à l\'aveugle :\nCOULEUR : Rouge rubis profond mais légèrement moins opaque que le Médoc.\nNEZ : Mûre, violette, prune, épices chaudes (Merlot dominant). Moins de graphite que le Médoc.\nBOUCHE : Tanins plus ronds et plus opulents que le Médoc (le Merlot arrondit). Plus accessible jeune. Finale plus charnue.\n\nLa règle : si c\'est un grand Bordeaux mais plus opulent et moins austère — probablement rive droite (Saint-Émilion, Pomerol).',histoire:'Saint-Émilion est une ville médiévale classée au Patrimoine Mondial de l\'UNESCO (1999) — à la fois pour son vignoble et son architecture romane (catacombes, église monolithique creusée dans le calcaire).\nCheval Blanc est le seul château classé Premier Grand Cru A planté à 58% en Cabernet Franc — exceptionnel pour un vin de ce niveau.\nL\'affaire Vins de Bordeaux (2012) : une révision du classement de Saint-Émilion donne lieu à des procès entre châteaux dégradés et promus. La classification est suspendue puis révisée.'}},
      {n:'Schiste et argile de garrigue',r:'Languedoc — Pic Saint-Loup, Coteaux du Languedoc',a:'Hérault, Oligocène — 25-35 Ma',
       d:'Schiste et argile brune des garrigues languedociennes. Climat méditerranéen chaud et sec — le Cabernet Sauvignon y mûrit facilement, souvent trop. Les meilleurs terroirs sont en altitude (200-500 m) où la fraîcheur nocturne préserve l\'acidité. Style très différent de Bordeaux : plus chaleureux, plus épicé, moins cérébral.',
       s:{a:62,t:85,c:80,g:75},ar:['Cassis mûr','Garrigue','Laurier','Épices méditerranéennes','Cacao'],
       k:'Languedoc : chaleur méditerranéenne = Cabernet mûr facilement. L\'altitude est le seul moyen de préserver la fraîcheur. Plus le Cab Sauv est chaud, plus il perd sa structure.',fiche:{geographie:'Le Languedoc-Roussillon est la plus grande région viticole de France (220 000 ha). Les terroirs à Cabernet Sauvignon de qualité sont en altitude : Pic Saint-Loup, Grès de Montpellier, Sommières (200-500 m). Ces zones fraîches (15-20°C de moins que la plaine l\'été) permettent une maturation lente avec préservation de l\'acidité.',geologie_detail:'Schiste et argile brune des garrigues languedociennes, associés à des grès calcaires.\n\nImpact sur le Cabernet : climat méditerranéen = chaleur intense. Sans l\'altitude, le Cabernet surmûrit et donne des vins alcooleux sans fraîcheur.\n\nSur schiste pauvre et drainant en altitude : le Cabernet reste tendu, épicé, avec une acidité préservée. Le schiste languedocien donne une minéralité saline absente à Bordeaux.',appellations:'Appellations Languedoc pour Cabernet :\n  Pic Saint-Loup AOC → Cabernet Sauvignon + Syrah + Grenache\n  Grès de Montpellier AOC → Cabernet autorisé\n  Languedoc AOC → appellation générale. Cabernet en assemblage.\n  IGP Pays d\'Oc → Cabernet Sauvignon cépage mention — très répandu à l\'export\n\nNote : le Cabernet Sauvignon est moins utilisé dans les AOC languedociennes strictes que la Syrah ou le Grenache — mais dominant dans les IGP.',evolution:'Le Languedoc offre deux styles :\n\nIGP Pays d\'Oc (plaine) : 1-3 ans. Fruité direct, cassis accessible, tanins moyens. Vin de grande consommation.\nAOC altitude (Pic Saint-Loup, Grès) : 2-8 ans. Plus de tension et d\'épices méditerranéennes.\n\nLes grands vins de garrigue (mas de Daumas Gassac, Grange des Pères) vieillissent 15-25 ans.',degustation:'Languedoc Cabernet à l\'aveugle :\nCOULEUR : Rouge rubis profond, très coloré (soleil intense).\nNEZ : Cassis mûr (parfois confituré), garrigue (thym, romarin), laurier, épices chaudes.\nBOUCHE : Tanins fermes, alcool élevé (13.5-15%), corps généreux. Moins de cèdre/graphite que le Médoc.\n\nDISTINGUER du Médoc : le Languedoc a la garrigue au nez et plus d\'alcool en bouche. Le Médoc a le cèdre et est plus austère.',histoire:'Le Languedoc a une histoire viticole millénaire : Grec (VIe s. av JC), Romain (Pézenas = capital viticole romaine), médiéval.\nAu XXe siècle, le Languedoc produisait des vins de table médiocres en quantité industrielle. La crise de surproduction des années 1970-80 a forcé la reconversion qualitative.\nAims Dutheil de la Rochère (Mas de Daumas Gassac, 1978) a montré qu\'un Cabernet Sauvignon de niveau grand Bordeaux était possible dans les schistes du Languedoc.'}},
      {n:'Terra Rossa sur calcaire',r:'Coonawarra — Australie du Sud',a:'Calcaire Tertiaire + argile quaternaire',
       d:'Fine couche de terre rouge argileuse (10-50 cm de profondeur) sur calcaire blanc compact. Drainage parfait (la Terra Rossa est poreuse) mais la racine atteint vite le calcaire. Chaleur du sol rouge + fraîcheur calcaire = maturité parfaite. Le seul terroir australien systématiquement comparé aux Cabernets de Médoc pour leur structure et leur minéralité.',
       s:{a:72,t:92,c:85,g:92},ar:['Cassis','Menthe','Euycalyptus','Cèdre','Graphite'],
       k:'Terra Rossa (rouge) sur calcaire (blanc) = le plus grand terroir australien pour Cabernet. Les seuls vins d\'Australie comparables au Médoc en structure et longévité.',fiche:{geographie:'Terra Rossa de Coonawarra : une bande étroite de 15 km × 2 km de terre rouge argileuse sur calcaire blanc compact, dans la région la plus froide d\'Australie du Sud (37°S, 200 km du Golfe Saint-Vincent). Latitude équivalente à La Rochelle en France. Platitude totale — l\'altitude est de 50-80 m seulement.',geologie_detail:'Terra Rossa = terre rouge argileuse de 10-50 cm d\'épaisseur sur calcaire compact de couleur blanche.\n\nMécanisme unique :\n1. La Terra Rossa rouge absorbe la chaleur solaire (couleur sombre) → maturation efficace\n2. Le calcaire sous-jacent maintient la fraîcheur et l\'acidité → tension européenne\n3. Le drainage est parfait (la Terra Rossa est poreuse) → pas d\'excès d\'eau\n\nC\'est l\'unique sol australien qui maintient une minéralité calcaire comparable aux Cabernets de Médoc.',appellations:'Coonawarra GI (Geographic Indication SA) :\n  Terroir délimité à la Terra Rossa strictement\n  Pas de hiérarchie officielle entre domaines (pas de \'Classement\')\n\nProducteurs références : Wynns Coonawarra Estate (plus de 150 ans d\'histoire), Katnook Estate, Parker Estate, Bowen Estate, Majella\n\nCoonawarra est aussi réputé pour : Shiraz (Cabernet Sauvignon reste le roi mais Shiraz s\'y développe bien aussi)',evolution:'Le Cabernet de Coonawarra est conçu pour le vieillissement :\n0-5 ans : Cassis, menthe australienne, eucalyptus, cèdre. Tanins fermes.\n5-15 ans : Les tanins s\'affinent. Graphite, cuir, cedre. Style bordelais émergent.\n15-30 ans : Les meilleurs (Wynns John Riddoch, Katnook Odyssey) rivalisent avec des Crus Classés bordelais en complexité et en élégance.\n\nLe Cabernet de Coonawarra est l\'un des rares Cabernets australiens capable de vieillir 25-30 ans avec dignité.',degustation:'Coonawarra à l\'aveugle :\nCOULEUR : Rouge grenat sombre mais pas aussi opaque que Barossa.\nNEZ : Cassis, menthe fraîche, eucalyptus (signature australienne !), cèdre, graphite.\nBOUCHE : Tanins fins et soyeux pour l\'Australie. Acidité plus élevée que d\'autres zones australiennes. Corps médium-plus. Finale minérale et longue.\n\nTest décisif : la menthe et l\'eucalyptus. Ces arômes terpéniques sont la carte d\'identité du Cabernet de Coonawarra — absents à Bordeaux.',histoire:'John Riddoch a planté les premières vignes à Coonawarra en 1890 en reconnaissant la valeur de la Terra Rossa. La propriété a changé de mains plusieurs fois avant que Wynns Coonawarra Estate ne devienne le pilier de la région.\n2001 : Coonawarra est reconnu officiellement comme GI distincte — après une bataille juridique de 20 ans avec des producteurs voisins qui voulaient utiliser le nom sans posséder de Terra Rossa.\nLa \'Coonawarra Wine War\' est l\'un des exemples les plus célèbres de la défense d\'un terroir géographique dans le monde viticole.'}},
