  'chenin-blanc':{
    fr:[
      {n:'Tuffeau calcaire poreux',r:'Vouvray — Tours, Amboise (Indre-et-Loire)',a:'Turonien — 85-90 Ma',
       d:'Calcaire crayeux très poreux (40% de vide), creusé naturellement en caves troglodytes. Le tuffeau retient l\'eau comme une éponge et la libère lentement. Il permet TOUS les styles selon l\'humidité automnale : sec (bon été), demi-sec (automne humide), moelleux (botrytis partiel), liquoreux (botrytis complet). Le même vigneron fait des vins radicalement différents selon l\'année sans changer son approche — c\'est le sol qui décide.',
       s:{a:88,t:0,c:58,g:92},ar:['Coing','Pomme verte','Miel (âge)','Craie','Cire d\'abeille'],
       k:'Le tuffeau \'décide\' du style du vin selon l\'année — pas le vigneron. Sec ou liquoreux ? C\'est le sol et la météo automnale. Le tuffeau est le sol le plus versatile de la viticulture mondiale.',fiche:{geographie:'Vouvray est sur la rive droite de la Loire, à 10 km à l\'est de Tours. Les vignes sont creusées dans le tuffeau calcaire — les caves troglodytes maintiennent 12°C constants toute l\'année. Exposition au Sud. Le Breton (Chenin Blanc local) est le seul cépage autorisé.',geologie_detail:'Tuffeau calcaire poreux (Turonien, 85-90 Ma). 40% de vide dans le sol. Retient l\'eau comme une éponge. Permet TOUS les styles selon l\'humidité automnale : sec (bon été), demi-sec (automne humide), moelleux (botrytis partiel), liquoreux (botrytis complet). Le sol décide du style — pas le vigneron.',appellations:'Vouvray AOC : Sec/Demi-sec/Moelleux/Liquoreux/Brut — selon l\'année. Montlouis-sur-Loire AOC (rive gauche) : même sol, même cépage, style légèrement différent. Caves : Huet, Foreau (Clos Naudin), Champalou, Pichot.',evolution:'Vouvray est le vin blanc le plus versatile du monde. Sec : 5-15 ans. Moelleux : 10-30 ans. Liquoreux : 20-50 ans. La même vigne peut donner des vins de 5 ans de garde (sec) ou de 50 ans (liquoreux) selon la météo automnale.',degustation:'À l\'aveugle : COULEUR jaune pâle à dorée. NEZ coing, pomme verte, miel (âge), craie minérale. BOUCHE acidité vive, texte selon style. Test : si c\'est le blanc le plus versatile et le plus polyvalent — Vouvray sur tuffeau.',histoire:'Le tuffeau a été utilisé pour construire les châteaux de la Loire (Chambord, Chenonceau) — même pierre pour les vins et les monuments. Gaston Huet (Domaine Huet) est la référence absolue de Vouvray : ses Clos du Bourg, Haut-Lieu et Le Mont ont redéfini la qualité du Chenin Blanc dans les années 1950-2000.'}},
      {n:'Schiste métamorphique précambrien',r:'Savennières — Coulée de Serrant, Roche aux Moines',a:'Précambrien — 500-600 Ma',
       d:'Schiste très ancien, pauvre, acide et drainant. Impose un style exclusivement sec et tendu, de longue garde — jamais de liquoreux sur ce sol. La Roche aux Moines est citée dans des textes de 1227 (parmi les plus anciennes appellations délimitées de France). Nicolas Joly à la Coulée de Serrant pratique la biodynamie depuis 1980 — ses vins vieillissent 30-50 ans.',
       s:{a:92,t:0,c:62,g:96},ar:['Coing tendu','Pierre à fusil','Safran','Cire (âge)','Noix (âge)'],
       k:'Schiste précambrien = Chenin toujours sec, toujours minéral, jamais liquoreux. Le sol dicte le style et interdit le sucre résiduel. Schiste = austérité obligatoire.',fiche:{geographie:'Savennières est au nord de la Maine (affluent de la Loire), en Anjou. Vignoble de 150 ha seulement — l\'un des plus petits AOC de France. La Roche aux Moines (33 ha dans Savennières) est citée dans un texte de 1227 — parmi les plus anciens vignobles délimités de France.',geologie_detail:'Schiste métamorphique précambrien (500-600 Ma). Pauvre, acide, drainant. Impose un style exclusivement SEC et de longue garde. Aucun liquoreux possible sur ce sol — le schiste interdit le sucre résiduel par sa structure drainante.',appellations:'Savennières AOC : Sec uniquement. Coulée de Serrant (7 ha, Nicolas Joly — biodynamie depuis 1980). Roche aux Moines (33 ha). Savennières-Roche aux Moines (sous-appellation). Domaine du Closel, Domaine aux Moines.',evolution:'Savennières est l\'un des vins blancs secs à plus grand potentiel de garde. Jeune (1-5 ans) : austère, acide, fermé — souvent décevant. 5-15 ans : complexité croissante. Safran, cire, minéralité schisteuse. 15-30 ans : les Coulée de Serrant de grandes années atteignent une profondeur légendaire.',degustation:'À l\'aveugle : COULEUR jaune dorée (âge). NEZ coing tendu, pierre à fusil, safran (âge), cire d\'abeille. BOUCHE acidité très élevée et sèche, corps médium, finale longue et austère. Test : si c\'est le Chenin Blanc le plus austère et le moins aimable — Savennières sur schiste.',histoire:'Nicolas Joly (Coulée de Serrant) est l\'un des pionniers mondiaux de la biodynamie viticole depuis 1980. Ses conférences sur la biodynamie ont influencé des milliers de vignerons dans le monde entier.'}},
      {n:'Schiste + calcaire (Quarts de Chaume)',r:'Bonnezeaux et Quarts de Chaume — Layon (Maine-et-Loire)',a:'Précambrien + calcaire',
       d:'Les coteaux du Layon produisent les grands Chenin liquoreux par botrytis. Quarts de Chaume (269 ha) et Bonnezeaux sont sur schiste précambrien très exposé au sud. Les brumes matinales du Layon favorisent le Botrytis cinerea. Quarts de Chaume est le seul Grand Cru de Loire pour un vin liquoreux — sélection parcellaire draconienne.',
       s:{a:72,t:0,c:70,g:96},ar:['Abricot confit','Coing rôti','Miel de safran','Gingembre confit','Or liquide'],
       k:'Schiste exposé + brumes du Layon + botrytis = liquoreux de Loire de grande garde. Quarts de Chaume est le seul Grand Cru de Loire pour les blancs liquoreux.',fiche:{geographie:'Les coteaux du Layon (Maine-et-Loire) forment un affluent de la Loire dont les coteaux sont exposés Sud-Est. Les brumes matinales du Layon favorisent le Botrytis cinerea. Quarts de Chaume (269 ha) et Bonnezeaux (92 ha) sont les deux plus grandes appellations de liquoreux de Loire.',geologie_detail:'Schiste précambrien très exposé au sud sur les coteaux du Layon. La combinaison schiste drainant + exposition sud + brumes automnales crée les conditions idéales pour le botrytis sélectif. Quarts de Chaume : sélection parcellaire draconienne — seuls les meilleurs sols sont admis.',appellations:'Quarts de Chaume AOC Grand Cru (seul GC de Loire pour les blancs liquoreux). Bonnezeaux AOC. Coteaux du Layon AOC + Villages (Beaulieu, Chaudefonds, Faye, Rablay, Rochefort, Saint-Aubin, Saint-Lambert).',evolution:'Les liquoreux de Loire évoluent lentement et magnifiquement. 1-5 ans : abricot confit, coing rôti, miel frais. 5-20 ans : safran, gingembre confit, or liquide. 20-50 ans : Quarts de Chaume et Bonnezeaux des grandes années — parmi les plus grands liquoreux du monde. Rivalisent avec Sauternes.',degustation:'À l\'aveugle : COULEUR ambre dorée profonde. NEZ abricot très confit, coing rôti, miel de safran, gingembre confit, botrytis perceptible. BOUCHE riche, doux, acidité équilibrante, finale interminable. Test : si c\'est le liquoreux le plus exotique et le plus épicé — Loire sur schiste (Quarts de Chaume, Bonnezeaux).',histoire:'Le Layon est mentionné depuis le Xe siècle dans des documents mérovingiens. Le Quarts de Chaume tire son nom du système féodal : le seigneur prélevait le \'quart\' des récoltes sur ces parcelles d\'excellence.'}},
      {n:'Calcaire et sable (Saumur)',r:'Saumur-Champigny et Saumur blanc',a:'Turonien — 85 Ma',
       d:'Calcaire et tuffeau avec davantage de sable en profondeur. Le Chenin de Saumur est généralement plus simple et plus précoce que Vouvray ou Savennières. L\'appellation Saumur blanc est la base de la pyramide du Chenin Loire. Les bulles de Crémant de Loire viennent majoritairement de Chenin sur ce sol — l\'acidité naturelle est idéale pour la méthode champenoise.',
       s:{a:84,t:0,c:55,g:68},ar:['Pomme','Poire','Citron','Fleurs de pomme','Craie légère'],
       k:'Saumur calcaire = base de la pyramide du Chenin Loire. Acidité naturelle idéale pour les bulles du Crémant de Loire. Le sol simple donne le Chenin le plus accessible.',fiche:{geographie:'Saumur est en Anjou, à confluence de la Loire et du Thouet. Le tuffeau calcaire est omniprésent — toute la ville de Saumur et ses environs sont creusés dans ce calcaire. Les caves en tuffeau (miles de galeries) servent à l\'élevage des vins mais aussi aux champignons de Paris.',geologie_detail:'Tuffeau calcaire (Turonien, 85-90 Ma) avec davantage de sable en profondeur qu\'à Vouvray. Donne un Chenin plus simple et plus léger que Vouvray. L\'acidité naturelle est idéale pour les bulles du Crémant de Loire.',appellations:'Saumur AOC : Blanc (Chenin) + Rouge (Cab Franc + Cab Sauv) + Rosé. Saumur Mousseux (bulles en méthode traditionnelle). Crémant de Loire AOC : bulles de qualité, Chenin dominant. Saumur-Champigny : rouge AOC réputé (Cab Franc).',evolution:'Saumur blanc : 1-3 ans. Fruité direct, citron, pomme, fleurs de pomme. Accessible rapidement. Le Crémant de Loire est à boire jeune (1-2 ans) pour préserver la fraîcheur des bulles.',degustation:'À l\'aveugle : COULEUR jaune pâle. NEZ pomme, citron, craie légère. BOUCHE légère, fraîche, simple. Test : si c\'est le Chenin Loire le plus accessible et le moins complexe — Saumur blanc.',histoire:'La ville de Saumur est célèbre pour son École Nationale d\'Équitation (Cadre Noir). Sa tradition viti-vinicole est ancienne mais c\'est le Crémant de Loire qui a relancé son image dans les années 1990-2000.'}},
    ],
    monde:[
      {n:'Granit altéré du Paardeberg',r:'Swartland — Paardeberg, Malmesbury (Afrique du Sud)',a:'Précambrien — 500-600 Ma',
       d:'Granit très altéré et pauvre sur la colline du Paardeberg, en culture sèche sans irrigation dans une région semi-aride (400 mm de pluie/an). Les vieilles vignes de Chenin Blanc (Steen local) de 40-70 ans creusent profondément leurs racines. La \'Swartland Revolution\' des années 2010 (Adi Badenhorst, Craig Hawkins, Eben Sadie) a révélé la grandeur de ce cépage sur granit africain — vins complexes se vendant au niveau de grands Loire.',
       s:{a:85,t:0,c:62,g:90},ar:['Pêche blanche','Abricot','Noix fraîche','Pierre à fusil','Cire'],
       k:'Granit pauvre + vieilles vignes non-irriguées + Swartland Revolution = Chenin sud-africain aussi complexe que Loire. Un des plus grands succès de la viticulture mondiale des années 2010.',fiche:{geographie:'Swartland est un plateau semi-aride à 50 km au nord du Cap, en Afrique du Sud. \'Swartland\' = terre noire en afrikaans (du buisson fynbos qui noircit en été). Pas d\'irrigation pour les vieilles vignes — en culture sèche totale dans 400 mm de pluie/an. La \'Swartland Revolution\' (années 2010) a révolutionné le vin sud-africain.',geologie_detail:'Granit très altéré et pauvre du Paardeberg (colline centrale). Surface sableuse sur granite profond. Les vieilles vignes de Steen (Chenin Blanc local, 40-70 ans) creusent profondément leurs racines. Aucune irrigation possible — stress hydrique intense. Rendements naturellement bas (15-20 hl/ha).',appellations:'Swartland Wine of Origin (WO). Pas de hiérarchie officielle. Les vignerons de la Swartland Revolution : Adi Badenhorst (Swartland Winery), Craig Hawkins (Testalonga), Eben Sadie (Columella, Palladius), Chris Alheit. Leurs vins se vendent à des prix de Grand Cru de Loire.',evolution:'Swartland Chenin évolue comme un grand Loire : 1-3 ans : pêche blanche, abricot, minéralité granitique. 3-8 ans : Complexité croissante. Noix fraîche, cire, pierre à fusil africaine. 8-15 ans : Les meilleurs (Alheit Cartology, Sadie Palladius) atteignent une profondeur comparable à un Savennières.',degustation:'À l\'aveugle : COULEUR jaune dorée. NEZ pêche blanche, abricot, noix fraîche, pierre à fusil. BOUCHE acidité élevée pour l\'Afrique du Sud, corps médium, texture crémeuse. Test : si c\'est le Chenin le plus exotique avec de la minéralité — Swartland sur granit.',histoire:'L\'apartheid a détruit la réputation des vins sud-africains (1980-1990). La renaissance qualitative depuis 1994 a permis aux vignerons de voyager et d\'apprendre. La Swartland Revolution (2010s) est l\'une des histoires les plus fascinantes du vin mondial — une région oubliée devenue l\'une des plus excitantes au monde.'}},
      {n:'Schiste d\'origine marine (Walker Bay)',r:'Walker Bay — Hemel-en-Aarde (Afrique du Sud)',a:'Paléozoïque — 400 Ma',
       d:'Schiste d\'origine marine dans une vallée baignée par les eaux froides du courant des Aiguilles. Temperature maximale en été : 22°C seulement. Le Chenin Blanc de Hemel-en-Aarde est le plus frais d\'Afrique du Sud — proche du style de Savennières en termes de minéralité et d\'acidité. Région récente (premières vignes dans les années 1990) mais déjà reconnue internationalement.',
       s:{a:88,t:0,c:58,g:82},ar:['Citron','Pêche blanche','Pierre marine','Craie','Herbes sèches'],
       k:'Walker Bay : courant froid + schiste marin = Chenin le plus frais d\'Afrique du Sud. Style proche de Savennières, étonnant sous le soleil africain.',fiche:{geographie:'Walker Bay est à 100 km au sud-est du Cap, baignée par le courant froid des Aiguilles (Océan Indien). Hemel-en-Aarde (\'Paradis sur Terre\' en afrikaans) est la vallée centrale. Températures maximales estivales : 22°C seulement — la plus fraîche d\'Afrique du Sud. Premières vignes plantées dans les années 1990.',geologie_detail:'Schiste d\'origine marine (Paléozoïque, 400 Ma). Sol pauvre, fissuré, très drainant. La double influence maritime (courant froid des Aiguilles + brises de mer) maintient des températures étonnamment basses pour l\'Afrique du Sud.',appellations:'Walker Bay WO : Hemel-en-Aarde Valley, Hemel-en-Aarde Ridge, Upper Hemel-en-Aarde Valley. Producteurs : Hamilton Russell (pionnier), Bouchard Finlayson, Creation, Storm.',evolution:'Walker Bay Chenin est le plus frais d\'Afrique du Sud : 1-3 ans : citron, pêche blanche, craie marine. 3-8 ans : Minéralité schisteuse croissante. Style proche d\'un Savennières frais. 8-15 ans : Potential de garde exceptionnel pour la région.',degustation:'À l\'aveugle : COULEUR jaune pâle. NEZ citron frais, pêche blanche, craie marine, pierre sèche. BOUCHE acidité très élevée pour l\'Afrique du Sud, corps léger-médium. Test : si c\'est le Chenin Blanc d\'Afrique du Sud le plus frais et le plus minéral — Walker Bay.',histoire:'Hamilton Russell Vineyards (fondé 1975) est le pionnier de Walker Bay — il a planté ici quand tout le monde disait que c\'était trop froid pour la vigne. Son Pinot Noir et son Chardonnay ont imposé Walker Bay comme la région des cépages \'bourguignons\' en Afrique du Sud.'}},
    ]
  },
  'savagnin':{
    fr:[
      {n:'Marnes bleues (argiles calcaires imperméables)',r:'Arbois — Pupillin, Les Planches (Jura)',a:'Lias moyen — 180-190 Ma',
       d:'Argiles calcaires imperméables et bleues-grises du Lias. Sol froid, compact, humide — il ralentit considérablement la maturation du Savagnin. Cette lenteur impose une acidité naturelle très haute au moment des vendanges. C\'est cette acidité exceptionnelle — et elle seule — qui permet à la Syrah de Savagnin de résister 6 ans sous le voile de levures sans s\'oxyder irrémédiablement. Sans ces marnes, pas de Vin Jaune.',
       s:{a:90,t:0,c:65,g:96},ar:['Noix fraîche','Curry','Champignons secs','Amande','Épices jaunes'],
       k:'Marnes bleues = maturation lente = acidité haute = Vin Jaune possible. La géologie jurassienne est la condition sine qua non du vieillissement sous voile. Sans ce sol, le style n\'existe pas.',fiche:{geographie:'Arbois (Jura) : 1ère AOC de France créée en 1936. Vignoble sur le piémont du massif jurassien à 250-400 m d\'altitude. Louis Pasteur est né ici (Dole, 1822) et a grandi à Arbois — ses recherches fondamentales sur la fermentation ont commencé en observant les vins de son père.',geologie_detail:'Marnes bleues = argiles calcaires imperméables du Lias (180-190 Ma). Sol froid, compact, humide. Ralentit la maturation du Savagnin → acidité naturelle très haute maintenue. C\'est cette acidité élevée qui permet au vin de résister 6 ans sous le voile de levures sans s\'oxyder.',appellations:'Arbois AOC : Rouge (Poulsard, Trousseau, Pinot Noir) + Blanc (Savagnin ouillé ou Vin Jaune) + Vin Jaune + Vin de Paille + Crémant du Jura. Domaines : Rolet, Tissot, Overnoy, Ganevat.',evolution:'Vin Jaune : 6 ans 3 mois minimum d\'élevage sous voile de levures. Clavelin de 62 cl. Peut vieillir 50-100 ans. Ouverture du Vin Jaune : cérémonie locale (Percée du Vin Jaune, 1er dimanche de février).',degustation:'À l\'aveugle : COULEUR jaune ambre profond. NEZ noix fraîche, curry, champignons secs, amande, xérès sec. BOUCHE puissant, acide, oxydatif contrôlé, finale de noix très longue. Inimitable — aucun autre vin au monde ne ressemble au Vin Jaune.',histoire:'Louis Pasteur observe les cuves de son père vigneron à Arbois pour comprendre pourquoi le vin \'tourne\'. Ses recherches fondamentales (1857) sur les levures et la fermentation ont révolutionné la microbiologie mondiale. Sans Pasteur, pas de vaccins modernes ni de pasteurisation.'}},
      {n:'Calcaire du Lias',r:'Château-Chalon — Ménétru-le-Vignoble, Voiteur (Jura)',a:'Lias inférieur — 185-195 Ma',
       d:'Calcaire compact du Lias sur le promontoire fortifié de Château-Chalon (400 m). Plus ancien et plus compact que les marnes bleues d\'Arbois — le drainage y est meilleur. Ce sol donne les Vin Jaunes les plus complexes du Jura. La sélection est unique en France : chaque année, le syndicat des vignerons visite chaque parcelle et peut refuser une partie ou la totalité de la production si les conditions ne sont pas remplies.',
       s:{a:92,t:0,c:68,g:98},ar:['Noix de Grenoble','Épices orientales','Safran','Champignons des bois','Xérès'],
       k:'Château-Chalon : sélection annuelle des parcelles par le syndicat. Seule appellation où le syndicat peut refuser un millésime entier. Le calcaire du Lias + la sélection = les Vin Jaunes de garde les plus longs.',fiche:{geographie:'Château-Chalon est un village médiéval perché à 400 m d\'altitude dans le Jura, dominé par un château en ruines. Les vignes entourent le village sur des pentes très abruptes. La sélection des parcelles est unique en France : chaque année, le syndicat visite chaque parcelle et peut refuser tout ou partie de la production.',geologie_detail:'Calcaire compact du Lias (185-195 Ma) — plus ancien et plus compact que les marnes bleues d\'Arbois. Meilleur drainage. Donne les Vin Jaunes les plus complexes du Jura.',appellations:'Château-Chalon AOC : Vin Jaune UNIQUEMENT. Seule appellation au monde produite uniquement sur décision annuelle du syndicat de vignerons. Domaines : Jean Macle (la référence absolue), Berthet-Bondet, Domaine de l\'Octavin.',evolution:'Château-Chalon vieillit encore mieux qu\'Arbois. 6-15 ans : noix, curry, champignons. 15-30 ans : profondeur extraordinaire. 30-60 ans : les Jean Macle de grandes années survivent au siècle.',degustation:'À l\'aveugle : COULEUR ambre doré. NEZ noix de Grenoble, épices orientales, safran, champignons des bois, xérès Amontillado. Plus complexe qu\'un Arbois ordinaire. BOUCHE puissante et longue. Test : si c\'est le plus complexe des Vins Jaunes — Château-Chalon.',histoire:'Jean Macle est la maison de référence du Château-Chalon depuis 3 générations. Ses Vin Jaunes de 1976 ou 1989 sont encore parfaits — prouvant que le Vin Jaune peut vieillir un siècle dans les grandes années.'}},
      {n:'Marnes grises siliceuses',r:'L\'Étoile — Lons-le-Saunier (Jura)',a:'Lias inférieur siliceux',
       d:'Marnes grises (argiles siliceuses) différentes des marnes bleues calcaires d\'Arbois. L\'étoile de L\'Étoile vient de fossiles d\'échinodermes (oursins plats) en forme d\'étoile que l\'on trouve dans ce sol. Le Savagnin de L\'Étoile est plus léger et plus délicat que celui d\'Arbois. L\'étoile du sol fossile = une singularité géologique et visuelle unique.',
       s:{a:88,t:0,c:60,g:88},ar:['Noix légère','Amande fraîche','Champignons blancs','Citron sec','Fleurs sèches'],
       k:'L\'Étoile : marnes siliceuses + fossiles d\'échinodermes en étoile = Vin Jaune le plus léger du Jura. La silice donne moins de profondeur que le calcaire pur d\'Arbois.',fiche:{geographie:'L\'Étoile est un tout petit village du Jura (commune de L\'Étoile) dont le nom vient des fossiles d\'échinodermes (oursins plats) en forme d\'étoile que l\'on trouve dans le sol. Une curiosité géologique et visuelle unique.',geologie_detail:'Marnes grises siliceuses (différentes des marnes bleues calcaires d\'Arbois). La silice donne moins de profondeur que le calcaire pur — vins plus légers et plus fins.',appellations:'L\'Étoile AOC : Blanc (Savagnin + Chardonnay + Poulsard blanc) + Vin Jaune + Vin de Paille + Crémant. Domaine de l\'Étoile (seul grand domaine).',evolution:'L\'Étoile Vin Jaune est le plus léger du Jura. 6-15 ans : noix légère, amande, fleurs sèches. 15-25 ans : complexité modeste. Moins de garde que Château-Chalon ou Arbois des grandes années.',degustation:'À l\'aveugle : COULEUR ambre légère. NEZ noix légère, amande fraîche, fleurs sèches. BOUCHE légère pour un Vin Jaune. Test : si c\'est le Vin Jaune le plus léger et le plus délicat — L\'Étoile sur marnes grises.',histoire:'L\'Étoile est l\'appellation jurassienne la moins connue. Sa production confidentielle (500 000 bouteilles/an en tout) est massivement consommée localement. Le Crémant de L\'Étoile est excellent rapport Q/P.'}},
      {n:'Calcaire bajocien',r:'Côtes du Jura — diverses appellations',a:'Jurassique moyen (Bajocien) — 168-170 Ma',
       d:'Calcaire bajocien plus jeune que le Lias, plus fissuré et mieux drainé. Donne accès aux cépages blancs jurassiens (Savagnin, Chardonnay) et aux rouges (Poulsard, Trousseau). Le Savagnin ouillé (élevé en barrique sans voile, contretemps oxydatif) est vinifié de cette manière pour produire un blanc sec ordinaire — style très différent du Vin Jaune.',
       s:{a:85,t:0,c:62,g:75},ar:['Pomme verte','Noix légère','Fleurs blanches','Citron'],
       k:'Calcaire bajocien = base du Jura. Le Savagnin ouillé sur ce sol est un blanc sec ordinaire. C\'est le style de vieillissement — voile ou non — qui transforme le même cépage en deux vins radicalement différents.',fiche:{geographie:'Les Côtes du Jura est l\'appellation générale couvrant tout le vignoble jurassien (80 km N-S). Elle accueille les cépages et les styles les plus diversifiés : rouge, blanc, Vin Jaune, Vin de Paille, Crémant.',geologie_detail:'Calcaire bajocien (Jurassique moyen, 168-170 Ma) plus jeune que le Lias d\'Arbois. Plus fissuré et mieux drainé. Le Savagnin ouillé (élevé sans voile = pas de Vin Jaune) donne un blanc sec ordinaire très différent du Vin Jaune.',appellations:'Côtes du Jura AOC : Appellation la plus large. Rouge, blanc, vin jaune, vin de paille, crémant. Nombreux petits producteurs indépendants. Tendance aux vins naturels (Ganevat, Overnoy, Labet, Montbourgeau).',evolution:'Savagnin ouillé : 1-5 ans. Noix légère, pomme verte, citron. Style très différent du Vin Jaune. Les vins naturels non-ouillés (naturel) : 3-10 ans. Plus oxydatifs mais complexes.',degustation:'À l\'aveugle : Savagnin ouillé = COULEUR jaune dorée. NEZ pomme verte, noix légère, citron, fleurs blanches. BOUCHE acidité vive, corps médium, léger oxydatif. Test : si c\'est un blanc acide et légèrement \'vinaigré\' mais sans la puissance du Vin Jaune — Savagnin ouillé des Côtes du Jura.',histoire:'Le Jura est actuellement la région viticole la plus \'tendance\' de France chez les amateurs de vins naturels. Des producteurs comme Ganevat, Overnoy, Labet attirent des acheteurs du monde entier. Les bouteilles de Ganevat s\'arrachent à des prix comparables aux Grands Crus de Bourgogne.'}},
    ],
    monde:[
      {n:'Porphyre volcanique rouge',r:'Tramin — Alto Adige (Italie du nord)',a:'Permien — 250-280 Ma',
       d:'Roche magmatique rouge (porphyre) sur les versants occidentaux de la vallée de l\'Adige. C\'est le berceau mondial du cépage Traminer (= de Tramin). Sur ce sol volcanique natal, le Savagnin/Traminer est sec et minéral — très différent du Vin Jaune du Jura ou du Gewurztraminer d\'Alsace. La relation génétique Savagnin = Traminer a été confirmée par l\'ADN en 2004.',
       s:{a:80,t:0,c:60,g:78},ar:['Rose sèche','Pomme verte','Amande','Minéralité volcanique','Abricot fin'],
       k:'Porphyre volcanique de Tramin = berceau du Savagnin/Traminer. Sur ce sol natal, le cépage est sec et minéral. L\'ADN a confirmé en 2004 que Savagnin et Gewurztraminer sont le même cépage.',fiche:{geographie:'Tramin (Termeno sulla Strada del Vino) est un village de la vallée de l\'Adige en Alto Adige (Haut-Adige ou Tyrol du Sud). Altitude 200-700 m. La vallée est protégée des vents et très ensoleillée malgré la latitude nordique (46°N). L\'Adige coule entre des falaises calcaires.',geologie_detail:'Porphyre volcanique rouge (Permien, 250-280 Ma) sur les versants ouest de la vallée. Riche en potassium. C\'est sur ce sol natal que le Traminer (= de Tramin) a été sélectionné et nommé. Sur porphyre, le Savagnin/Traminer est sec et minéral — très différent de l\'Alsace.',appellations:'Alto Adige / Südtirol DOC (double nom IT + DE sur l\'étiquette). Termeno sulla Strada del Vino (commune). J. Hofstätter, Elena Walch, Tiefenbrunner (producteurs). Cépage sur l\'étiquette comme en Allemagne.',evolution:'Traminer d\'Alto Adige : 2-6 ans. Sec, minéral, finement floral. Ne vieilli pas longtemps car les terpènes s\'évaporent avec le temps. Servir à 10-12°C.',degustation:'À l\'aveugle : COULEUR jaune pâle. NEZ rose sèche, abricot fin, amande, minéralité volcanique — MOINS aromatique que le Gewurztraminer d\'Alsace. BOUCHE sèche, légère, minérale. Test : si c\'est le Traminer le plus délicat et le moins aromatique — Alto Adige sur porphyre.',histoire:'La relation génétique Savagnin (Jura) = Traminer (Alto Adige) = Gewurztraminer (Alsace) a été confirmée par l\'ADN en 2004. Ces trois noms désignent exactement le même cépage — cultivé différemment selon les terroirs et les traditions locales.'}},
    ]
  },
  'semillon':{
    fr:[
      {n:'Sable fin sur argile (Sauternes)',r:'Sauternes et Barsac — Château d\'Yquem, Climens, Suduiraut',a:'Sable éolien + argile et calcaire Éocène — 40 Ma',
       d:'Sol léger et sableux en surface sur argile. La clé n\'est pas le sol mais la hydrologie : la confluence de la Ciron (rivière froide des Landes) dans la Garonne (tiède, 18-20°C) génère chaque automne des brumes matinales. Ces brumes portent le Botrytis cinerea qui perfore la peau fine du Sémillon et déshydrate les baies. Résultat : concentration en sucres, acides et glycérol. Un raisin grisâtre et flétri — magnifiquement laid.',
       s:{a:58,t:0,c:72,g:95},ar:['Miel d\'acacia','Abricot confit','Safran','Cire d\'abeille','Raisin de Corinthe'],
       k:'Ce n\'est pas le sol qui fait Sauternes — c\'est la confluence hydrologique Ciron/Garonne. Unique au monde. Le sol n\'est que le support ; la géographie fluviale crée le miracle.',fiche:{geographie:'Sauternes est au confluent de la Ciron (froide) et de la Garonne (tiède). Les brumes matinales automnales provoquées par cette confluence thermique portent le Botrytis cinerea — la \'pourriture noble\'. Surface : 2 200 ha. Château d\'Yquem domine la butte la plus haute (75 m).',geologie_detail:'Sable fin sur argile. La clé n\'est pas le sol mais la hydrologie unique : confluence Ciron + Garonne = brumes automnales = botrytis concentrateur. Les baies perforées par le botrytis perdent 70% de leur eau. Un verre de Sauternes nécessite un pied de vigne entier.',appellations:'Sauternes AOC + Barsac AOC. Classification 1855 (révisée en 1867) : Château d\'Yquem (seul 1er Grand Cru Classé Supérieur). 11 Premiers Crus Classés (Climens, Guiraud, Lafaurie-Peyraguey...). Nombreux 2e Crus Classés.',evolution:'Les liquoreux de Sauternes évoluent lentement et magnifiquement. 1-5 ans : miel, abricot, safran. 5-20 ans : complexité croissante, cire d\'abeille, réglisse. 20-50 ans : les grands châteaux atteignent une profondeur légendaire. D\'Yquem des grandes années (1967, 1988, 2001) : vieillissement d\'un siècle.',degustation:'À l\'aveugle : COULEUR ambre dorée intense. NEZ miel d\'acacia, abricot confit, safran, cire d\'abeille, raisin de Corinthe. BOUCHE riche et doux mais jamais lourd (acidité équilibrante). Finale très longue. Test : si c\'est le blanc doux le plus opulent du groupe — Sauternes.',histoire:'D\'Yquem : propriété de la famille de Sauvage d\'Yquem depuis 1593, puis des Lur-Saluces. Rachetée par LVMH (Bernard Arnault) en 1999 pour 100M€. Seul 1er GC Classé Supérieur dans toute la Gironde. Prix d\'une bouteille (grand millésime) : 300-600 €. 1987 : millésime refusé — d\'Yquem est le seul château à oser ne pas produire un grand vin lors d\'une mauvaise année.'}},
      {n:'Graves et argile (Pessac-Léognan blanc)',r:'Pessac-Léognan — Château Haut-Brion Blanc, Domaine de Chevalier Blanc',a:'Graves quaternaire + argile',
       d:'Même graves que le Médoc (galets quartzeux sur argile) mais utilisées ici pour les blancs. Le Sémillon assemblé avec le Sauvignon Blanc produit des blancs secs de très longue garde. Haut-Brion Blanc est considéré comme l\'un des plus grands vins blancs de France. L\'élevage en barrique neuve donne une opulence que le seul tuffeau de Loire ne peut pas atteindre.',
       s:{a:65,t:0,c:74,g:88},ar:['Citron confit','Pamplemousse','Cire','Toast','Noisette grillée'],
       k:'Graves de Pessac + barrique + assemblage Sauvignon Blanc = Sémillon sec de garde, le plus complexe de France. Même sol que le Médoc rouge mais un cépage et un style totalement différents.',fiche:{geographie:'Pessac-Léognan (Graves) : vignes au sud de Bordeaux. Le Sémillon sur graves donne un blanc sec radicalement différent de Sauternes. Élevage en barrique. Assemblé avec Sauvignon Blanc.',geologie_detail:'Graves (galets quartzeux sur argile). Pour les blancs secs : le sol drainant et chaud donne un Sémillon riche et texturé. L\'élevage boisé complète la richesse naturelle du cépage.',appellations:'Pessac-Léognan AOC. Château Haut-Brion Blanc (seul 1er GCC pour les blancs). Domaine de Chevalier Blanc. Smith Haut Lafitte Blanc. Malartic-Lagravière Blanc. Classification 1953.',evolution:'Blanc sec de Pessac-Léognan : 1-5 ans (jeune fruité). 5-15 ans (complexité croissante, boisé intégré). 15-30 ans (profondeur remarquable). Haut-Brion Blanc 1989 : encore sublime à 35 ans.',degustation:'À l\'aveugle : COULEUR jaune doré. NEZ citron confit, pamplemousse, noisette grillée, toast, cire. BOUCHE riche, texture onctueuse (Sémillon), boisé présent. Test : si c\'est le Sémillon blanc sec le plus opulent et le plus boisé — Pessac-Léognan.',histoire:'Haut-Brion Blanc est mentionné depuis le XVIIe siècle comme exception bordelaise pour les blancs. Sa rareté (< 8 000 bouteilles/an) en fait l\'une des allocations les plus recherchées du monde vineux.'}},
      {n:'Argile + calcaire (Entre-deux-Mers)',r:'Entre-deux-Mers — Bordeaux (blancs secs)',a:'Éocène + Oligocène — 25-40 Ma',
       d:'Argile calcaire et calcaire sur le plateau entre Garonne et Dordogne. L\'Entre-deux-Mers est la grande appellation de Bordeaux blanc sec, principalement en Sémillon + Sauvignon Blanc. Vins simples, frais, de consommation rapide. Le sol fertile donne des rendements élevés et des vins sans prétention — l\'opposé de Sauternes ou Pessac-Léognan.',
       s:{a:70,t:0,c:60,g:55},ar:['Citron frais','Pomme','Fleurs de sureau','Pamplemousse léger'],
       k:'Entre-deux-Mers : sol calcaire fertile = Sémillon blanc sec simple et frais. La fertilité du sol donne des vins accessibles — l\'opposé de la concentration de Sauternes sur sol sableux.',fiche:{geographie:'Entre-deux-Mers : plateau calcaire entre Garonne et Dordogne, 25 km E-O. Vignoble très productif. L\'appellation produit le gros du Bordeaux blanc sec ordinaire. Altitude 50-100 m.',geologie_detail:'Argile calcaire et calcaire éocène (40 Ma). Sol fertile et productif. Le Sémillon sur sol fertile donne des vins simples et accessibles — l\'opposé de la concentration de Sauternes ou Pessac-Léognan.',appellations:'Entre-deux-Mers AOC (blanc sec seulement). Bordeaux Blanc AOC (plus générique). Rapport Q/P excellent pour les vins simples.',evolution:'Entre-deux-Mers : 1-2 ans. Citron, pomme, fleur de sureau, pamplemousse. Direct et désaltérant. Ne pas garder.',degustation:'À l\'aveugle : COULEUR jaune pâle. NEZ citron, pomme fraîche, fleurs. BOUCHE légère, fraîche, simple. Test : si c\'est le Sémillon blanc sec le plus simple et le plus direct — Entre-deux-Mers.',histoire:'L\'Entre-deux-Mers produit 30% du Bordeaux blanc. Malgré son volume, certains producteurs de qualité (Château Bonnet, Château Thieuley) font des vins très corrects à prix accessibles.'}},
      {n:'Sable alluvial chaud (Hunter Valley)',r:'Hunter Valley — Pokolbin, Broke Fordwich (Australie)',a:'Alluvions Quaternaire de rivière',
       d:'Alluvions légères dans une vallée chaude et humide (au nord de Sydney). Le Sémillon de Hunter Valley est l\'un des vins les plus mystérieux du monde : léger (11° d\'alcool), sans boisé, acide et presque austère à 2 ans — puis magistral à 15-20 ans. Avec le temps, apparaissent des arômes de toast, miel et kérosène (la molécule TDN, formée par photodégradation des caroténoïdes dans un sol chaud).',
       s:{a:72,t:0,c:58,g:95},ar:['Citron vert (jeune)','Toast (âge)','Kérosène (âge)','Miel ciré','Lanoline'],
       k:'Hunter Semillon : 11° d\'alcool, sans bois, vieillissement 15-20 ans. La chaleur du sol active la formation de TDN (kérosène) avec l\'âge. Vin le plus atypique du monde dans son évolution.',fiche:{geographie:'Hunter Valley (NSW Australie) est à 140 km au nord de Sydney, dans une vallée chaude et humide. Célèbre pour son Sémillon sans soufre et sans boisé, léger et austère jeune, mais magistral à 15-20 ans — l\'un des vins les plus mystérieux du monde.',geologie_detail:'Alluvions de la rivière Hunter : sable argileux léger dans une vallée chaude (humide l\'hiver, sèche l\'été). Les UV intenses activent la formation de TDN (trimethyl-dihydronaphthalène = molécule de kérosène) avec l\'âge. C\'est la géochimie du sol qui crée ce caractère.',appellations:'Hunter Valley GI (NSW). Pas de classification. Producteurs références : Tyrrell\'s (Vat 1), Brokenwood, McWilliam\'s Lovedale, Audrey Wilkinson. Tyrrell\'s Vat 1 est la cuvée icon absolue.',evolution:'Hunter Sémillon est l\'un des vins les plus enigmatiques : 1-3 ans : léger (11°), acide, citron, presque austère. 5-10 ans : toast commence à apparaître. 10-20 ans : miel ciré, toast intense, kérosène (TDN), lanoline. 15-25 ans : plénitude absolue — l\'un des grands blancs du monde.',degustation:'À l\'aveugle : COULEUR jaune dorée (âge). NEZ jeune = citron vert sec. Âgé = toast, miel, kérosène (pétrole léger), lanoline. BOUCHE 11° d\'alcool (unique!), très acide, sec, finale minérale. Test : si c\'est un blanc avec du kérosène au nez et seulement 11° — Hunter Valley Sémillon sans aucun doute.',histoire:'Hunter Valley est la région viticole la plus ancienne d\'Australie (1820s). Le style Sémillon léger de Hunter est un accident historique : les vignerons récoltaient tôt (avant les pluies automnales) des raisins peu mûrs — d\'où les 11° d\'alcool et l\'acidité élevée. Ce qui semblait un défaut est devenu le style signature.'}},
    ],
    monde:[
      {n:'Sable profond sur argile (Barossa)',r:'Barossa Valley — Clare Valley adjacent (Australie)',a:'Éolien Pléistocène',
       d:'Les vieilles vignes de Sémillon de Barossa (certaines d\'avant 1900) sur sable profond donnent des vins blancs riches et gras — très différents du Hunter Valley. Penfolds utilise le Sémillon de Barossa pour ses grands assemblages blancs. Style australien opulent, élevé en barrique, destiné à une consommation plus précoce que le Hunter.',
       s:{a:65,t:0,c:72,g:75},ar:['Citron confit','Pêche','Beurre','Toast','Ananas mûr'],
       k:'Barossa Sémillon : sol profond + chaleur = style opulent et boisé, très différent du Hunter. Deux Australies du Sémillon : l\'une pour la garde austère, l\'autre pour la richesse immédiate.',fiche:{geographie:'Barossa Valley est à 70 km au nord d\'Adélaïde, dans une vallée encaissée. Région la plus chaude et la plus \'australienne\' des grands vignobles. Climat semi-aride (300-350 mm/an). Le Sémillon y est planté sur de très vieilles vignes (certaines d\'avant 1900).',geologie_detail:'Sable profond sur argile (Pléistocène éolien). Sol très drainant, chaud, pauvre en surface. Très différent du sable léger de Hunter Valley. Le Sémillon de Barossa est riche, opulent et boisé — à l\'opposé du style austère de Hunter.',appellations:'Barossa Valley GI. Clare Valley GI (au nord, plus frais, célèbre pour Riesling). Producteurs : Penfolds (Bin 311), Torbreck, Two Hands. Pas de classification officielle.',evolution:'1-3 ans : Citron confit, pêche, beurre, ananas mûr. 3-7 ans : Boisé s\'intègre, richesse. 7+ ans : Les meilleurs vieillissent bien mais style opulent vs austère Hunter. Différence fondamentale : Barossa = riche immédiat. Hunter = austère puis complexe.',degustation:'À l\'aveugle : COULEUR jaune dorée intense. NEZ citron confit, pêche, ananas, beurre, toast. BOUCHE riche, corps ample, alcool élevé. Test : si c\'est le Sémillon le plus opulent et le plus boisé — Barossa.',histoire:'Barossa est colonisée par des luthériens allemands dans les années 1840 (Silésie + Prusse), fuyant les persécutions religieuses. Ces immigrants ont maintenu des cépages et traditions viticoles européens — dont le Sémillon. Penfolds (fondé 1844) est l\'emblème mondial de Barossa.'}},
    ]
  },
  'aligote':{
    fr:[
      {n:'Calcaire jurassique + argile (Bouzeron)',r:'Bouzeron — Côte Chalonnaise (Saône-et-Loire)',a:'Jurassique — 150-160 Ma',
       d:'Calcaire jurassique similaire à la Côte de Beaune mais légèrement moins bien exposé et moins bien drainé. L\'Aligoté sur bon calcaire avec vieilles vignes peut atteindre une vraie complexité. Aubert de Villaine (co-propriétaire de la Romanée-Conti) a démontré depuis les années 1970 que ce cépage \'secondaire\' peut atteindre une qualité remarquable à Bouzeron — ce qui a conduit à la création de l\'AOC en 1998.',
       s:{a:88,t:0,c:40,g:58},ar:['Citron vif','Pomme verte','Craie','Fleurs blanches','Amande légère'],
       k:'Bouzeron = seule AOC mondiale dédiée à l\'Aligoté. Aubert de Villaine (DRC) a prouvé qu\'un cépage \'secondaire\' sur bon calcaire peut rivaliser avec les Bourgognes blancs ordinaires.',fiche:{geographie:'Bouzeron est un petit village de la Côte Chalonnaise (Saône-et-Loire), à 10 km au nord de Chalon-sur-Saône. 60 ha seulement — l\'un des plus petits AOC de Bourgogne. Aubert de Villaine (copropriétaire de la Domaine de la Romanée-Conti) y habite et prouve depuis les années 1970 que l\'Aligoté peut atteindre une vraie qualité.',geologie_detail:'Calcaire jurassique et marnes argileuses similaires à la Côte d\'Or mais légèrement moins bien exposé et drainé. L\'Aligoté sur bon calcaire avec vieilles vignes peut atteindre une vraie complexité — contrairement aux idées reçues.',appellations:'Bouzeron AOC (créée en 1979, modifiée en 1998 pour 100% Aligoté). Seule AOC mondiale dédiée à l\'Aligoté. Domaine de Villaine (Aubert de Villaine, codirecteur de DRC).',evolution:'Bouzeron : 2-6 ans. Citron vif, pomme verte, craie, fleurs blanches, légère amande. Plus complexe qu\'un Aligoté générique. Les vieilles vignes de Villaine peuvent tenir 8-10 ans.',degustation:'À l\'aveugle : COULEUR jaune pâle. NEZ citron, pomme verte, fleurs de citronnier, amande légère. BOUCHE acidité vive, corps léger-médium, finale minérale. Test : si c\'est le blanc bourguignon le plus léger et le plus acide — Aligoté de Bouzeron.',histoire:'Aubert de Villaine (né 1939) a investi à Bouzeron pour montrer que l\'Aligoté — méprisé comme \'cépage secondaire\' — pouvait produire un grand vin sur bon calcaire. Son action a mené à la création de l\'AOC Bouzeron en 1979. En 1998, l\'AOC est réservée à 100% Aligoté — une reconnaissance historique.'}},
      {n:'Calcaire des Hautes-Côtes (plateau)',r:'Hautes-Côtes de Beaune et de Nuits — 300-400 m d\'altitude',a:'Jurassique — 155-165 Ma',
       d:'Calcaire de plateau froid et venteux à 300-400 m d\'altitude. L\'Aligoté des Hautes-Côtes est le plus vif et le plus acide de Bourgogne — parfois perçu comme trop agressif seul. C\'est exactement cet Aligoté qui était utilisé par le chanoine Félix Kir, maire de Dijon après-guerre, pour son célèbre apéritif : l\'acidité tranchante est parfaitement équilibrée par la douceur de la crème de cassis.',
       s:{a:95,t:0,c:38,g:48},ar:['Citron acide','Pomme verte','Pierre à fusil','Herbe fraîche','Fleurs printanières'],
       k:'Le Kir existe parce que l\'Aligoté des Hautes-Côtes est trop acide seul. La crème de cassis équilibre l\'acidité — une solution gastronomique à un problème géologique.',fiche:{geographie:'Les Hautes-Côtes de Beaune et de Nuits forment le plateau calcaire au-dessus de la côte, à 300-400 m d\'altitude. Plus froid et plus venteux que la côte. L\'Aligoté y est largement planté car il supporte mieux les conditions difficiles que le Chardonnay.',geologie_detail:'Calcaire de plateau (portlandien, Jurassique supérieur, 145-155 Ma). Moins fissuré et moins bien drainé que le kimméridgien des Grands Crus. Donne un Aligoté vif et parfois austère — idéal pour le Kir et le Crémant.',appellations:'Bourgogne Hautes-Côtes de Beaune AOC / Bourgogne Hautes-Côtes de Nuits AOC. L\'Aligoté peut être étiqueté \'Bourgogne Aligoté\' + nom du village. Crémant de Bourgogne : Aligoté comme base de bulle.',evolution:'Aligoté des Hautes-Côtes : 1-3 ans. Citron très acide, pomme verte, pierre à fusil. Simple mais honnête. Le Kir est inventé pour compenser l\'acidité excessive avec la douceur de la crème de cassis.',degustation:'À l\'aveugle : COULEUR jaune très pâle. NEZ citron acide, herbe fraîche, pomme verte, pierre. BOUCHE TRÈS acide, corps très léger, finale courte. Test : si c\'est le blanc le plus acide de Bourgogne — Aligoté des Hautes-Côtes.',histoire:'L\'histoire du Kir : Félix Kir (chanoine, maire de Dijon 1945-1968) recevait chaque visiteur officiel avec un verre d\'Aligoté local + crème de cassis. Cette recette était déjà connue mais Kir l\'a popularisée au point que son nom lui est resté. Aujourd\'hui le Kir est servi dans le monde entier — immortalisant un vin par construction bourguignonne.'}},
      {n:'Marne et calcaire portlandien',r:'Bourgogne Aligoté — appellation régionale',a:'Jurassique supérieur — 145-155 Ma',
       d:'L\'Aligoté en appellation régionale pousse sur des sols variés — marnes, calcaire portlandien, argile calcaire. Qualité très variable selon le producteur et la localisation. Utilisé massivement dans le Crémant de Bourgogne pour son acidité naturelle. Certains producteurs sérieux (Chandon de Briailles, Ponsot) élaborent des Aligoté de village de très belle qualité souvent ignorés par le marché.',
       s:{a:87,t:0,c:38,g:50},ar:['Citron','Pomme verte','Craie légère','Fleurs','Noix légère'],
       k:'Aligoté régional de Bourgogne : qualité très variable. Chercher les producteurs sérieux — certains font des vins aussi bons qu\'un Bourgogne blanc à la moitié du prix.',fiche:{geographie:'Bourgogne Aligoté est l\'appellation régionale couvrant toute la Bourgogne. Qualité très variable. Certains producteurs sérieux font des vins excellents souvent ignorés du marché car le cépage est dévalorisé.',geologie_detail:'Marnes et calcaire portlandien, argile calcaire — sols variés selon les communes. La fertilité du sol est le facteur déterminant de la qualité : sol plus pauvre = meilleur Aligoté.',appellations:'Bourgogne Aligoté AOC (appellation régionale). Toute la Bourgogne peut produire cet appellation. Producteurs sérieux : Chandon de Briailles, Ponsot, Domaine Trapet. Utilisé pour Crémant de Bourgogne.',evolution:'Bourgogne Aligoté : 1-3 ans. Fruité direct, citron, pomme. Honnête et désaltérant. Les quelques exceptions de vieilles vignes sur bons terroirs tiennent 5-7 ans.',degustation:'À l\'aveugle : COULEUR jaune pâle. NEZ citron, fleurs blanches légères. BOUCHE légère et vive. Test : si c\'est le Bourgogne blanc le plus léger et le moins cher — Aligoté régional.',histoire:'L\'Aligoté est mentionné en Bourgogne depuis le XVIIIe siècle. Son statut de \'cépage secondaire\' est injuste — sur vieilles vignes et bon sol, il peut donner des vins remarquables. La dépreciation du cépage vient de la culture en masse sur sols fertiles pour produire du Crémant et du Kir accessibles.'}},
    ],
    monde:[
      {n:'Calcaire crayeux (Europe de l\'Est)',r:'Moldavie, Ukraine, Bulgarie — plaines calcaires',a:'Miocène — 5-15 Ma',
       d:'L\'Aligoté est très répandu en Europe de l\'Est sur calcaire crayeux miocène. En Moldavie, c\'est le cépage blanc dominant (plus de 30% du vignoble). Sur ces sols calcaires des plaines, il produit des vins frais et floraux, accessibles et honnêtes. Très différent de la Bourgogne en termes de complexité mais fidèle à la signature acide du cépage.',
       s:{a:85,t:0,c:35,g:42},ar:['Citron','Fleurs blanches légères','Pomme','Poire'],
       k:'L\'Aligoté est le cépage blanc le plus planté en Moldavie — son terroir d\'adoption naturel après la Bourgogne. Sur calcaire crayeux de l\'Est, il reste fidèle à sa signature acide et florale.',fiche:{geographie:'Moldavie, Ukraine et Bulgarie : l\'Aligoté est l\'un des cépages blancs les plus répandus dans l\'ancien bloc soviétique. Il représente plus de 30% du vignoble blanc de Moldavie — plus que le Chardonnay.',geologie_detail:'Calcaire crayeux miocène (5-15 Ma) dominant dans les plaines d\'Europe de l\'Est. Sol fertile, productif. L\'Aligoté sur ces sols calcaires plats donne des vins frais, légers, floraux — sans la complexité de la Bourgogne mais fidèles à la signature acide du cépage.',appellations:'Appellations d\'Europe de l\'Est pour Aligoté : Moldova Wine (DO Moldova), Ukraine Geographic Indication, Bulgarie (vin de cépage). Pas de hiérarchie officielle équivalente à la Bourgogne.',evolution:'Aligoté d\'Europe de l\'Est : 1-2 ans. Citron, fleurs, pomme verte. Vin de consommation courante. Souvent le vin blanc le moins cher des marchés locaux.',degustation:'À l\'aveugle : COULEUR jaune très pâle. NEZ citron, fleurs blanches simples. BOUCHE légère, acide, simple. Test : si c\'est l\'Aligoté le plus simple et le plus direct — Europe de l\'Est sur calcaire plat.',histoire:'L\'URSS a massivement planté l\'Aligoté dans ses républiques viticoles (Moldavie, Ukraine, Géorgie) dans les années 1950-70 pour la production de masse. La dislocation de l\'URSS en 1991 a laissé ces vignobles désorganisés. La Moldavie cherche aujourd\'hui à reconstruire une identité viticole moderne autour de ses cépages locaux.'}},
    ]
  },
  'traminer':{
    fr:[
      {n:'Granit hercynien acide',r:'Alsace — GC Brand (Turckheim), GC Schlossberg (Kaysersberg)',a:'Hercynien — 300 Ma',
       d:'Granit acide et pauvre, très filtrant. La vigne stressée par la pauvreté du sol concentre ses terpènes : géraniol (rose) et linalol (litchi). Paradoxe géologique : plus le sol est pauvre, plus le Gewurztraminer est aromatique. Le Grand Cru Brand à Turckheim et le Schlossberg à Kaysersberg donnent les Gewurztraminer les plus épicés et les plus floraux d\'Alsace.',
       s:{a:38,t:0,c:78,g:70},ar:['Rose intense','Litchi','Mangue','Poivre rose','Gingembre'],
       k:'Granit pauvre → stress hydrique → concentration maximale des terpènes → intensité aromatique maximale. La pauvreté du sol crée directement la richesse du vin.',fiche:{geographie:'L\'Alsace : 120 km N-S entre les Vosges et la plaine du Rhin. Vins sur cépage (unique en France). 51 Grands Crus. Le Gewurztraminer est le cépage le plus aromatique d\'Alsace — il domine les Grands Crus riches. Colmar est la capitale viticole. Effet paravent des Vosges : Alsace = région la plus sèche et ensoleillée de France.',geologie_detail:'Granit hercynien acide (300 Ma) très pauvre. La pauvreté du sol concentre les terpènes (géraniol, linalol) → intensité aromatique maximale. Plus le sol est pauvre, plus le Gewurztraminer est aromatique. Paradoxe : la région la plus sèche donne des vins en apparence \'gras\' car les terpènes donnent cette impression sans sucre.',appellations:'Alsace AOC Gewurztraminer. Alsace Grand Cru + 51 lieux-dits. Grands Crus granitiques (Brand, Schlossberg) : plus fins et tendus. Grands Crus calcaires (Hengst, Sporen) : plus opulents. Vendanges Tardives (VT) et Sélection de Grains Nobles (SGN) : niveaux de douceur officiels.',evolution:'1-3 ans : Rose très intense, litchi, mangue, poivre rose. À son maximum aromatique. 3-7 ans : Les arômes s\'intègrent. Les GC tiennent mieux. 7+ ans : Les VT et SGN tiennent 20-30 ans. Les secs deviennent plus apaisés et moins aromatiques avec le temps.',degustation:'À l\'aveugle : COULEUR jaune dorée intense (souvent). NEZ LE PLUS RECONNAISSABLE des cépages blancs : rose + litchi + épices exotiques. BOUCHE onctueux, alcool élevé, souvent résidu de sucre même dans les \'secs\'. Test : si c\'est le blanc le plus aromatique du groupe — Gewurztraminer. Impossible de le rater.',histoire:'L\'Alsace est passée 4 fois entre France et Allemagne (1789-1919-1940-1945). L\'usage du nom de cépage sur l\'étiquette vient de la pratique allemande héritée. Aujourd\'hui, l\'Alsace est le seul grand vignoble de France à mentionner systématiquement le cépage — pratique adoptée par le monde entier.'}},
      {n:'Volcanite — Rangen de Thann (unique en Alsace)',r:'Alsace — GC Rangen de Thann (Thann, Vieux-Thann)',a:'Permien — 250-280 Ma',
       d:'La seule roche volcanique d\'Alsace. Pentes à 65-80° (parmi les plus pentues de France). Roche sombre qui absorbe intensément la chaleur solaire. Gewurztraminer le plus minéral, le plus sec et le plus complexe d\'Alsace malgré (ou grâce à) cette intensité thermique. Le Grand Cru le plus méridional d\'Alsace — conditions uniques qui donnent un profil aromatique différent de tous les autres.',
       s:{a:42,t:0,c:82,g:75},ar:['Rose fumée','Pierre chaude','Litchi minéral','Épices sombres','Cannelle'],
       k:'Rangen de Thann = seule volcanite d\'Alsace. Le Gewurz ici est minéral et tendu, pas opulent et liquoreux comme sur calcaire. La géologie volcanique transforme le profil aromatique.',fiche:{geographie:'Rangen de Thann est le Grand Cru le plus méridional et le plus mythique d\'Alsace. Pentes à 65-80° — parmi les plus raides d\'Europe. La roche volcanique absorbe intensément la chaleur solaire. Accès difficile : certaines parcelles ne peuvent être travaillées qu\'à la main ou avec des treuils.',geologie_detail:'Volcanite permienne (250-280 Ma) — la SEULE roche volcanique de tout l\'Alsace. Le Rangen est donc géologiquement unique. La roche sombre (couleur de charbon) absorbe et restitue la chaleur. Drainage extrême sur ces pentes vertigineuses.',appellations:'Rangen de Thann AOC Grand Cru. Monoplace de facto : Domaine Zind-Humbrecht (Olivier Humbrecht, 1er Master of Wine français) + Domaine Schoffit. Ces deux domaines se partagent presque tout le Rangen.',evolution:'Gewurztraminer de Rangen : plus minéral, plus sec, plus long que sur d\'autres GC. 1-5 ans : rose fumée, litchi tendu, pierre chaude. 5-15 ans : minéralité volcanique croissante. 15+ ans : les SGN du Rangen sont parmi les plus grands liquoreux du monde.',degustation:'À l\'aveugle : COULEUR dorée intense. NEZ rose FUMÉE (le caractère volcanique est perceptible), litchi, épices sombres, cacao, pierre chaude. Moins floral que Gewurztraminer sur calcaire. BOUCHE plus tendue et minérale. Test : si c\'est le Gewurz le plus minéral et le plus austère — Rangen sur volcanite.',histoire:'Olivier Humbrecht (né 1961) est le premier Français à devenir Master of Wine (1989). Son domaine au Rangen est la référence absolue de la minéralité alsacienne. Il défend depuis 40 ans la viticulture biodynamique et la notion de terroir dans un contexte où les vins alsaciens étaient souvent sucrés et maniérés.'}},
      {n:'Calcaire argileux (Hengst, Sporen)',r:'Alsace — GC Hengst (Wintzenheim), GC Sporen (Riquewihr)',a:'Jurassique-Calcaire Eocène — 35-60 Ma',
       d:'Calcaire et argile (sols plus riches et plus lourds que le granit). Le Gewurztraminer sur calcaire argileux est le plus opulent, le plus généreux et le plus liquoreux d\'Alsace. Grand Cru Hengst : calcaire + grès vosgien → vins massifs, riches. Grand Cru Sporen : argile + calcaire → vins somptueux mais manquant de la tension des sols granitiques.',
       s:{a:35,t:0,c:82,g:72},ar:['Rose confite','Litchi très mûr','Fruits exotiques','Miel de fleurs','Épices douces'],
       k:'Calcaire argileux = Gewurztraminer le plus opulent et le plus riche. Mais attention : richesse sans tension. Les meilleurs Gewurz sont sur granit (plus tendus) ou volcanite (plus minéraux).',fiche:{geographie:'Hengst (Wintzenheim) et Sporen (Riquewihr) sont deux Grands Crus calcaires-argileux du centre de l\'Alsace. Altitude 250-350 m. Exposition Est-Sud-Est. Sols plus riches et plus lourds que le granit — donnent des Gewurztraminer très opulents et parfois liquoreux.',geologie_detail:'Calcaire argileux (Jurassique + Éocène, 35-60 Ma). Sols plus riches que le granit. L\'argile retient l\'eau et donne de l\'opulence au Gewurztraminer. Les vins sont plus massifs et moins fins que sur granit — mais peuvent atteindre une richesse extraordinaire dans les VT et SGN.',appellations:'Alsace Grand Cru Hengst (Wintzenheim) : Gewurztraminer + Riesling + Pinot Gris. Alsace Grand Cru Sporen (Riquewihr) : Gewurztraminer + Riesling. Producteurs : Zind-Humbrecht (Hengst), Hugel & Fils (Sporen), Dopff au Moulin.',evolution:'Gewurztraminer de Hengst ou Sporen : 1-5 ans : rose confite, litchi très mûr, fruits exotiques, miel de fleurs. Souvent avec résidu de sucre imperceptible mais présent. 5-15 ans : les VT développent une profondeur remarquable. SGN de Sporen : 20-40 ans.',degustation:'À l\'aveugle : COULEUR dorée profonde. NEZ rose confite, litchi très mûr, miel fleurs, gingembre. BOUCHE onctueux, généreux, alcool enveloppant. Moins minéral que Rangen. Test : si c\'est le Gewurz le plus opulent et le plus doux — calcaire argileux de Hengst ou Sporen.',histoire:'Hugel & Fils (Riquewihr) est la maison qui a le plus contribué à faire connaître les Vendanges Tardives alsaciennes dans le monde entier. En 1976, la famille Hugel a lutté pour créer officiellement les catégories VT et SGN — obtenant le décret officiel en 1984.'}},
      {n:'Lœss (limon glaciaire)',r:'Alsace — Alsace AOC simple et Crémant',a:'Quaternaire — 15 000-20 000 ans',
       d:'Lœss léger (limon éolien déposé lors des périodes glaciaires) dans la plaine du Rhin. Sol fertile et profond — le moins intéressant pour le Gewurztraminer car il donne des vins dilués, peu aromatiques malgré la chaleur. Le lœss alsacien est réservé aux appellations génériques. Il rappelle que la richesse du cépage ne suffit pas — le sol doit le contraindre.',
       s:{a:40,t:0,c:65,g:45},ar:['Rose légère','Fleurs simples','Litchi simple','Sucre résiduel perceptible'],
       k:'Lœss fertile = Gewurztraminer dilué. Même cépage, même cépage, même région : la fertilité du sol diminue directement la concentration aromatique. Le sol pauvre est indispensable.',fiche:{geographie:'Le lœss alsacien est un limon éolien (Quaternaire, déposé il y a 15 000-20 000 ans par le vent depuis les alluvions du Rhin glaciaire). Il couvre les replats et la plaine au pied de la côte viticole. Sol fertile et profond — le moins intéressant pour les grands vins.',geologie_detail:'Lœss : limon très fin, très léger, très aéré, très fertile. La vigne est trop à l\'aise — elle produit en grande quantité mais sans concentration. Le Gewurztraminer sur lœss est aromatique (les terpènes sont dans le cépage, pas dans le sol) mais sans minéralité ni structure.',appellations:'Alsace AOC (appellation régionale simple). Gewurztraminer d\'Alsace (sans mention de Grand Cru). Grande production coopérative (Cave de Turckheim, Cave de Beblenheim). Prix accessibles.',evolution:'Gewurztraminer sur lœss : 1-2 ans. Aromatiquement direct (rose, litchi, épices) mais sans complexité ni garde. Vins commerciaux agréables mais sans profondeur.',degustation:'À l\'aveugle : COULEUR dorée légère. NEZ rose, litchi, épices douces. BOUCHE aromatique mais sans tension, court en bouche, souvent perceptible sucre. Test : si c\'est le Gewurz le plus simple et le moins complexe — lœss de plaine alsacienne.',histoire:'La coopérative Cave de Turckheim produit du Gewurztraminer sur lœss pour la grande distribution mondiale. Ces vins représentent 60-70% des Gewurztraminer vendus dans le monde — leur accessibilité a popularisé le cépage internationalement, au détriment parfois de l\'image de qualité.'}},
    ],
    monde:[
      {n:'Porphyre volcanique (berceau du cépage)',r:'Tramin — Alto Adige — Termeno sulla Strada del Vino (Italie)',a:'Permien — 250-280 Ma',
       d:'Roche magmatique rouge riche en potassium sur les versants occidentaux de la vallée de l\'Adige à 200-700 m d\'altitude. C\'est ici que le Traminer a été sélectionné et nommé. Sur ce sol natal, le Gewurztraminer est sec, fin, floral et légèrement épicé — à l\'opposé du Gewurz alsacien opulent et liquoreux. La relation génétique Savagnin = Traminer = Gewurztraminer a été confirmée par l\'ADN en 2004.',
       s:{a:48,t:0,c:72,g:68},ar:['Rose sèche','Abricot fin','Amande','Minéralité volcanique','Épices légères'],
       k:'Sur son sol natal (porphyre de Tramin), le Traminer est sec et fin — l\'opposé du Gewurz alsacien riche. Le même cépage, deux géologies, deux continents vinicoles opposés.',fiche:{geographie:'Tramin (Termeno sulla Strada del Vino) est dans la vallée de l\'Adige, à 30 km au sud de Bolzano. C\'est le berceau mondial du cépage. La \'Strada del Vino\' (route des vins) traverse la région — paysage de vignes en terrasses sur porphyre rouge.',geologie_detail:'Porphyre volcanique rouge (Permien, 250-280 Ma). Riche en potassium. Sur ce sol natal, le Traminer est sec et minéral — très différent du Gewurztraminer alsacien opulent. L\'ADN du cépage a été vérifié en 2004 : Savagnin = Traminer = Gewurztraminer — même cépage, trois terroirs, trois profils.',appellations:'Alto Adige / Südtirol DOC. Cépage sur l\'étiquette (comme en Allemagne). J. Hofstätter (producteur historique de Termeno), Elena Walch, Tiefenbrunner, Cantina Tramin (coopérative, excellent rapport Q/P).',evolution:'Traminer d\'Alto Adige : 2-5 ans. Sec, fin, floral sans excès, légèrement épicé. Les terpènes s\'évaporent avec le temps — pas fait pour la garde.',degustation:'À l\'aveugle : COULEUR jaune pâle. NEZ rose sèche, abricot fin, amande, légère épice, minéralité volcanique. MOINS aromatique que le Gewurz alsacien. BOUCHE sec, léger, fin, minéral. Test : si c\'est le Traminer le plus discret et le plus minéral — Alto Adige sur porphyre.',histoire:'J. Hofstätter (fondé 1907) est la maison historique de Termeno. Ses bouteilles incluent le nom du village en langues allemande et italienne — symbole du double héritage culturel. La région d\'Alto Adige parle majoritairement allemand mais appartient à l\'Italie depuis 1919 — source de tensions culturelles encore aujourd\'hui.'}},
    ]
  },
  'pinot-blanc':{
    fr:[
      {n:'Granit acide vosgien',r:'Alsace — terroirs granitiques du nord (Molsheim, Marlenheim)',a:'Hercynien — 300 Ma',
       d:'Granit acide et pauvre, très filtrant. Le Pinot Blanc sur granit est le plus léger, le plus pâle et le plus délicat d\'Alsace. Peu de calcium → peu de structure tannique ou de corps. Mais une fraîcheur florale et une légèreté qui en font un vin de soif élégant, parfait en apéritif ou avec des poissons délicats. Base idéale pour le Crémant d\'Alsace.',
       s:{a:68,t:0,c:45,g:48},ar:['Pomme verte','Poire légère','Fleurs blanches','Citron doux','Amande fraîche'],
       k:'Granit acide = peu de calcium = peu de structure. Le Pinot Blanc sur granit est délié et floral — la version la plus légère et la plus accessible du cépage.',fiche:{geographie:'L\'Alsace forme un ruban de 120 km. Le Pinot Blanc est planté sur les pentes granitiques du Haut-Rhin. Souvent sous-estimé car sans la flamboyance du Gewurztraminer ou la précision du Riesling — mais c\'est la base très honnête des Crémants d\'Alsace.',geologie_detail:'Granit hercynien acide (300 Ma). Très pauvre, filtrant. Le Pinot Blanc sur granit est le plus léger, le plus pâle et le plus délicat d\'Alsace. La pauvreté du sol donne peu de calcium → peu de corps, mais vraie fraîcheur florale.',appellations:'Alsace AOC Pinot Blanc. Crémant d\'Alsace (base principale). Auxerrois (cousin du Pinot Blanc) souvent assemblé. Cave de Turckheim, Trimbach, Josmeyer.',evolution:'1-3 ans. Pomme verte, poire légère, fleurs blanches, citron doux, amande fraîche. Désaltérant et direct. Crémant d\'Alsace : boire dans 2-3 ans pour la fraîcheur des bulles.',degustation:'À l\'aveugle : COULEUR très pâle. NEZ pomme verte, poire, fleurs délicates. BOUCHE légère, acidité vive, corps fin. Test : si c\'est le blanc alsacien le plus léger et le plus délicat sans être le plus aromatique — Pinot Blanc sur granit.',histoire:'Le Pinot Blanc est devenu la base de la production de masse alsacienne depuis les années 1970. Sa facilité de production et sa légèreté florale en font la base idéale du Crémant d\'Alsace — lui-même devenu l\'une des bulles françaises les plus vendues.'}},
      {n:'Calcaire jurassique + argile',r:'Alsace — terroirs calcaires du sud (Colmar, Rouffach)',a:'Jurassique — 150-165 Ma',
       d:'Calcaire riche en calcium sur argile. Plus de rondeur, plus de corps et plus de persistance que sur granit. Le Pinot Blanc calcaire est meilleur pour le Crémant d\'Alsace (la bulle profite de l\'acidité maintenue par le calcaire). Certains Pinot Blanc de Grands Crus calcaires (Hengst, Brand) atteignent une complexité surprenante.',
       s:{a:70,t:0,c:58,g:60},ar:['Pomme golden','Pêche blanche','Amande','Beurre léger','Fleurs'],
       k:'Calcaire = calcium = rondeur et corps. Le Pinot Blanc calcaire est plus ample et plus complexe que le granitique. Meilleur potentiel de garde.',fiche:{geographie:'Les terroirs calcaires du sud de l\'Alsace (Colmar, Rouffach, Guebwiller) donnent un Pinot Blanc avec plus de rondeur et de corps. Meilleure base pour le Crémant haut de gamme et les vins tranquilles de caractère.',geologie_detail:'Calcaire (Jurassique, 150-165 Ma) sur argile. Plus de rondeur et de corps que sur granit. Le calcium du calcaire donne une structure légère mais perceptible. Meilleur potentiel de garde.',appellations:'Alsace Grand Cru (quelques rares) + Alsace AOC. Crémant d\'Alsace Blanc de Blancs (Pinot Blanc 100%). Cave Vinicole de Pfaffenheim, Kientzler, Burn.',evolution:'2-5 ans. Pomme dorée, pêche blanche, amande, beurre léger, fleurs. Plus de corps et de longueur que le Pinot Blanc granitique. Certains vieillissent 7-8 ans correctement.',degustation:'À l\'aveugle : COULEUR jaune pâle à dorée légère. NEZ pomme dorée, pêche légère, amande. BOUCHE plus ample que le granitique. Test : si c\'est le Pinot Blanc le plus structuré et le plus ample — calcaire alsacien.',histoire:'La Confrérie Saint-Étienne d\'Alsace (fondée en 1947) est le principal organisme de promotion des vins d\'Alsace. Elle organise des dégustations annuelles et décerne des médailles — le Pinot Blanc représente souvent 30-40% des vins primés.'}},
      {n:'Marnes et argile calcaire',r:'Alsace — Pinot Blanc de plaine (production de masse)',a:'Miocène — 5-15 Ma',
       d:'Marnes et argile dans la plaine du Rhin. Sol fertile donnant des rendements élevés. Pinot Blanc le plus simple, le plus direct, le plus accessible — et le plus commercial. C\'est la base de beaucoup de Crémant d\'Alsace abordables et de blancs de supermarché. La qualité est correcte mais sans l\'élégance des terroirs pentus.',
       s:{a:66,t:0,c:52,g:42},ar:['Pomme simple','Poire','Fleurs printanières','Citron frais'],
       k:'Marnes fertiles = Pinot Blanc accessible et commercial. La quantité remplace la qualité. Représentatif de la masse de la production alsacienne — honnête mais sans personnalité forte.',fiche:{geographie:'Alto Adige (Haut-Adige / Tyrol du Sud) est dans les Alpes centrales italiennes. Le Pinot Bianco est l\'un des cépages blancs les plus plantés après le Pinot Grigio. Les villages historiques (Terlano, Nalles) ont des crus de réputation mondiale.',geologie_detail:'Porphyre volcanique rouge (Permien, 250-280 Ma) sur les versants de l\'Adige. La Cantina Terlano (coopérative de Terlano) produit un Pinot Bianco Vorberg vieilli en fûts qui vieillit 15-20 ans — prouvant que le porphyre volcanique + altitude alpine permettent une longévité exceptionnelle pour ce cépage.',appellations:'Alto Adige / Südtirol DOC. Pinot Bianco sur l\'étiquette. Cantina Terlano (Vorberg — cru icône), Elena Walch, Tiefenbrunner, Abbazia di Novacella (Stiftskellerei Neustift, monastère augustinien).',evolution:'Pinot Bianco d\'Alto Adige évolue mieux que partout ailleurs : 1-3 ans : pomme verte, amande, fleurs alpines, citron, minéralité volcanique. 3-10 ans : Complexité croissante, noisette, craie. 10-20 ans : Cantina Terlano Vorberg : profondeur remarquable. Le Pinot Blanc alsacien ne tient pas 20 ans — celui-ci oui.',degustation:'À l\'aveugle : COULEUR jaune pâle brillante. NEZ pomme verte, amande, fleurs alpines, minéralité volcanique — plus fin et plus minéral que l\'Alsace. BOUCHE sec, précis, acidité élevée pour la chaleur locale. Finale minérale longue. Test : si c\'est le Pinot Blanc le plus minéral et le plus long du groupe — Alto Adige.',histoire:'La Cantina Terlano (fondée 1893) est une coopérative qui produit les Pinot Bianco les plus réputés du monde. Son Vorberg (réserve) est vieilli 3 ans en grands fûts de bois, puis un an en bouteille — technique qui explique sa longévité. Des bouteilles des années 1980-90 sont encore servies lors de dégustations verticales.'}},
    ],
    monde:[
      {n:'Porphyre volcanique (Pinot Bianco)',r:'Alto Adige — Termeno, Terlano, Caldaro (Italie du Nord)',a:'Permien — 250-280 Ma',
       d:'Porphyre rouge volcanique à 300-700 m d\'altitude dans la vallée de l\'Adige. Riche en potassium. Altitude alpine → nuits très froides. La combinaison porphyre volcanique + altitude alpine crée le Pinot Bianco le plus précis, le plus minéral et le plus élégant du monde. La Cave Coopérative de Terlano produit un Pinot Bianco (Vorberg) vieilli en barrique qui peut se garder 15-20 ans.',
       s:{a:82,t:0,c:55,g:75},ar:['Pomme verte','Amande','Fleurs alpines','Minéralité volcanique','Citron sec'],
       k:'Porphyre volcanique + altitude alpine = Pinot Bianco le plus minéral et le plus long du monde. La référence absolue du cépage, souvent inconnue en dehors de l\'Italie.',fiche:{geographie:'Bade (Baden) en Allemagne du Sud est le pays du Weissburgunder (Pinot Blanc allemand). Kaiserstuhl (ancien volcan) + Ortenau (collines de Bade) donnent les meilleurs Weissburgunder d\'Allemagne. Région la plus chaude d\'Allemagne.',geologie_detail:'Lœss glaciaire (20 000 ans) sur granit volcanique du Kaiserstuhl (16 Ma). La chaleur volcanique du Kaiserstuhl donne un Weissburgunder plus charnu et plus fruité que l\'Alsace (à quelques km de distance, de l\'autre côté du Rhin).',appellations:'Baden Anbaugebiet (région viticole allemande). Bereiche du Kaiserstuhl. VDP (Verband Deutscher Prädikatsweingüter) — Grosses Gewächs (équivalent GC). Produkteurs : Dr. Heger, Bernhard Huber, Franz Keller, Salwey.',evolution:'2-5 ans. Poire mûre, pomme, fleurs printanières, noisette légère, beurre doux. Plus fruité et plus accessible que l\'Alto Adige. Certains GG tiennent 7-10 ans.',degustation:'À l\'aveugle : COULEUR jaune pâle à dorée. NEZ poire mûre, pomme dorée, fleurs légères, beurre discret. BOUCHE plus ample et plus fruité que l\'Alsace. Moins minéral qu\'Alto Adige. Test : si c\'est le Pinot Blanc le plus fruité et le plus ample sans être boisé — Bade, Kaiserstuhl.',histoire:'Le Kaiserstuhl est l\'un des seuls terroirs en dehors de la Bourgogne qui permet aux cépages bourguignons (Pinot Noir, Pinot Blanc, Chardonnay) d\'atteindre une vraie qualité européenne. La chaleur volcanique compense la latitude nordique — c\'est l\'Alsace du côté allemand du Rhin.'}},
      {n:'Lœss glaciaire sur granit (Weissburgunder)',r:'Bade — Kaiserstuhl, Ortenau (Allemagne)',a:'Lœss 20 000 ans + granit Tertiaire 16 Ma',
       d:'Lœss léger (limon glaciaire) sur granit volcanique du Kaiserstuhl. La région la plus chaude d\'Allemagne donne le Weissburgunder (Pinot Blanc) le plus charnu et le plus fruité du pays. Souvent vinifié avec un passage partiel en barrique. Style intermédiaire entre l\'élégance alsacienne et l\'opulence du Pinot Bianco d\'Alto Adige.',
       s:{a:68,t:0,c:60,g:62},ar:['Poire mûre','Pomme','Fleurs printanières','Noisette légère','Beurre doux'],
       k:'Lœss glaciaire + chaleur volcanique du Kaiserstuhl = Weissburgunder le plus charnu d\'Allemagne. Intermédiaire entre Alsace et Alto Adige en style.',fiche:{geographie:'Kaiserstuhl est un ancien volcan isolé de 557 m dans la plaine du Rhin (Bade, Allemagne du Sud). À quelques km à l\'est de l\'Alsace, séparé par le Rhin. Même latitude (48°N) que l\'Alsace mais microclimat 2-3°C plus chaud grâce à la roche volcanique sombre.',geologie_detail:'Lœss glaciaire (limon déposé il y a 20 000 ans) sur granit volcanique (basalte, 16 Ma). Le lœss est léger et aéré. La chaleur volcanique compense la latitude nordique et permet une maturation complète du Pinot Blanc (Weissburgunder).',appellations:'Baden Anbaugebiet (région viticole). Bereich Kaiserstuhl. VDP Grosses Gewächs pour les meilleurs. Producteurs : Dr. Heger, Bernhard Huber, Franz Keller, Salwey.',evolution:'2-5 ans : Poire mûre, pomme dorée, fleurs printanières, noisette légère, beurre doux. Accessible et fruité. Certains GG tiennent 7-10 ans. Plus accessible que l\'Alto Adige.',degustation:'À l\'aveugle : COULEUR jaune pâle à dorée. NEZ poire mûre, pomme dorée, fleurs printanières légères, beurre discret. BOUCHE plus ample et fruité que l\'Alsace. Moins minéral qu\'Alto Adige. Test : si c\'est le Pinot Blanc le plus fruité sans être boisé — Kaiserstuhl.',histoire:'Le Kaiserstuhl est l\'un des seuls terroirs en dehors de la Bourgogne permettant aux cépages bourguignons (Pinot Noir, Pinot Blanc, Chardonnay) d\'atteindre une vraie qualité européenne. Bernhard Huber (1992-2014) a lancé la renaissance du Pinot Noir et du Pinot Blanc du Kaiserstuhl.'}},
    ]
  }

  key:'Sur granit pauvre, la vigne stressée concentre ses terpènes (géraniol = rose, linalol = litchi). La pauvreté du sol crée la richesse du vin — le paradoxe géologique du Gewurztraminer.',
  geo:'L\'Alsace est protégée par les Vosges (1 400 m) qui bloquent les pluies atlantiques. Colmar reçoit 550 mm/an — moins que Madrid !\n\nLes 51 Grands Crus ont des sols très variés : granit, gneiss, schiste, calcaire, grès, marnes, et une unique parcelle de volcanite (Rangen de Thann).'},

  hist:'Le Kir (Aligoté + crème de cassis) a été inventé par le chanoine Félix Kir, maire de Dijon après-guerre, pour valoriser l\'Aligoté souvent trop acide seul.'},

  key:'Oregon : climat MARITIME océanique (≠ Bourgogne continentale). Même latitude (45°N), même Pinot Noir, styles comparables — mais mécanismes climatiques différents. Étés secs grâce aux Cascades. Le basalte donne une minéralité ferrugineuse différente du calcaire bourguignon.',
  hist:'David Lett (Eyrie Vineyards) a planté les premiers Pinot Noir en 1966. Son 1975 a battu des Bourgognes à Paris en 1979 — le "Jugement de Paris" du Pinot Noir.\n\nRobert Drouhin (Maison Drouhin, Beaune) a investi en Oregon en 1988 — premier Bourguignon à valider la région.'},

  key:'Region la plus méridionale du monde (44°S). Seule région de NZ avec un climat continental. Écarts thermiques de 15-20°C en été = acidité élevée malgré le soleil intense.',
  hist:'Central Otago était une région aurifère (ruée vers l\'or 1861). Les vignes abandonnées ont été replantées à partir de 1987.\n\nEn 30 ans, la région est passée de 0 à 2 200 ha et est devenue mondialement reconnue pour son Pinot Noir.'},

  hist:'Montana Wines (1973) premiers vins commercialisés en 1980. En 5 ans, le style Marlborough était célèbre mondialement.\n\nAujourd\'hui, Marlborough = 77% de toute la production viticole de NZ. Le Sauvignon Blanc = vin blanc le plus vendu au Royaume-Uni.'},

  hist:'Max Schubert (Penfolds) a créé le Grange en 1951 après un voyage à Bordeaux. Son chef lui a interdit de continuer en 1957 (trop boisé, trop cher). Il a continué en secret jusqu\'en 1960 — le vin de 1955 a alors triomphé.'},

  hist:'Jugement de Paris (1976) : un Cabernet de Napa (Stag\'s Leap 1973) bat les plus grands Bordeaux à l\'aveugle. La France est scandalisée. Le monde viticole ne sera plus jamais le même.'},

  key:'Le Chili est le seul grand pays viticole sans phylloxéra. Les Andes (est) + désert d\'Atacama (nord) ont créé une barrière naturelle infranchissable. Vignes chiliennes sur leurs propres racines depuis le XIXe siècle.',
  hist:'Le Carménère : disparu de Bordeaux après le phylloxéra (1870s), ce cépage survivait au Chili où on le croyait être du Merlot. En 1994, le prof. Jean-Michel Boursiquot identifie l\'ADN. Le Chili = seul pays à le produire.'},

  key:'Sur porphyre volcanique de Tramin, le Gewurztraminer est sec et minéral — quasi méconnaissable pour qui ne connaît que l\'Alsace. Sur sa terre natale, la géologie l\'exprime dans sa forme la plus pure.',
  hist:'Relation génétique Savagnin/Traminer confirmée par l\'ADN en 2004 : même cépage. Le Jura et l\'Alto Adige cultivent la même variété depuis des siècles sans le savoir.\n\nPanneau à l\'entrée du village : "Geburtsort des Traminers" (lieu de naissance du Traminer).'},

  key:'Schiste précambrien très ancien + double influence maritime = Chardonnay le plus "bourguignon" d\'Australie. Leeuwin Estate Art Series est régulièrement comparé à des Premiers Crus de Puligny-Montrachet dans les dégustations à l\'aveugle.',
  hist:'Le Dr. John Gladstones (UWA) identifie Margaret River en 1965 comme zone viticole potentielle grâce à une analyse climatologique. Les premières vignes (Vasse Felix) en 1967.\n\nRobert Mondavi (Napa) invite la famille Houghton à créer Leeuwin Estate en 1972 — premier grand vin australien délibérément positionné contre la Bourgogne.\n\nLeeuwin Art Series Chardonnay 1980 : premier millésime. Aujourd\'hui, une des bouteilles australiennes les plus chères et les plus collectionées.'},

  key:'Le Sémillon de Hunter Valley est le paradoxe le plus intrigant du vin mondial : léger (11°), sans boisé, acide et austère à 2 ans — puis magistral à 15-20 ans avec des arômes de toast, miel et kérosène (TDN). Tyrrell\'s Vat 1 1967 dégusté en 2020 était encore parfait.',

  hist:'Le Pinot Blanc alsacien est le résultat direct de la mutation somatique du Pinot Noir (VvMybA1 désactivé = peau blanche). En Alsace, il a progressivement remplacé les cépages plus rustiques après la Seconde Guerre mondiale.\n\nLe Crémant d\'Alsace (AOC créée en 1976) est aujourd\'hui le 2ème crémant de France en volume (environ 30 millions de bouteilles/an). Le Pinot Blanc en est la colonne vertébrale.\n\nJosmeyer (Wintzenheim) a contribué à revaloriser le Pinot Blanc alsacien comme vin de terroir sérieux dans les années 1990-2000 — montrant qu\'il pouvait vieillir et exprimer son sol.'},

function loadSaved(){
  try{const d=localStorage.getItem('oeno-app-v4');if(d)S.data=JSON.parse(d);}catch(e){}
}
async function loadFromServer(){
  try{
    const r=await fetch('/api/data');
    if(!r.ok) return;
    const d=await r.json();
    if(d&&d.cepages){S.data=d;try{localStorage.setItem('oeno-app-v4',JSON.stringify(d));}catch(e){} render();}
  }catch(e){}
}
function persist(){
  try{localStorage.setItem('oeno-app-v4',JSON.stringify(S.data));S.saved=true;setTimeout(()=>{S.saved=false;renderNav();},2200);}catch(e){}
  fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(S.data)}).catch(()=>{});
}
function update(partial,rerender){
  Object.assign(S,partial);
  if(rerender!==false) render();
}

// ─────────── HELPERS ───────────
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function btn(label,cls,onclick,extra){return `<button class="btn ${cls||''}" onclick="${esc(onclick)}" ${extra||''}>${label}</button>`;}
function badge(text,bg,tc){return `<span class="badge" style="background:${bg};color:${tc}">${esc(text)}</span>`;}
function sl(t){return `<span class="sl">${t}</span>`;}
function barRow(label,v,color){return `<div class="bar-row"><span class="bar-label">${label}</span><div class="bar-bg"><div class="bar-fill" style="width:${v}%;background:${color}"></div></div><span style="font-size:11px;color:#6b6458;min-width:28px;text-align:right">${v}%</span></div>`;}
function tags(arr){return (arr||[]).map(a=>`<span class="tag">${esc(a)}</span>`).join('');}
function typeStyle(type){return type==='rouge'?{bg:'#fef2f2',tc:'#dc2626'}:{bg:'#eff6ff',tc:'#2563eb'};}
function nivStyle(n){const m={debutant:{bg:'#f0fdf4',tc:'#16a34a'},intermediaire:{bg:'#fffbeb',tc:'#d97706'},avance:{bg:'#fef2f2',tc:'#dc2626'},expert:{bg:'#f3e8ff',tc:'#7e22ce'}};return m[n]||m['debutant'];}
