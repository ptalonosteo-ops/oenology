    monde:[
      {n:'Alluvions + argile volcanique (Rutherford Dust)',r:'Napa Valley — Rutherford, Oakville, Stags Leap (USA)',a:'Alluvions Quaternaire + volcanite Tertiaire',
       d:'Fond de vallée : alluvions fertiles de la rivière Napa. Rutherford : argile expansive unique qui crée la fameuse texture veloutée dite \'Rutherford Dust\'. Stags Leap : schiste + argile = vins soyeux. Howell Mountain : basalte volcanique à 600-800 m = Cabernet le plus structuré de Napa. La diversité géologique de Napa dans une seule vallée explique ses styles multiples.',
       s:{a:70,t:88,c:84,g:90},ar:['Cassis','Poivron rôti','Cèdre californien','Vanille','Café'],
       k:'\'Rutherford Dust\' = texture veloutée due à l\'argile expansive unique à cette zone. Impossible à reproduire ailleurs — la minéralogie d\'un sol crée la texture d\'un vin.',fiche:{geographie:'La Napa Valley est orientée N-S sur 48 km entre les Mayacamas (ouest) et les Vaca Mountains (est). La rivière Napa a déposé d\'épais alluvions dans le fond de vallée. La Baie de San Pablo à l\'extrémité sud pompe l\'air froid du Pacifique chaque après-midi — gradient thermique S (frais) → N (chaud) très marqué. Calistoga (nord) est 8-10°C plus chaud que Carneros (sud).',geologie_detail:'Diversité géologique extraordinaire :\n  Fond de vallée (Rutherford, Oakville) → Alluvions fertiles + argile expansive unique (Rutherford Dust) → texture veloutée\n  Collines ouest (Mayacamas) → Volcanite, tuf, argile volcanique → vins structurés et minéraux\n  Howell Mountain (est) → Basalte volcanique + argile rouge à 600-800 m → Cabernet le plus puissant\n  Stags Leap (est, bas) → Schiste + argile → vins soyeux et élégants\n\nChaque sous-zone de Napa donne un Cabernet de style totalement différent malgré la même latitude.',appellations:'Napa Valley AVA (1983) = première AVA de Californie.\nSous-AVA principales pour Cabernet :\n  Rutherford AVA → \'Rutherford Dust\' = texture veloutée caractéristique\n  Oakville AVA → Opus One, Robert Mondavi To Kalon vineyard\n  Stags Leap District AVA → Stag\'s Leap Wine Cellars (vainqueur du Jugement de Paris 1976)\n  Howell Mountain AVA → Altitude 600-800 m. Tanins les plus puissants.\n  Diamond Mountain AVA, Spring Mountain AVA → Collines ouest, style austère',evolution:'Napa Cabernet = grande capacité de garde :\n0-5 ans : Rouge presque opaque. Cassis intense, poivron rôti, cèdre californien, vanille (boisé). Très concentré.\n5-15 ans : Tanins s\'assouplissent. Cuir, tabac, graphite. La \'Rutherford Dust\' veloutée s\'exprime.\n15-30 ans : Apogée des grands. Opus One, Screaming Eagle, Harlan Estate : profondeur légendaire.\n30+ ans : Rarissimes mais possibles. Heitz Martha\'s Vineyard 1974 : encore extraordinaire à 50 ans.',degustation:'Napa Cabernet à l\'aveugle :\nCOULEUR : Rouge très sombre à opaque. L\'un des Cabernets les plus colorés au monde.\nNEZ : Cassis très mûr, poivron rôti, cèdre, vanille, chocolat noir. Boisé souvent perceptible.\nBOUCHE : Tanins puissants mais veloutés (effet \'Rutherford Dust\'). Alcool élevé (14-15.5%). Corps massif. Finale interminable.\n\nTest : si c\'est le Cabernet le plus concentré, le plus alcooleux et le plus boisé du groupe — probablement Napa. L\'alcool et la concentration distinguent souvent Napa du Médoc plus austère.',histoire:'1976 : \'Jugement de Paris\'. Stag\'s Leap Wine Cellars 1973 bat les plus grands Bordeaux (Mouton, Haut-Brion) dans une dégustation à l\'aveugle organisée par Steven Spurrier. La France est scandalisée. Le monde viticole ne sera plus jamais le même.\n1978 : Opus One — joint venture Robert Mondavi + Baron Philippe de Rothschild (Mouton Rothschild). Premier vin \'transatlantique\'.\nAujourd\'hui : \'Cult Wines\' de Napa (Screaming Eagle, Harlan, Bond, Promontory) se vendent à des prix supérieurs aux 1ers Crus bordelais.'}},
      {n:'Alluvions andins + sable granitique',r:'Alto Maipo — Pirque, Puente Alto (Chili)',a:'Alluvions andins holocène + granit précambrien',
       d:'Alluvions de gravier apportés par les fleuves andins à 600-1100 m d\'altitude. Sol très drainant, presque désertique en surface. Les Andes constituent un mur naturel contre les pluies : le Maipo reçoit 300 mm/an. Les nuits glaciales des Andes préservent l\'acidité malgré 3000 heures de soleil. Almaviva et Seña viennent de ces terroirs d\'altitude.',
       s:{a:72,t:90,c:83,g:92},ar:['Cassis','Menthe fraîche','Laurier','Cèdre','Graphite fin'],
       k:'Andes = réservoir d\'eau (irrigation) + fraîcheur nocturne (acidité) + soleil intense (maturité) = Cabernet chilien le plus structuré. La montagne crée les conditions idéales.',fiche:{geographie:'Le Valle del Maipo entoure Santiago, la capitale chilienne. L\'Alto Maipo (au-dessus de 600 m) est la zone des meilleurs Cabernets : Pirque, Puente Alto, Buin. La Cordillère des Andes (jusqu\'à 6 800 m) est visible et constitue la source d\'eau d\'irrigation. Les nuits sont glaciales (jusqu\'à 5°C en été) grâce à l\'altitude.',geologie_detail:'Alluvions andins : gravier quartzeux et sable déposés par les rivières descendant des Andes. Sol très drainant, presque désertique en surface.\n\nSpécificité unique : le Chili est le seul grand pays viticole SANS phylloxéra. Les Andes (est), désert d\'Atacama (nord), Pacifique (ouest) et Patagonie (sud) ont créé une barrière naturelle infranchissable pour ce puceron.\n\nRésultat : les vignes chiliennes poussent sur leurs PROPRES racines depuis le XIXe siècle — avantage théorique en termes de concentration racinaire.',appellations:'Denominaciones de Origen (DO) chiliennes :\n  Valle del Maipo → Cabernet Sauvignon dominant. \'Chili = Maipo = Cabernet\'.\n  Alto Maipo (sous-zone) → Altitude 600-1100 m. Les plus fins.\n  Valle de Colchagua → 200 km au sud. Cab + Carménère. Plus riche.\n  Valle de Cachapoal → Entre Maipo et Colchagua.\n\nVins icônes : Almaviva (Rothschild + Concha y Toro), Seña (Mondavi + Chadwick), Don Melchor (Puente Alto).',evolution:'Le Cabernet chilien évolue bien dans les meilleures conditions :\n0-3 ans : Cassis, menthe fraîche, laurier, poivron. Accessible mais pas complexe.\n3-10 ans : Complexité croissante. Cèdre, graphite, épices andines. L\'altitude préserve la fraîcheur.\n10-25 ans : Almaviva, Seña, Don Melchor des grandes années : profondeur proche des grands Médocs.\n25+ ans : Rarissimes mais confirment le potentiel de garde des meilleurs terroirs d\'altitude.',degustation:'Alto Maipo Cabernet à l\'aveugle :\nCOULEUR : Rouge sombre, très coloré (soleil intense de l\'Amérique du Sud).\nNEZ : Cassis, menthe fraîche, laurier, herbes andines. Légèrement plus végétal que Bordeaux.\nBOUCHE : Tanins soyeux, structure bien présente, acidité fraîche pour la chaleur. Alcool modéré (13-14%). Corps médium-plus.\n\nTest : si c\'est le Cabernet le plus équilibré entre puissance et fraîcheur, avec des herbes médicinales au nez — probablement Alto Maipo.',histoire:'La vigne au Chili date des conquistadors espagnols (XVIe s.) pour le vin de messe. Les cépages bordelais importés dans les années 1850 par les élites chiliennes francophiles.\n1994 : Le professeur Jean-Michel Boursiquot (Montpellier) identifie l\'ADN du \'Merlot\' chilien : c\'est en réalité du Carménère ! Cépage bordelais disparu en France après le phylloxéra, survivant au Chili.\n2004 : Almaviva est régulièrement noté 95+ points par Parker — validation internationale du Cabernet chilien de prestige.'}},
    ]

  'syrah':{
    fr:[
      {n:'Granit (arène granitique)',r:'Côte-Rôtie — Côte Brune et Côte Blonde',a:'Hercynien — 300 Ma',
       d:'Granit décomposé en arène sablonneuse sur les pentes à 35-60° de la Côte-Rôtie. Côte Brune : granit sombre riche en mica et en fer → vins puissants, épicés, poivrés, tanniques. Côte Blonde : granit clair + calcaire → vins plus floraux, violette dominante, plus soyeux. Marcel Guigal vinifie ses trois La La (La Mouline, La Landonne, La Turque) sur ces deux sols distincts.',
       s:{a:68,t:75,c:78,g:88},ar:['Mûre','Violette','Poivre noir (rotundone)','Olive noire','Lard fumé'],
       k:'La rotundone (molécule du poivre noir) se synthétise dans la pellicule sur granit sec. Ce n\'est pas une métaphore poétique — c\'est de la biochimie documentée par l\'INRAE.',fiche:{geographie:'Côte-Rôtie = \'côte rôtie\' — la pente exposée sud est si chaude en été que les vignerons croyaient que cette chaleur extrême expliquait la concentration. 340 ha sur des pentes vertigineuses (30-60°) dominant le Rhône. Ampuis est le village central. La Côte Brune et la Côte Blonde se font face — nommées selon la couleur de leur sol.',geologie_detail:'Granit décomposé en arène sablonneuse (hercynien, 300 Ma).\n\nCôte Brune : granit sombre riche en mica (biotite noir) → sol plus froid, plus fertile, retient plus d\'eau → vins plus puissants, plus tanniques, plus poivrés. Marcel Guigal \'La Landonne\'.\nCôte Blonde : granit clair + traces de calcaire → sol plus chaud, plus drainant → vins plus floraux, plus soyeux, violette dominant. Marcel Guigal \'La Mouline\'.\n\nLa rotundone (molécule du poivre noir) se synthétise dans la pellicule sur granit sec stressé hydrique — documenté par l\'INRAE.',appellations:'Côte-Rôtie AOC :\n  100% Syrah (jusqu\'à 20% de Viognier blanc autorisé pour l\'assemblage — pratique traditionnelle)\n  Les \'La La\' de Guigal : La Mouline, La Landonne, La Turque\n  Autres : Burgaud, Chapoutier La Mordorée, Jamet, Gangloff, Rostaing\n\nHermitage AOC : 130 ha sur une colline solitaire. Lieux-dits : Les Bessards, Le Méal, L\'Hermite (rouges). Les Rocoules, Chante-Alouette (blancs Marsanne).\n\nCornas AOC : 100 ha. 100% Syrah. Style le plus rustique et le plus concentré du Rhône nord.',evolution:'Côte-Rôtie / Hermitage — les plus grands vins de Syrah du monde :\n0-5 ans : Rouge quasi noir. Mûre intense, violette, olive noire, poivre noir. Très fermé, presque impénétrable.\n5-15 ans : Les tanins commencent à s\'assouplir. Truffe, viande fumée, réglisse émergent.\n15-30 ans : Apogée. Hermitage des grandes années (1990, 1999, 2003) : profondeur légendaire. \'La Chapelle\' de Jaboulet 1961 est considéré parmi les 5 meilleurs vins du XXe siècle.\n30-50 ans : Réservé aux plus grands. L\'Hermitage dépasse parfois la Côte-Rôtie en potentiel de garde.',degustation:'Syrah du Rhône Nord à l\'aveugle :\nCOULEUR : Rouge très sombre à violacé (jeune). Grenat profond (évolué).\nNEZ : Signature triple : violette + poivre noir + olive noire. Unique au monde.\nBOUCHE : Tanins fermes, corps imposant, acidité modérée (terroir méditerranéen), finale épicée et longue.\n\nTest décisif : le poivre noir et l\'olive noire simultanément. C\'est la signature de la Syrah de granite du Rhône Nord. Le Barossa australien a le poivre mais pas l\'olive. Aucun autre terroir ne combine ces deux arômes.',histoire:'La colline de l\'Hermitage est mentionnée depuis le XIIIe siècle. La légende dit qu\'un croisé revenu de Terre Sainte (Gaspard de Stérimberg) s\'y est retiré en ermite — d\'où \'Hermitage\'.\nPaul Jaboulet Aîné : \'La Chapelle\' 1961, 100/100 chez Parker, est considéré parmi les 5 plus grands vins du XXe siècle. Prix aux enchères : 3 000-6 000 € la bouteille.\nMarcel Guigal a révolutionné la Côte-Rôtie dans les années 1980 avec ses \'La La\' — 42 mois d\'élevage en barriques neuves au lieu de 24 en fûts traditionnels. Style contesté mais internationalement reconnu.'}},
      {n:'Granit + lœss',r:'Hermitage — Tain-l\'Hermitage (Colline de l\'Hermitage)',a:'Hercynien + Quaternaire lœss',
       d:'Colline solitaire dominant le Rhône. Granit ancien en haut (Les Bessards, Le Méal = meilleurs lieux-dits pour les rouges), lœss (limon éolien) en bas (Péléat = meilleurs pour les blancs Marsanne). La Syrah d\'Hermitage peut vieillir 50 ans dans les grands millésimes. Paul Jaboulet Aîné \'La Chapelle\' 1961 : l\'un des 5 plus grands vins du XXe siècle.',
       s:{a:65,t:78,c:80,g:95},ar:['Mûre','Tabac','Olive noire','Réglisse','Cuir vieilli','Truffe'],
       k:'Le lœss donne la rondeur, le granit la structure et la longévité. Hermitage = la plus grande Syrah du monde. 50 ans de garde dans les grands millésimes.',fiche:{geographie:'L\'Hermitage est une colline solitaire de 130 ha dominant le Rhône à Tain-l\'Hermitage. Visible à des dizaines de kilomètres. Les lieux-dits sont très distincts : Les Bessards (nord, granit pur, meilleurs rouges), Le Méal (centre, granit + lœss, polyvalent), Les Greffieux (gravier, accessible).',geologie_detail:'Granit hercynien (300 Ma) au sommet → meilleurs rouges. Lœss (limon éolien quaternaire) dans les creux et en bas → blancs (Marsanne).\n\nLes Bessards : granit pur, très drainant, vieilles vignes. Les Bessards de Chave ou de Jaboulet sont les lieux-dits qui donnent les vins de Syrah les plus tanniques et les plus longs du monde.\n\nLe Méal : mélange de lœss et de granit. Plus accessible que Les Bessards mais plus complexe que les lieux-dits en bas.',appellations:'Hermitage AOC :\n  Rouges : 100% Syrah. Lieux-dits : Les Bessards, Le Méal, L\'Hermite, Les Greffieux, La Maison Blanche\n  Blancs : Marsanne (+ Roussanne optionnel). Lieux-dits : Les Rocoules, Chante-Alouette, Péléat\n\nProducteurs références : M. Chapoutier (Méal, Ermite, Pavillon), Jaboulet (La Chapelle), Jean-Louis Chave, Cave de Tain, Tardieu-Laurent.\n\nHermitage est produit en quantité infime — 400 000 bouteilles/an pour toute l\'appellation.',evolution:'L\'Hermitage est le vin de Syrah qui vieillit le plus longtemps :\n0-7 ans : Quasi impénétrable. Rouge noir, tanins sévères. Patience obligatoire.\n7-20 ans : Première ouverture. Mûre, olive noire, réglisse, viande fumée. Grandiose mais austère.\n20-40 ans : Apogée. Les Bessards de grandes années (1990, 1978) : profondeur et complexité légendaires.\n40-60 ans : Des bouteilles mythiques (\'La Chapelle\' 1961, 1978) prouvent que l\'Hermitage est un vin de 60 ans.',degustation:'Rhône Nord rouge à l\'aveugle :\nCOULEUR : Rouge quasi noir (jeune). Grenat profond, opaque même avec 20 ans.\nNEZ : Mûre très mûre, truffe, olive noire, viande fumée, réglisse. Tabac et cuir avec l\'âge.\nBOUCHE : Tanins les plus puissants du Rhône. Corps massif. Alcool modéré (12.5-13.5%). Finale interminable, légèrement amère.\n\nDISTINGUER de Côte-Rôtie : Hermitage est plus puissant, moins floral, moins violette. Côte-Rôtie = élégance. Hermitage = puissance.',histoire:'Hermitage a été pendant 3 siècles le vin le plus cher et le plus réputé du monde (XVIIe-XIXe siècle). Les grands châteaux bordelais l\'achetaient pour \'hermitager\' leurs vins (ajouter de l\'Hermitage pour renforcer les années faibles).\nUne lettre de Thomas Jefferson (1787) mentionne l\'Hermitage : \'Le plus grand vin de France\'.\nLa négligence du marché au XXe siècle (la mode du Bordeaux a éclipsé le Rhône) a laissé l\'Hermitage à des prix raisonnables jusqu\'aux années 1990. Aujourd\'hui, les Bessards de Chave approchent les prix des 1ers Crus bordelais.'}},
      {n:'Schiste et grès de Cabrières',r:'Faugères et Schiste du Languedoc',a:'Paléozoïque — 350-400 Ma',
       d:'Schiste métamorphique très ancien des Cévennes. Sol pauvre, filtrant, acide. La Syrah sur schiste languedocien donne des vins différents du Rhône : moins épicés, plus fruités, avec une minéralité saline typique du schiste. Faugères est l\'AOC languedocienne exclusivement sur schiste — la seule de France avec Banyuls.',
       s:{a:70,t:68,c:72,g:78},ar:['Mûre','Cassis','Minéralité saline','Garrigue','Épices sombres'],
       k:'Schiste = minéralité saline unique. Faugères sur schiste = la Syrah la plus minérale du Languedoc. La géologie du schiste s\'exprime directement dans le vin.',fiche:{geographie:'Faugères est dans les Cévennes cévenoles, arrière-pays de Montpellier. Altitude 200-450 m. Schiste métamorphique omniprésent — on trouve des fragments noirs partout. Saint-Chinian est à côté, sur des sols différents (calcaire + argile). La Syrah est le cépage roi de Faugères sur schiste.',geologie_detail:'Schiste métamorphique paléozoïque (350-400 Ma). Très ancien, pauvre, fissuré, friable. Il s\'effrite en lamelles caractéristiques.\n\nPropriétés du schiste :\n1. Absorbe et restitue la chaleur (couleur sombre) → maturité assurée même en altitude\n2. Drainant → pas de stress hydrique excessif\n3. Pauvre → concentration des arômes forcée\n4. Minéralité saline unique — différente du calcaire ou du granit\n\nFaugères est l\'une des deux seules AOC languedociennes sur schiste exclusivement (avec Banyuls).',appellations:'Appellations du schiste languedocien :\n  Faugères AOC → 100% schiste. Rouge + blanc (Roussanne, Marsanne, Grenache blanc).\n  Saint-Chinian AOC → schiste + calcaire selon zones\n  Banyuls AOC → schiste pyrénéen + VDN (Vin Doux Naturel)\n  Collioure AOC → même territoire que Banyuls mais vin sec\n\nProducteurs références Faugères : Domaine Léon Barral, Alquier, Chateau des Estanilles.',evolution:'La Syrah de Faugères évolue mieux que sa réputation de \'vin du Midi\' ne le laisse croire :\n1-3 ans : Mûre, cassis, garrigue (thym, romarin), minéralité saline. Accessible et fruité.\n3-8 ans : Épices, cuir léger, herbes sèches, réglisse. Meilleure expression du schiste.\n8-15 ans : Les domaines sérieux (Léon Barral, Alquier) développent une complexité proche d\'un bon Hermitage.\n\nAttention à l\'alcool : le Languedoc chaud donne facilement 14-15° — risque d\'excès sans maîtrise.',degustation:'Faugères Syrah à l\'aveugle :\nCOULEUR : Rouge profond, très coloré (soleil méditerranéen intense).\nNEZ : Mûre intense, garrigue (thym sauvage, romarin), réglisse. Minéralité saline du schiste.\nBOUCHE : Tanins fermes, alcool élevé, corps généreux. Épices méditerranéennes en finale.\n\nDISTINGUER du Rhône Nord : moins de violette et d\'olive noire. Plus de garrigue et de soleil. La minéralité saline du schiste est différente du granit rhôdanien.',histoire:'La région de Faugères est habitée depuis le Néolithique (dolmens nombreux). La culture du schiste est ancienne — il s\'exporte facilement car il se casse en dalles régulières utilisées pour la construction.\nCrise viticole des années 1980 : le Languedoc surproduisait des vins de table ordinaires. La création de l\'AOC Faugères en 1982 a lancé la reconversion qualitative autour du schiste.\nLéon Barral (Domaine Léon Barral, depuis 1993) est l\'emblème de la biodynamie sur schiste languedocien — ses vins sont devenus des références mondiales pour les amateurs de vins naturels.'}},
      {n:'Calcaire + galets (Crozes-Hermitage)',r:'Crozes-Hermitage — plaine et terrasses du Rhône',a:'Alluvions Quaternaire + calcaire',
       d:'La plaine de Crozes-Hermitage (15 000 ha !) est sur des terrasses alluviales et des sols calcaires très fertiles. La Syrah y produit des vins simples, fruités, accessibles — très différents de la colline de l\'Hermitage qui la domine. Même appellation géographiquement, qualité très variable : le sol fertile de la plaine donne des vins de consommation courante.',
       s:{a:68,t:58,c:68,g:62},ar:['Mûre accessible','Violette légère','Poivre doux','Fruits noirs simples'],
       k:'Plaine fertile de Crozes vs colline granitique d\'Hermitage : même cépage, même zone, qualités opposées. Le sol fertile donne toujours un vin moins complexe — la vigne est trop à l\'aise.',fiche:{geographie:'Crozes-Hermitage est la grande appellation du Rhône Nord en volume (15 000 ha). Elle entoure la colline de l\'Hermitage mais ses sols sont très différents. La plaine et les terrasses alluviales (Pont-de-l\'Isère, Chanos-Curson) sont fertiles et plates. Seulement quelques villages sur les pentes granitiques (Gervans, Larnage) approchent la qualité de l\'Hermitage.',geologie_detail:'Sols très variés dans Crozes-Hermitage :\n  Plaine alluviale → argile et cailloutis fertiles. Haut rendement, vins dilués.\n  Terrasses de galets → galets de quartz sur argile. Meilleur que la plaine.\n  Pentes granitiques (Gervans, Larnage) → similaires à l\'Hermitage. Meilleure qualité.\n\nConclusion pédagogique : même appellation, qualités très différentes selon le sol. La plaine fertile donne des vins de consommation ; les pentes granitiques des vins de garde.',appellations:'Crozes-Hermitage AOC :\n  Rouges : 100% Syrah (+ 15% Marsanne/Roussanne optionnel)\n  Blancs : Marsanne + Roussanne\n  Surface : 15 000 ha (contre 130 ha pour l\'Hermitage)\n\nProducteurs qualité : M. Chapoutier (Les Meysonniers, Les Varonnières), Tardieu-Laurent, Alain Graillot (Guiraude), Cave de Tain (Les Hauts du Fief).\n\nBon rapport qualité-prix : Crozes d\'un bon producteur coûte 4-5x moins cher qu\'un Hermitage équivalent.',evolution:'Crozes-Hermitage évolue plus vite que l\'Hermitage :\n1-3 ans : Mûre, violette, poivre. Accessible et plaisant. Excellente entrée dans le style Rhône Nord.\n3-8 ans : Meilleure expression. Épices, olive noire, réglisse. Plaisir maximal.\n8-15 ans : Seulement les terroirs granitiques (Graillot Guiraude, Chapoutier Les Varonnières) tiennent bien.\n15+ ans : Rarissimes — une exception confirmant la règle.',degustation:'Crozes à l\'aveugle :\nCOULEUR : Rouge profond, moins opaque que l\'Hermitage.\nNEZ : Violette, mûre, poivre noir, notes de terre. Plus fruité et moins austère que l\'Hermitage.\nBOUCHE : Tanins modérés (si terroir de plaine) à fermes (si terroir granitique). Corps médium. Plus accessible que l\'Hermitage.\n\nRègle : si c\'est une Syrah du Rhône Nord mais moins austère et moins complexe qu\'un Hermitage — probablement Crozes ou Saint-Joseph.',histoire:'Crozes-Hermitage est l\'appellation \'introductive\' au style Rhône Nord. C\'est par elle que la plupart des amateurs commencent leur découverte de la Syrah française.\nAlain Graillot (depuis 1985 à Pont-de-l\'Isère) a montré que Crozes-Hermitage pouvait atteindre une vraie qualité — son Guiraude est régulièrement comparé à de l\'Hermitage.\nLa Cave de Tain (coopérative) produit 40% du volume de Crozes-Hermitage et offre un niveau de qualité remarquable pour une grande coopérative.'}},

    monde:[
      {n:'Sable rouge sur argile (Barossa Valley)',r:'Barossa Valley — Centurion, Marananga (Australie du Sud)',a:'Éolien Pléistocène + alluvions',
       d:'Sable rouge éolien très filtrant sur argile profonde. Ce sol sableux sec est naturellement résistant au phylloxéra (le puceron ne peut pas survivre dans un sol trop sec et sableux). Certaines vignes de Shiraz datent de 1847 — parmi les plus vieilles vignes productrices du monde, jamais greffées. Le vieux bois donne une concentration et une complexité uniques.',
       s:{a:62,t:72,c:80,g:90},ar:['Mûre confite','Chocolat noir','Poivre australien','Réglisse','Cuir'],
       k:'Sable sec = résistance naturelle au phylloxéra depuis 1847. Les plus vieilles vignes de Shiraz non-greffées du monde. Le vieux bois concentre comme nulle autre vigne.',fiche:{geographie:'Barossa Valley : 70 km au nord d\'Adélaïde. Vallée encaissée entre deux chaînes de collines. Les Barossa Ranges à l\'est (altitude 400-550 m = Eden Valley) sont beaucoup plus fraîches. Le fond de vallée reçoit 300-350 mm de pluie/an — presque semi-aride. L\'irrigation par les rivières descendant des Ranges est indispensable.',geologie_detail:'Sable rouge éolien (aeolien red sand) déposé par le vent sur des milliers d\'années, sur argile profonde.\n\nPropriété exceptionnelle : la résistance naturelle au phylloxéra.\nLe puceron Daktulosphaira vitifoliae ne peut pas survivre dans un sol trop sec et trop sableux — il ne peut pas creuser ses galeries. Certaines vignes de Shiraz n\'ont JAMAIS été greffées depuis 1847 — parmi les plus vieilles vignes productrices du monde.\n\nLe \'Old Vine Charter\' de la Barossa Valley protège ces vignes anciennes : 35+ ans = Old Vine. 70+ ans = Survivors. 100+ ans = Centenarian.',appellations:'Barossa Valley GI (Geographic Indication SA) :\n  Pas de classification formelle — mais système informel par âge de vigne\n  Old Vine Charter : vieilles vignes protégées et signalées sur l\'étiquette\n  Eden Valley GI (dans les Barossa Ranges) → Riesling + Shiraz plus frais\n\nProducteurs références : Penfolds (Grange), Elderton, Henschke (Hill of Grace), Torbreck, Rockford, Two Hands, St Hallett.',evolution:'Le Shiraz de Barossa est conçu pour vieillir :\n0-5 ans : Rouge quasi noir. Mûre confite, chocolat noir, réglisse, poivre. Concentré et massif.\n5-15 ans : Tanins s\'assouplissent. Cuir, cèdre, café, épices exotiques.\n15-30 ans : Penfolds Grange et Henschke Hill of Grace atteignent leur plénitude. Profondeur et complexité légendaires.\n30-50 ans : Grange de 1971 ou 1990 : encore parfaits — preuve que le Shiraz australien peut vieillir aussi longtemps que les grands Bordeaux.',degustation:'Barossa Shiraz à l\'aveugle :\nCOULEUR : Rouge quasi noir, presque impénétrable à la lumière.\nNEZ : Mûre très confite, chocolat noir, réglisse intense, poivre australien, cuir. Note vanille (boisé américain).\nBOUCHE : Tanins puissants et veloutés. Corps massif. Alcool élevé (14-15.5%). Finale interminable et chocolatée.\n\nTest : si c\'est la Syrah la plus concentrée, la plus chocolatée et la plus confiture du groupe — Barossa Valley. L\'Europe ne produit rien d\'aussi massif.',histoire:'Penfolds Grange 1951 : Max Schubert s\'inspire de son voyage à Bordeaux (1950) pour créer un vin australien de grande garde. Son chef lui interdit de continuer en 1957 (trop cher, trop boisé). Il continue en secret jusqu\'en 1960 quand le 1955 triomphe dans une dégustation.\nHill of Grace de Henschke : plantée en 1860 par des colons luthériens allemands. La parcelle n\'a jamais été greffée. Parmi les vignes les plus vieilles et les plus précieuses du monde.\nBarossa Valley a toujours eu des vignerons d\'origine allemande luthérienne (immigrants fuyant la persécution religieuse en Prusse, 1840s) qui ont maintenu des traditions viticoles européennes.'}},
      {n:'Granit côtier et calcaire (McLaren Vale)',r:'McLaren Vale — Australie du Sud',a:'Précambrien + calcaire mésozoïque',
       d:'McLaren Vale est à 30 km au sud d\'Adélaïde, entre les Fleurieu Hills et le Golfe Saint-Vincent. L\'influence maritime de l\'Océan Austral (courant froid) rafraîchit les nuits de 8-10°C par rapport à Barossa. Sol varié : granit précambrien dans les collines, calcaire dans la plaine. La Syrah y est plus élégante, moins concentrée que Barossa — style intermédiaire entre Barossa et Hermitage.',
       s:{a:68,t:68,c:75,g:80},ar:['Mûre fraîche','Olive','Violette','Poivre blanc','Herbes marines'],
       k:'McLaren Vale : influence maritime + granit + calcaire = Shiraz plus élégant que Barossa. La mer tempère et le sol varie — résultat : un style médian entre Barossa massif et Hermitage fin.',fiche:{geographie:'McLaren Vale est à 30 km au sud d\'Adélaïde, sur la Fleurieu Peninsula. Côté Golfe Saint-Vincent (Mer de Tasman) au nord + côte Océan Austral au sud. Double influence maritime. Latitude 35°S. Altitude 0-380 m selon les zones. Contraste fort avec Barossa : McLaren Vale est maritime, Barossa est continental.',geologie_detail:'Sols très variés dans McLaren Vale :\n  Granit précambrien (collines) → Shiraz le plus minéral et le plus frais\n  Schiste côtier (bandes littorale) → Syrah avec minéralité marine\n  Calcaire (zones intérieures) → richesse et structure\n  Argile profonde (plaine) → Grenache productif\n\nL\'influence maritime de l\'Océan Austral (courant froid) refroidit les nuits de 8-10°C vs Barossa. D\'où un Shiraz plus élégant, moins concentré, avec une acidité naturelle supérieure.',appellations:'McLaren Vale GI (SA) :\n  Principales appellations : McLaren Vale Shiraz, Grenache, Cabernet Sauvignon\n  Pas de classification officielle\n\nProducteurs références : d\'Arenberg (Dead Arm), Clarendon Hills, Wirra Wirra (RSW), Hugh Hamilton, Coriole, S.C. Pannell.\n\nLe \'Dead Arm\' de d\'Arenberg : Shiraz de vieilles vignes sur argile profonde. Vins les plus concentrés de McLaren Vale, proches de la puissance d\'un Barossa.',evolution:'McLaren Vale Shiraz évolue plus vite que Barossa :\n0-3 ans : Mûre fraîche, olive noire, violette, herbes marines. Accessible.\n3-8 ans : Cuir, épices, réglisse. La complexité s\'affirme.\n8-20 ans : Les meilleurs (Dead Arm, Clarendon Hills Astralis) atteignent une vraie profondeur. Style intermédiaire entre Côte-Rôtie et Barossa.\n20+ ans : Rarissimes mais possibles dans les grands millésimes.',degustation:'McLaren Vale à l\'aveugle :\nCOULEUR : Rouge sombre mais légèrement moins opaque que Barossa.\nNEZ : Mûre fraîche (pas confite), olive noire, violette, herbes côtières (lavande marine, garrigue australe). Plus frais et moins chocolaté que Barossa.\nBOUCHE : Tanins fermes mais élégants. Corps médium-plus. Acidité meilleure que Barossa. Finale épicée et herbacée.\n\nTest : si c\'est le Shiraz australien le plus \'européen\' du groupe — McLaren Vale. Plus proche d\'une Syrah française que le Barossa.',histoire:'McLaren Vale est l\'une des plus anciennes régions viticoles d\'Australie : John Reynell plante les premières vignes en 1839 (3 ans après la fondation d\'Adélaïde).\nLa coopérative de McLaren Vale (fondée 1906) a longtemps dominé la production. Les domaines indépendants de qualité émergent dans les années 1980.\nd\'Arenberg (Chester Osborn) est devenu l\'ambassadeur mondial de McLaren Vale avec ses cuvées au noms excentriques (Dead Arm, Footbolt, Stump Jump) — un style communicatif qui a mis la région sur la carte internationale.'}},

  'grenache':{
    fr:[
      {n:'Galets roulés quartzeux',r:'Châteauneuf-du-Pape — plateau de La Crau',a:'Pliocène — 2-5 Ma (dépôts rhônans glaciaires)',
       d:'Galets de quartz de 5 à 40 cm de diamètre, déposés par le Rhône lors des périodes glaciaires sur un plateau à 120 m d\'altitude. Ces galets emmagasinent la chaleur solaire (400 W/m²) et la restituent aux raisins la nuit — un radiateur naturel géant. Le mistral (110 jours/an, jusqu\'à 100 km/h) sèche les raisins et interdit les maladies fongiques. Résultat : Grenache à 14-16° d\'alcool naturel.',
       s:{a:45,t:30,c:80,g:75},ar:['Fraise confite','Framboise chaude','Garrigue','Kirsch','Épices chaudes'],
       k:'Galets = radiateurs naturels. Le Grenache, naturellement pauvre en tanins, ne doit pas sa puissance à ses raisins mais à son sol. Les galets poussent l\'alcool à 14-16° naturellement.',fiche:{geographie:'Châteauneuf-du-Pape est un plateau à 120 m dominant le Rhône, à 20 km au nord d\'Avignon. Les galets roulés sont visibles partout — on les appelle \'roulés à la mer\' car ils ont l\'aspect de galets de plage. Le mistral (vent froid du nord) souffle en moyenne 110 jours/an. La lavande et les amandiers entourent le vignoble.',geologie_detail:'Galets de quartz de 5 à 40 cm de diamètre, déposés par le Rhône lors des périodes glaciaires (quand le Rhône avait un débit 10 fois supérieur). Ces galets ont deux fonctions thermiques :\n1. Jour : absorbent et emmagasinent la chaleur solaire\n2. Nuit : restituent cette chaleur aux raisins et à l\'air ambiant\n\nImpact sur le Grenache : alcool naturel de 14-16° sans chaptalization. Le Grenache, naturellement peu tannique, ne doit pas sa puissance à ses raisins mais à son sol.',appellations:'Châteauneuf-du-Pape AOC :\n  13 cépages autorisés (dont des rares comme Vaccarèse, Picardan, Terret Noir)\n  Grenache dominant (~80% de la plupart des vins)\n  Minimum 12.5° d\'alcool requis (souvent 14-15°)\n  Bouteilles marquées d\'un écusson papal gravé en relief\n\nGigondas AOC : altitude + calcaire → style plus frais. Sous-estimé vs Châteauneuf.\nVacqueyras AOC : style intermédiaire.\nTavel AOC : SEULE appellation 100% rosé de France.\nLirac AOC : rouge, blanc et rosé. Excellent rapport Q/P.',evolution:'Le Grenache de Châteauneuf évolue mieux que sa réputation \'vin du soleil\' ne le laisse croire :\n0-5 ans : Fraise confite, framboise chaleureuse, kirsch, garrigue. Généreux et accessible.\n5-15 ans : Complexité croissante. Cuir, épices orientales, olive confite, sous-bois.\n15-25 ans : Les grandes propriétés (Rayas, La Janasse Cuvée Chaupin, Château Beaucastel) atteignent une profondeur remarquable.\n25+ ans : Rarissimes. Rayas des grandes années tient 40 ans.',degustation:'Châteauneuf-du-Pape à l\'aveugle :\nCOULEUR : Rouge grenat profond, très coloré, parfois ambré au bord avec l\'âge.\nNEZ : Fraise confite, kirsch, garrigue (thym, lavande), épices chaudes, réglisse, cuir avec l\'âge.\nBOUCHE : Très peu de tanins (Grenache = cépage peu tannique). Alcool très élevé et enveloppant. Corps massif. Finale épicée et chaude.\n\nTest : si le vin rouge est très alcooleux mais avec peu de tanins — probablement Grenache dominant du Rhône Sud.',histoire:'Jean XXII (pape d\'Avignon 1316-1334) a fait construire son château d\'été à Châteauneuf. La papauté d\'Avignon (1309-1377) a développé massivement le vignoble.\nChâteauneuf-du-Pape est à l\'ORIGINE de tout le droit viticole français : le Baron Le Roy de Boiseaumarié a rédigé en 1923 les premières règles d\'appellation d\'origine, modèle de l\'AOC créée en 1935.\nCuriosité unique : une ordonnance municipale de 1954 interdit le survol du vignoble par les \'engins volants non identifiés\' — encore en vigueur.'}},
      {n:'Schiste ardoisé noir (Llicorella)',r:'Priorat — Terrassas de la Llicorella (Catalogne, Espagne)',a:'Silurien/Cambrien — 450-500 Ma',
       d:'Schiste ardoisé noir très ancien, friable, riche en silice et en mica. L\'un des sols les plus pauvres et les plus difficiles de la viticulture mondiale. Les vieilles vignes de Garnacha (Grenache) centenaires doivent creuser leurs racines à 15-20 m dans les fissures pour trouver eau et nutriments. Rendements < 10 hl/ha (contre 30-50 pour un vin ordinaire). Le Priorat fut redécouvert en 1989 par René Barbier et Álvaro Palacios.',
       s:{a:55,t:55,c:82,g:88},ar:['Mûre très concentrée','Réglisse','Pierre chaude','Kirsch sombre','Fer'],
       k:'Llicorella = l\'un des sols les plus difficiles au monde. La pauvreté extrême du schiste + racines à 15-20 m = concentration maximale. L\'E\'Ermita est devenu le vin espagnol le plus cher.',fiche:{geographie:'Le Priorat est une enclave montagneuse de 20 km de diamètre dans la Serra de Montsant (Catalogne). Routes étroites et pentes vertigineuses — inaccessible pendant des siècles. Les vignes sont plantées en terrasses taillées dans la llicorella. Altitude 100-750 m. Vue imprenable sur la Serra de Montsant au nord.',geologie_detail:'La llicorella est un schiste ardoisé noir (silurien/cambrien, 450-500 Ma). Elle s\'effrite facilement en lamelles noires brillantes au mica très présent.\n\nCaractéristiques extrêmes :\n  Très pauvre → rendements de 3-10 hl/ha (contre 30-50 pour un vin ordinaire)\n  Très drainant → stress hydrique intense en été\n  Chaleur absorbée par la couleur noire → maturation malgré l\'altitude\n\nConséquence : les racines de Garnacha centenaires descendent à 15-20 m dans les fissures pour trouver eau et nutriments.',appellations:'Priorat DOCa (2ème DOCa de Catalogne après la Rioja) :\n  Garnacha (Grenache) + Cariñena (Carignan) + Cabernet Sauvignon, Syrah, Merlot\n  Rendement maximum : 6 000 kg/ha (très bas)\n  Minimum d\'alcool : 13.5°\n\nClos emblématiques (5 \'Clos\' fondateurs) : Clos Mogador (René Barbier), L\'Ermita (Álvaro Palacios), Clos Erasmus, Clos Martinet, Clos de l\'Obac\n\nMontsant DOQ : autour du Priorat. Calcaire + argile. Rapport Q/P exceptionnel.',evolution:'Priorat Grenache évolue lentement malgré (ou grâce à) la concentration initiale :\n0-5 ans : Mûre noire, kirsch, réglisse, fer, pierre chaude. Tanins présents contrairement au Châteauneuf.\n5-15 ans : Profondeur minérale de la llicorella s\'affirme. Épices orientales, cacao amer.\n15-30 ans : L\'Ermita et Clos Mogador des grandes années atteignent une profondeur légendaire.\n\nContrairement au Châteauneuf sur galets, le Priorat sur llicorella a de vraies tanins — la structure de longue garde manque souvent au Grenache.',degustation:'Priorat à l\'aveugle :\nCOULEUR : Rouge très sombre, presque noir. Légèrement plus sombre que Châteauneuf.\nNEZ : Mûre très noire, pierre chaude de llicorella, réglisse, cacao amer. Moins floral que Châteauneuf.\nBOUCHE : Tanins PRÉSENTS (contrairement au Châteauneuf). Corps massif. Alcool élevé. Minéralité ferrugineuse unique.\n\nTest décisif : si c\'est un Grenache avec des tanins perceptibles et une note de pierre chaude — Priorat sur llicorella. Sans tanins = Grenache de galets (Châteauneuf, style).',histoire:'Le monastère de Scala Dei (XIIe siècle, ordre de la Chartreuse) a développé le vignoble pendant des siècles. Abandonné après la désamortisation de 1835, les vignes ont été laissées à l\'abandon pendant 150 ans.\n1989 : René Barbier, Álvaro Palacios et 3 autres vignerons redécouvrent Priorat et fondent leurs \'Clos\'. En 10 ans, la région passe d\'inconnue à l\'une des plus cotées d\'Espagne.\nÁlvaro Palacios avait 23 ans — son L\'Ermita est maintenant le vin espagnol le plus cher du monde (5 000-10 000 € la bouteille en grand millésime).'}},
      {n:'Calcaire et argile (Gigondas, Vacqueyras)',r:'Gigondas et Vacqueyras — Dentelles de Montmirail',a:'Crétacé + calcaire mésozoïque',
       d:'Calcaire et argile au pied des Dentelles de Montmirail (falaises calcaires spectaculaires). Altitude 250-500 m — beaucoup plus fraîche que Châteauneuf. Le Grenache sur calcaire donne des vins plus frais, plus acides et moins alcooleux que sur galets. Gigondas est souvent qualifié de \'petit Châteauneuf\' mais avec plus de minéralité calcaire.',
       s:{a:55,t:35,c:72,g:72},ar:['Fraise fraîche','Cerise noire','Garrigue fraîche','Épices','Minéralité'],
       k:'Calcaire + altitude de Gigondas = Grenache plus frais et plus minéral que Châteauneuf. L\'altitude et le calcaire jouent le même rôle régulateur que la mer dans d\'autres régions.',fiche:{geographie:'Gigondas et Vacqueyras sont au pied des Dentelles de Montmirail — un cirque de falaises calcaires spectaculaires (450 m de haut) dans le Vaucluse. Altitude 250-500 m. Plus frais et plus venteux que Châteauneuf-du-Pape situé 15 km au sud. La différence d\'altitude (100-200 m de plus) est capitale pour l\'acidité du Grenache.',geologie_detail:'Calcaire et argile des Dentelles de Montmirail (Crétacé et calcaire mésozoïque).\n\nContraste avec Châteauneuf :\n  Châteauneuf = galets roulés (matière minérale pauvre, chaleur intense, alcool maximum)\n  Gigondas = calcaire + argile (minéralité calcaire, altitude fraîcheur, acidité préservée)\n\nRésultat : le Grenache de Gigondas est plus frais, plus acide, plus minéral, avec un alcool plus modéré (13-14° vs 14-16° à Châteauneuf).',appellations:'Appellations des Dentelles de Montmirail :\n  Gigondas AOC → Rouge + Rosé. Pas de blanc.\n  Vacqueyras AOC → Rouge + Blanc (Roussanne, Clairette). Plus accessible que Gigondas.\n  Beaumes-de-Venise AOC → Rouge + Muscat (Muscat de Beaumes-de-Venise, VDN)\n\nProducteurs références Gigondas : Domaine Les Pallières (Brunier, ex-Vieux Télégraphe), Domaine Santa Duc, Château de Saint-Cosme.',evolution:'Gigondas évolue mieux que sa réputation ne le laisse croire :\n1-3 ans : Fraise fraîche, cerise, garrigue légère. Plus frais que Châteauneuf.\n3-10 ans : Complexité croissante. Épices, cuir, herbes de Provence.\n10-20 ans : Les meilleurs domaines (Les Pallières, Santa Duc) développent une vraie profondeur minérale.\n20+ ans : Rarissimes mais possibles dans les grandes années. Gigondas est un vin sous-estimé.',degustation:'Gigondas à l\'aveugle :\nCOULEUR : Rouge grenat profond. Similaire à Châteauneuf mais légèrement plus transparent.\nNEZ : Fraise fraîche, cerise, garrigue (thym, lavande), minéralité calcaire. Moins de kirsch et d\'épices exotiques que Châteauneuf.\nBOUCHE : Tanins plus présents que Châteauneuf (le calcaire + l\'altitude structurent mieux). Acidité plus élevée. Alcool plus modéré.\n\nTest : si c\'est un Grenache plus frais et plus minéral que Châteauneuf — probablement Gigondas ou une zone d\'altitude du Rhône Sud.',histoire:'Gigondas obtient son AOC en 1971 — après des années où les vins étaient vendus sous l\'étiquette Côtes du Rhône. La reconnaissance de l\'AOC a été la conséquence directe de la qualité supérieure due au calcaire et à l\'altitude des Dentelles.\nLe village de Gigondas est mentionné dans des textes romains (Jocunditas = lieu de joie). La tradition viticole remonte à l\'Antiquité.'}},
      {n:'Schiste noir + granit (Banyuls, Maury)',r:'Roussillon — Banyuls-sur-Mer, Maury (Pyrénées-Orientales)',a:'Paléozoïque — 350-450 Ma',
       d:'Schiste noir et granit des Pyrénées-Orientales. Sol très pauvre et très pentu (jusqu\'à 40°). Le Grenache sur schiste noir absorbe la chaleur et concentre intensément. A Banyuls, la production traditionnelle est le Vin Doux Naturel (VDN) — le Grenache est muté à l\'alcool pendant la fermentation pour conserver le sucre résiduel. En sec (Collioure), le schiste donne des rouges très épicés.',
       s:{a:48,t:42,c:82,g:85},ar:['Cerise confite','Cacao','Poivre noir','Garrigue sèche','Raisin sec'],
       k:'Schiste pyrénéen absorbant + chaleur intense = Grenache très concentré. Banyuls (VDN) et Collioure (sec) : deux styles opposés du même sol et du même cépage.',fiche:{geographie:'Le Roussillon (Pyrénées-Orientales) est la région la plus ensoleillée de France — 2800 h/an. Les coteaux schisteux de Banyuls-sur-Mer et Collioure plongent directement dans la Méditerranée. Pentes à 30-40°, terrasses étroites. Le mistral et la tramontane (vent froid du NW) soufflent régulièrement.',geologie_detail:'Schiste noir et granit des Pyrénées-Orientales (paléozoïque, 350-450 Ma). Sol très pauvre, très pentu, très absorbant la chaleur (couleur sombre).\n\nBanyuls : sol schisto-gréseux, presque vertical. Le Grenache y concentre intensément. Production traditionnelle : Vin Doux Naturel (VDN) — fermentation stoppée à l\'alcool pour conserver le sucre.\n\nCollioure : même schiste, vin sec. Le Grenache donne des vins très concentrés, très tanniques pour ce cépage.',appellations:'Appellations du schiste roussillonnais :\n  Banyuls AOC → Grenache dominant. VDN (alcool muté). Grand Cru avec 30 mois de vieillissement minimum.\n  Collioure AOC → Grenache + Syrah + Mourvèdre. Vin sec. Rouge + Blanc + Rosé.\n  Maury AOC → VDN similaire à Banyuls mais à l\'intérieur des terres. Schiste de Maury.',evolution:'Banyuls / Collioure : deux styles du même sol :\nBanyuls VDN : 5-25 ans selon le style (rancion = vieillissement oxydatif en bois/verre). La chaleur et l\'oxydation contrôlée donnent des arômes de café, noix, rancio.\nCollioure rouge : 3-12 ans. Concentration élevée sur schiste, tanins présents, épices sombres.',degustation:'À l\'aveugle :\nCOULEUR : Banyuls rancion = brun acajou (oxydation voulue). Collioure rouge = très sombre.\nNEZ : Banyuls = café, noix, pruneau, réglisse, rancion. Collioure = cerise confite, schiste, épices.\nBOUCHE : Banyuls = doux (sucre résiduel), chaleureux (alcool muté). Collioure = tanins fermes, sec, concentré.',histoire:'Banyuls est mentionné depuis le Moyen Âge comme \'grand vin doux\'. Les templiers et les hospitaliers possédaient des vignes ici.\nLe peintre Henri Matisse s\'est inspiré du paysage de Collioure pour ses œuvres fauves (1905). Le village reste un haut lieu de la peinture française.\nSalvador Dali était un grand amateur de Banyuls VDN — il habitait à Cadaqués (Espagne), à quelques km de la frontière.'}},

    monde:[
      {n:'Llicorella (schiste ardoisé)',r:'Priorat DOCa — Gratallops, El Lloar (Espagne)',a:'Silurien — 450 Ma',
       d:'La llicorella de Priorat, décrite ci-dessus pour le marché français, donne les Grenaches (Garnacha) les plus concentrés du monde. L\'Ermita d\'Álvaro Palacios est issu de vignes centenaires sur ce sol. Les rendements dérisoires (parfois 3-5 hl/ha) créent une concentration que le Châteauneuf sur galets ne peut pas égaler.',
       s:{a:48,t:58,c:88,g:90},ar:['Mûre noire','Pierre chaude','Kirsch','Cacao amer','Fer'],
       k:'Llicorella + vieilles vignes de 100 ans + 3-5 hl/ha = la concentration de Grenache la plus extrême au monde. L\'Ermita : l\'un des vins les plus chers d\'Espagne.',fiche:{geographie:'McLaren Vale est décrit dans la section Syrah — voir ci-dessus. Pour le Grenache, les vignes les plus vieilles (pré-1900) poussent sur les sols schisteux et granitiques des collines centrales. Style \'old vine Grenache\' très différent de la production de masse.',geologie_detail:'Granit et schiste précambrien sur les collines centrales de McLaren Vale. Plus pauvre et plus drainant que les argiles de la plaine.\n\nLes vieilles vignes de Grenache de McLaren Vale (certaines d\'avant 1900) sur sol pauvre donnent une concentration comparable au Priorat espagnol — mais avec un style plus fruité et moins minéral.',appellations:'McLaren Vale Grenache :\n  McLaren Vale GI → Rouge (Grenache dominant) + GSM (Grenache-Syrah-Mourvèdre)\n  Pas de hiérarchie officielle\n  Producteurs : d\'Arenberg (Coppermine Road Grenache), Clarendon Hills, S.C. Pannell, Hickinbotham (The Peake)',evolution:'Vieilles vignes Grenache de McLaren Vale :\n1-3 ans : Fraise confite, framboise chaude, épices australiennes. Accessible.\n3-10 ans : Complexité croissante. La concentration du vieux bois s\'exprime.\n10-20 ans : Les Coppermine Road et Clarendon Hills tiennent bien. Style sud-rhônien australien.',degustation:'À l\'aveugle :\nCOULEUR : Rouge rubis profond, moins sombre que Barossa Shiraz.\nNEZ : Fraise confite, framboise, épices chaudes, chocolat léger. Plus fruité que le Priorat.\nBOUCHE : Peu de tanins (Grenache). Corps généreux. Alcool élevé. Finale épicée.\nTest : si c\'est le Grenache le plus fruité et le moins minéral du groupe — probablement McLaren Vale.',histoire:'La tradition du Grenache en McLaren Vale est portée par les familles vigneronnes d\'origine dalmate (immigrants croates) qui ont planté massivement ce cépage dans les années 1880-1900.\nd\'Arenberg (Chester Osborn) a mis les vieilles vignes de Grenache de McLaren Vale sur la carte internationale dans les années 2000 avec son Coppermine Road Grenache.'}},
      {n:'Granit et schiste (McLaren Vale)',r:'McLaren Vale — Australie du Sud',a:'Précambrien + métamorphique',
       d:'Le Grenache de McLaren Vale est planté sur des sols granitiques et schisteux des collines. C\'est la région australienne qui produit le Grenache le plus sérieux — vieilles vignes (certaines d\'avant 1900) sur sol pauvre. Style méditerranéen chaud, fruité et épicé, comparable à un bon Châteauneuf-du-Pape mais avec un profil plus confituré.',
       s:{a:45,t:35,c:78,g:78},ar:['Fraise confite','Framboise chaude','Épices australiennes','Cacao','Cuir'],
       k:'McLaren Vale : vieilles vignes de Grenache sur granit = le meilleur Grenache australien. Une région sous-cotée qui rivalise avec Châteauneuf pour les amateurs.',fiche:{geographie:'McLaren Vale est décrit dans la section Syrah — voir ci-dessus. Pour le Grenache, les vignes les plus vieilles (pré-1900) poussent sur les sols schisteux et granitiques des collines centrales. Style \'old vine Grenache\' très différent de la production de masse.',geologie_detail:'Granit et schiste précambrien sur les collines centrales de McLaren Vale. Plus pauvre et plus drainant que les argiles de la plaine.\n\nLes vieilles vignes de Grenache de McLaren Vale (certaines d\'avant 1900) sur sol pauvre donnent une concentration comparable au Priorat espagnol — mais avec un style plus fruité et moins minéral.',appellations:'McLaren Vale Grenache :\n  McLaren Vale GI → Rouge (Grenache dominant) + GSM (Grenache-Syrah-Mourvèdre)\n  Pas de hiérarchie officielle\n  Producteurs : d\'Arenberg (Coppermine Road Grenache), Clarendon Hills, S.C. Pannell, Hickinbotham (The Peake)',evolution:'Vieilles vignes Grenache de McLaren Vale :\n1-3 ans : Fraise confite, framboise chaude, épices australiennes. Accessible.\n3-10 ans : Complexité croissante. La concentration du vieux bois s\'exprime.\n10-20 ans : Les Coppermine Road et Clarendon Hills tiennent bien. Style sud-rhônien australien.',degustation:'À l\'aveugle :\nCOULEUR : Rouge rubis profond, moins sombre que Barossa Shiraz.\nNEZ : Fraise confite, framboise, épices chaudes, chocolat léger. Plus fruité que le Priorat.\nBOUCHE : Peu de tanins (Grenache). Corps généreux. Alcool élevé. Finale épicée.\nTest : si c\'est le Grenache le plus fruité et le moins minéral du groupe — probablement McLaren Vale.',histoire:'La tradition du Grenache en McLaren Vale est portée par les familles vigneronnes d\'origine dalmate (immigrants croates) qui ont planté massivement ce cépage dans les années 1880-1900.\nd\'Arenberg (Chester Osborn) a mis les vieilles vignes de Grenache de McLaren Vale sur la carte internationale dans les années 2000 avec son Coppermine Road Grenache.'}},
    ]

  'sauvignon-blanc':{
    fr:[
      {n:'Silex (nodules de silice pure)',r:'Pouilly-Fumé — Saint-Andelain, Tracy-sur-Loire',a:'Éocène — 40-50 Ma (dans matrice calcaire)',
       d:'Nodules de silex (silice pure, SiO₂) enrobés dans un calcaire crayeux. Le silex frappé produit une odeur de soufre → note \'fumée\' et \'pierre à fusil\' du Pouilly-Fumé (d\'où le nom). Quand le Sauvignon Blanc pousse sur silex, ses thiols (molécules aromatiques) se complexifient dans une direction minérale, pierreuse, presque soufrée. L\'opposé du style tropical.',
       s:{a:88,t:0,c:50,g:65},ar:['Pierre à fusil','Groseille blanche','Silex fumé','Agrumes secs','Herbe sèche'],
       k:'Silex → soufre → note \'fumée\' de Pouilly-Fumé. C\'est la géologie qui nomme le vin. Le silex et les thiols du Sauvignon se combinent pour créer une signature unique au monde.',fiche:{geographie:'Pouilly-Fumé est sur la rive droite de la Loire, face à Sancerre. Le village de Pouilly-sur-Loire est à 200 m d\'altitude, le vignoble s\'étend sur des coteaux calcaires exposés au Sud et à l\'Est. La Loire joue un rôle régulateur thermique — la masse d\'eau adoucit les gelées printanières.',geologie_detail:'Silex (nodules de silice pure SiO₂) dans une matrice calcaire kimméridgienne. Le silex est une roche sédimentaire siliceuse formée à partir de restes d\'organismes marins (Éocène, 40-50 Ma).\n\nMécanisme aromatique unique : le Sauvignon Blanc sur silex produit des thiols (notamment le 4-MMP = 4-mercapto-4-méthylpentan-2-one) qui sentent le silex frappé = soufre + grillé. C\'est littéralement la molécule d\'une allumette frottée.\n\nC\'est le SOL qui nomme le vin : \'Blanc Fumé\' = blanc qui fume comme la pierre à fusil quand on la frappe.',appellations:'Pouilly-Fumé AOC (rive droite de Loire) :\n  100% Sauvignon Blanc\n  Pouilly-sur-Loire AOC : même territoire mais avec Chasselas (cépage différent) — ne pas confondre !\n\nLieux-dits réputés : Les Loges, Les Berthiers, Sorel, Les Chailloux\nProducteurs références : Didier Dagueneau (père et fils), Ladoucette (Château du Nozet), de Villaine, Henri Bourgeois.',evolution:'Pouilly-Fumé est un vin de plaisir précoce à moyen terme :\n1-3 ans : Buis intense, silex fumé, groseille blanche, citron. La signature fumée est maximale.\n3-7 ans : Complexité croissante. Les thiols évoluent en notes plus tertiaires (noisette, pain grillé). La minéralité calcaire s\'affirme.\n7-12 ans : Les cuvées de Didier Dagueneau (Silex, Pur Sang) des grandes années (2005, 2010) vieillissent remarquablement.\n12+ ans : Rarissimes — seuls les Dagueneau des grandes années.',degustation:'Pouilly-Fumé à l\'aveugle :\nCOULEUR : Jaune pâle, reflets verts. Jamais doré intense.\nNEZ : LA FUMÉE est la signature. Buis, silex (comme une allumette), groseille blanche, pamplemousse.\nBOUCHE : Acidité tranchante, corps léger-médium, finale minérale et fumée.\n\nDISTINGUER de Sancerre : Pouilly-Fumé = plus fumé, plus silex. Sancerre (terres blanches) = plus fruité, plus floral. Mais certaines parcelles de Sancerre sur silex ressemblent à Pouilly — le vrai test est la position géographique.',histoire:'Robert Mondavi a rebaptisé son Sauvignon Blanc californien \'Fumé Blanc\' en 1968 en hommage au Blanc Fumé de Pouilly. Ce coup marketing a propulsé la notoriété du Sauvignon Blanc de Loire ET du Nouveau Monde simultanément.\nDidier Dagueneau (1956-2008), \'l\'enfant terrible de la Loire\', a révolutionné Pouilly-Fumé en réduisant les rendements et en produisant des vins de garde extraordinaires. Son décès dans un accident d\'ULM à 52 ans a été un choc pour le monde viticole.'}},
      {n:'Terres blanches (kimméridgien)',r:'Sancerre — Chavignol, Ménétréol, Verdigny',a:'Kimméridgien — 155 Ma',
       d:'Calcaire kimméridgien blanc et crayeux, le même sol que Chablis à 100 km au nord-est. Ici, il est planté en Sauvignon Blanc — le plus célèbre Sauvignon du monde. Les terres blanches donnent un Sauvignon fruité et floral, avec une acidité vive et une minéralité calcaire. Le Clos du Chêne Marchand et le Monts Damnés sont les lieux-dits les plus réputés.',
       s:{a:85,t:0,c:48,g:62},ar:['Buis','Groseille blanche','Citron','Craie','Fleur de sureau'],
       k:'Terres blanches de Sancerre = Sauvignon fruité et floral avec acidité vive. Comparer avec Pouilly-Fumé (silex) : même vallée, même cépage, deux minéralités distinctes selon le sol.',fiche:{geographie:'La colline de Sancerre (400 m) domine la Loire et la plaine de Berry. Vignoble entièrement exposé au Sud et Sud-Est. Les \'terres blanches\' (sol blanc caractéristique) sont visibles à l\'œil nu. La Loire crée un microclimat légèrement plus doux que l\'intérieur des terres.',geologie_detail:'Terres blanches = calcaire kimméridgien crayeux blanc (155 Ma). Identique au sol de Chablis (100 km au NE) et de Pouilly-Fumé (rive opposée de la Loire).\n\nDifférence de sol selon les communes :\n  Bué : terres blanches pures → Sauvignon le plus floral\n  Verdigny : terres blanches + silex → style intermédiaire\n  Chavignol : terres blanches + caillotins (calcaire dur) → le plus structuré\n  Ménétréol : silex dominant → plus proche de Pouilly-Fumé',appellations:'Sancerre AOC (rouge + blanc + rosé) :\n  Blanc : 100% Sauvignon Blanc → 80% de la production\n  Rouge : 100% Pinot Noir\n  Rosé : 100% Pinot Noir\n\nLieux-dits réputés pour les blancs : Clos du Chêne Marchand (Bué), Clos de la Poussie, Monts Damnés, Le Grand Chemarin.\n\nProducteurs références : Henri Bourgeois (Sancerre de Montigny), Lucien Crochet, François Cotat, Edmond Vatan, Vincent Pinard.',evolution:'Sancerre blanc évolue mieux que sa réputation de \'vin à boire jeune\' ne le laisse croire :\n1-3 ans : Buis, citron, groseille blanche, silex léger. À son meilleur pour la fraîcheur.\n3-7 ans : Complexité croissante. Minéralité calcaire plus prononcée. Les terres blanches s\'expriment.\n7-15 ans : Les cuvées de François Cotat et Edmond Vatan des grandes années vieillissent magnifiquement — profondeur comparable à un bon 1er Cru de Chablis.\n15+ ans : Rarissimes mais possibles.',degustation:'Sancerre blanc à l\'aveugle :\nCOULEUR : Jaune pâle, reflets verts. Jamais doré.\nNEZ : Buis (pas aussi fumé que Pouilly), citron frais, groseille blanche, fleur de sureau, calcaire.\nBOUCHE : Acidité tranchante mais légèrement plus ronde que Pouilly-Fumé (moins de silex). Corps léger-médium. Finale minérale.\n\nRègle : Sancerre = \'Sauvignon Loire fruité et floral\'. Pouilly-Fumé = \'Sauvignon Loire fumé et minéral\'.',histoire:'Sancerre est une ville fortifiée médiévale dont les fortifications (XIe-XIVe s.) sont encore partiellement visibles. Sa viticulture remonte à l\'époque romaine.\nAvant le phylloxéra, le vignoble de Sancerre était planté à 80% en Pinot Noir. Le Sauvignon Blanc a pris le dessus après la reconstitution post-phylloxéra — le marché préférant les blancs.\nHenri Bourgeois (négociant-propriétaire à Sancerre) a été le premier exportateur massif vers les USA et le Royaume-Uni dans les années 1970, propulsant Sancerre à la notoriété mondiale.'}},
      {n:'Calcaire et tuffeau',r:'Touraine — Sauvignon de Touraine, Reuilly, Quincy',a:'Turonien — 85-90 Ma (tuffeau) + calcaire',
       d:'Calcaire et tuffeau de la Loire moyenne. Le Sauvignon de Touraine est plus léger et plus simple que Sancerre — le sol calcaire moins minéral et le climat plus océanique donnent un vin fruité d\'accès facile, moins tendu. Reuilly (sur sable et gravier) est encore plus léger. Ces appellations offrent le style Sauvignon Loire à prix très accessible.',
       s:{a:80,t:0,c:42,g:52},ar:['Pomme verte','Groseille','Citron frais','Herbe fraîche','Fleurs'],
       k:'Touraine calcaire = Sauvignon Loire accessible et fruité. La hiérarchie Sancerre > Touraine s\'explique entièrement par la qualité du sol. Le tuffeau donne moins de tension que le kimméridgien.',fiche:{geographie:'La Touraine (Val de Loire) est la région la plus large de l\'appellation Loire. Le Sauvignon de Touraine pousse sur des sols calcaires et tuffeau (Indre-et-Loire, Loir-et-Cher). Reuilly (Cher + Indre) est sur des sols de sable et gravier alluvionnaire. Quincy (Cher) est sur des sables anciens.',geologie_detail:'Tuffeau (calcaire crayeux poreux du Turonien, 85-90 Ma) dominant en Touraine. La porosité du tuffeau donne de la légèreté et de la fraîcheur au Sauvignon.\n\nSols de Reuilly : sables et graviers alluviaux. Très drainants. Sol le plus léger de la Loire centrale pour le Sauvignon — vins correspondants très légers et directs.\n\nSols de Quincy : sables anciens déposés au Tertiaire. Pauvreté maximale → fraîcheur et légèreté.',appellations:'Appellations Loire centrale pour Sauvignon :\n  Sauvignon de Touraine AOC → Sauvignon Blanc. Rapport Q/P excellent.\n  Reuilly AOC → Blanc (Sauvignon) + Rouge (Pinot Noir) + Rosé (Pinot Gris)\n  Quincy AOC → 100% Sauvignon Blanc. Très sec, très léger.\n  Menetou-Salon AOC → Sauvignon + Pinot Noir. Qualité proche de Sancerre à -30% de prix.',evolution:'Sauvignon de Touraine : consommation rapide.\n1-2 ans : Pomme verte, citron frais, buis léger, herbe fraîche. Direct et désaltérant.\n2-4 ans : Légère évolution. Certains Menetou-Salon développent plus de complexité.\n4+ ans : Rarissimes. L\'acidité diminue et le fruit s\'efface.\n\nCes vins sont conçus pour la fraîcheur immédiate — pas la garde.',degustation:'À l\'aveugle :\nCOULEUR : Jaune pâle, presque incolore. Le plus pâle des Sauvignon Loire.\nNEZ : Herbe fraîche, pomme verte, citron, buis léger. Moins complexe et moins fumé que Sancerre ou Pouilly.\nBOUCHE : Corps léger. Acidité vive. Directe, simple, désaltérante.\n\nTest : si c\'est le Sauvignon Loire le plus léger et le plus simple — Touraine, Reuilly ou Quincy.',histoire:'La Touraine est souvent appelée \'le jardin de la France\' (villes des châteaux de la Loire : Amboise, Chenonceau, Chambord). Sa viticulture bénéficie de cet attrait touristique.\nMenetou-Salon est la grande surprise de la Loire centrale : qualité proche de Sancerre, prix 30-40% inférieurs. Les amateurs initiés y trouvent les meilleurs rapports Q/P de la région.'}},
      {n:'Graves et sable (Pessac-Léognan blanc)',r:'Pessac-Léognan — Graves de Bordeaux',a:'Quaternaire — 0.1-2 Ma',
       d:'Graves de sable et gravier sur argile. Le Sauvignon Blanc bordelais est très différent du Sancerre : plus rond, moins herbacé, élevé en barrique. Il est presque toujours assemblé avec le Sémillon pour apporter l\'aromatique et l\'acidité. Château Haut-Brion Blanc et Domaine de Chevalier Blanc sont parmi les blancs les plus chers et les plus complexes de France.',
       s:{a:72,t:0,c:68,g:82},ar:['Citron confit','Pamplemousse','Herbe fraîche','Toast','Noisette'],
       k:'Graves bordelaises + barrique + assemblage Sémillon = Sauvignon très différent de Sancerre. La géologie (gravier fertile) et l\'élevage boisé changent complètement le profil aromatique.',fiche:{geographie:'Pessac-Léognan est au sud de Bordeaux, sur la Rive Gauche de la Garonne. C\'est l\'appellation la plus proche de la ville (certaines vignes sont dans la banlieue de Bordeaux). Les blancs de Pessac-Léognan (Sauvignon + Sémillon) comptent parmi les plus chers de France — rivalisant avec les grands blancs de Bourgogne.',geologie_detail:'Graves (galets quartzeux) identiques au Médoc, mais dans une zone plus froide au sud de Bordeaux.\n\nPour les blancs : le Sauvignon Blanc sur graves donne un profil aromatique radicalement différent de Sancerre :\n  Moins d\'arômes de buis et de silex\n  Plus de richesse, de corps, de texture\n  Souvent élevé en barrique → notes de toast, noisette, vanille\n  Généralement assemblé avec le Sémillon → opulence et longévité',appellations:'Pessac-Léognan AOC (pour les blancs) :\n  Sauvignon Blanc + Sémillon en assemblage\n  Château Haut-Brion Blanc (seul 1er Grand Cru Classé de Pessac pour les blancs)\n  Domaine de Chevalier Blanc, Smith Haut Lafitte Blanc, Malartic-Lagravière Blanc\n\nLa Classification de 1953 a classé les meilleures propriétés de Pessac-Léognan pour les blancs ET les rouges.',evolution:'Les blancs de Pessac-Léognan vieillissent magnifiquement :\n1-5 ans : Citron confit, pamplemousse, noisette grillée, toast. Belle fraîcheur.\n5-15 ans : Complexité croissante. Miel de fleurs, cire, noisette. Les meilleurs s\'ouvrent pleinement.\n15-30 ans : Haut-Brion Blanc et Domaine de Chevalier des grandes années : profondeur extraordinaire. Parmi les plus grands blancs du monde.\n30+ ans : Rarissimes. Haut-Brion Blanc 1989 ou 2000 : encore sublimes.',degustation:'À l\'aveugle :\nCOULEUR : Jaune dorée, plus intense que les Sauvignon de Loire.\nNEZ : Citron confit, pamplemousse, herbe fraîche, boisé (toast, noisette, vanille). Moins de buis que Sancerre ou Pouilly.\nBOUCHE : Corps plus ample. Texture plus riche (Sémillon). Boisé perceptible. Alcool plus élevé.\n\nTest : si c\'est un Sauvignon riche et boisé avec du corps — probablement Pessac-Léognan. Le Sauvignon de Loire est plus léger et moins boisé.',histoire:'Château Haut-Brion est la plus ancienne grande propriété de Bordeaux (mentionnée en 1525). C\'était déjà réputé en 1663 quand Samuel Pepys (diariste anglais) note dans son journal avoir bu un vin excellent à Londres : \'Ho Bryan, a French wine... with a good and most particular taste\'.\nHaut-Brion Blanc produit seulement 5 000-8 000 bouteilles/an (contre 25 000 de rouge) — une des rares allocations à l\'échelle de la Romanée-Conti.'}},

    monde:[
      {n:'Alluvions de gravier (Wairau)',r:'Marlborough — Wairau Valley et Awatere (Nouvelle-Zélande)',a:'Alluvions Quaternaire de rivière',
       d:'Alluvions de gravier et de sable déposés par la rivière Wairau dans une plaine semi-aride. Sol très drainant — l\'irrigation est nécessaire. UV parmi les plus intenses du monde (trou de la couche d\'ozone au-dessus de l\'Antarctique). Nuits froides du Pacifique. Cette combinaison unique génère des thiols (4MMP = buis + fruit de la passion) à des concentrations jamais atteintes ailleurs. Marlborough a inventé un nouveau style mondial en 1980.',
       s:{a:90,t:0,c:45,g:50},ar:['Buis intense','Fruit de la passion','Pamplemousse','Groseille verte','Herbe fraîche'],
       k:'UV extrêmes + nuits froides Pacifique + graviers drainants = concentration maximale de thiols. Marlborough a créé un nouveau style de Sauvignon Blanc en 1980 — aujourd\'hui copié dans le monde entier.',fiche:{geographie:'Marlborough (île du Sud, NZ) est dans une plaine encadrée par les Kaikoura Ranges (au nord). Climat sec et ensoleillé avec des UV parmi les plus intenses du monde (trou de la couche d\'ozone au-dessus de l\'Antarctique). La rivière Wairau a déposé d\'épais alluvions. Nuits très froides (courant froid du Pacifique).',geologie_detail:'Alluvions de gravier et sable de la rivière Wairau. Sol très drainant — l\'irrigation est nécessaire en été. Le stress hydrique contrôlé concentre les thiols.\n\nCombinaison unique :\n  UV extrêmes (synthèse des thiols = 4-MMP, buis + fruit de la passion)\n  Nuits froides Pacifique (préservation des thiols : la fraîcheur nocturne empêche leur évaporation)\n  Graviers drainants (stress hydrique calculé)\n\nCette équation est impossible à reproduire ailleurs. C\'est pourquoi Marlborough a créé un style unique en 1980.',appellations:'Marlborough GI (Geographic Indication NZ) :\n  80% du Sauvignon Blanc de NZ\n  Sous-régions : Wairau Valley (alluvions, tropical), Southern Valleys (argile, minéral), Awatere Valley (plus froid, plus végétal)\n\nProducteurs : Cloudy Bay (premier à populariser Marlborough), Villa Maria, Kim Crawford, Brancott Estate (anciennement Montana), Greywacke, Dog Point.',evolution:'Marlborough Sauvignon est conçu pour la fraîcheur immédiate :\n0-2 ans : Maximum de fraîcheur aromatique. Buis, fruit de la passion, pamplemousse, herbe coupée. C\'est ici que le vin est à son meilleur.\n2-4 ans : Les thiols s\'estompent légèrement. La minéralité prend le dessus.\n4+ ans : Perte de fraîcheur. Ce vin n\'est pas fait pour la garde — c\'est une qualité, pas un défaut.\n\nConclusion : ouvrir les Marlborough jeunes. Pas de garde.',degustation:'Marlborough Sauvignon à l\'aveugle :\nCOULEUR : Jaune très pâle, reflets verts très nets.\nNEZ : LE PLUS AROMATIQUE des Sauvignon. Buis très intense, fruit de la passion, pamplemousse, herbe fraîche. Facile à identifier.\nBOUCHE : Acidité tranchante, corps léger, fruité explosif, finale courte.\n\nTest : si c\'est le Sauvignon le plus aromatique et le plus tropical — Marlborough. Aucun autre terroir n\'atteint cette intensité de buis et de fruit exotique.',histoire:'Montana Wines (1973) plante les premières vignes commerciales à Marlborough. Premier millésime commercialisé : 1980. En 5 ans, le style Marlborough est célèbre dans le monde entier.\nCloudy Bay (fondée 1985 par David Hohnen, Margaret River) lance Marlborough à l\'international avec son Sauvignon Blanc devenu emblématique. Il est aujourd\'hui produit à 600 000 bouteilles/an.\nAujourd\'hui : Marlborough = 77% de toute la production viticole de NZ. Le Sauvignon Blanc de Marlborough est le vin blanc le plus vendu au Royaume-Uni.'}},
      {n:'Schiste calcaire et silex',r:'Styrie — Sauvignon Blanc de Südsteiermark (Autriche)',a:'Miocène — 15-20 Ma',
       d:'Sol de schiste et d\'argile calcaire dans les collines de la Styrie du Sud (Südsteiermark), à la frontière slovène. Le Sauvignon Blanc autrichien est totalement différent de Marlborough ou de Sancerre : plus minéral, plus austère, avec une acidité extrême et des arômes herbacés très prononcés. Les meilleurs Steirischer Sauvignon Blanc vieillissent remarquablement bien (10-15 ans).',
       s:{a:93,t:0,c:45,g:72},ar:['Herbe fraîche','Buis sec','Poivron vert','Pierre','Agrumes verts'],
       k:'Styrie : schiste calcaire + altitude alpine + acidité extrême = Sauvignon Blanc le plus nordique et le plus austère d\'Europe. Long vieillissement, style polarisant mais fascinant.',fiche:{geographie:'La Styrie du Sud (Südsteiermark) est dans le sud de l\'Autriche, à la frontière slovène. Relief très accidenté : collines à 300-600 m d\'altitude. Microclimats extrêmement variés selon l\'exposition. Région viticole la plus \'nordique\' pour le Sauvignon Blanc — les vins y sont très différents de Marlborough ou de Sancerre.',geologie_detail:'Schiste et argile calcaire (Miocène, 15-20 Ma). Sol très acide, très drainant, pauvre. La vigne stresse fortement — acidité naturelle extrême.\n\nImpact sur le Sauvignon Blanc :\n  Acidité la plus haute de tous les Sauvignon mondiaux\n  Arômes herbacés très prononcés (poivron vert, herbe fraîche, asperge) — appréciés des connaisseurs\n  Potentiel de garde exceptionnel (10-15 ans pour les meilleurs)\n  Alcool naturellement bas (11.5-13°) — légèreté alpine',appellations:'Appellations autrichiennes pour Sauvignon :\n  Südsteiermark DAC → Sauvignon Blanc + Welschriesling + Morillon (Chardonnay)\n  Klassic / Steirischer Klassik → style standard\n  Ried-Lagen (lieux-dits) → équivalent 1er Cru\n  Grosses STK Lagen → équivalent Grand Cru\n\nProducteurs : Tement, Sattler, Manfred Tement, Polz, Wohlmuth.',evolution:'Le Steirischer Sauvignon Blanc est l\'un des blancs à plus grand potentiel de garde du monde :\n1-3 ans : Herbe fraîche, poivron vert, citron vert, buis austère. Austère et polarisant.\n3-8 ans : Complexité croissante. Le végétal s\'intègre. Minéralité schisteuse prononcée.\n8-15 ans : Les meilleurs Tement (Zieregg) et Sattler de grandes années : profondeur extraordinaire. Les herbeux deviennent des fumés.\n15+ ans : Possibles dans les grandes années — prouvant que le Sauvignon Blanc peut vieillir.',degustation:'Styrie à l\'aveugle :\nCOULEUR : Jaune pâle très légère. Parfois presque incolore.\nNEZ : Herbe fraîche très prononcée, poivron vert, buis austère, acidité minérale. Le plus \'végétal\' des Sauvignon mondiaux.\nBOUCHE : Acidité EXTRÊME. Corps léger. Très sec. Finale longue et minérale.\n\nTest : si c\'est le Sauvignon le plus acide, le plus végétal et le plus austère du groupe — c\'est la Styrie. Style polarisant : soit on adore, soit on trouve ça trop austère.',histoire:'La Styrie du Sud a une tradition viticole depuis l\'époque romaine (IVe siècle apr. JC). La région a appartenu à l\'Autriche, puis à la Yougoslavie (pour la partie slovène actuelle), puis à l\'Autriche après la Seconde Guerre mondiale.\nManfred Tement a révolutionné la Styrie dans les années 1990 en réduisant les rendements et en montrant que le Sauvignon Blanc styrien pouvait atteindre la complexité d\'un Grand Cru — transformant l\'image internationale de la région.'}},
    ]
