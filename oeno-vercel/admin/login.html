<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion — Admin Œnologie</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       background:#1a0a0a;min-height:100vh;display:grid;place-items:center}
  .card{background:#fff;border-radius:16px;padding:40px;width:360px;
        box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .logo{text-align:center;font-size:48px;margin-bottom:8px}
  h1{text-align:center;font-size:20px;color:#1a1710;margin-bottom:4px}
  .sub{text-align:center;font-size:13px;color:#9a9080;margin-bottom:28px}
  label{display:block;font-size:12px;font-weight:600;color:#4a4035;
        text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  input[type=password]{width:100%;padding:11px 14px;border:1.5px solid #e5e0d5;
    border-radius:8px;font-size:15px;outline:none;transition:border .15s}
  input[type=password]:focus{border-color:#8b1a1a}
  button{width:100%;padding:12px;margin-top:16px;background:#8b1a1a;color:#fff;
         border:none;border-radius:8px;font-size:15px;font-weight:600;
         cursor:pointer;transition:background .15s}
  button:hover{background:#6b1414}
  .err{display:none;background:#fee;border:1px solid #fcc;border-radius:6px;
       padding:10px 12px;font-size:13px;color:#8b1a1a;margin-top:12px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🍷</div>
  <h1>Panneau d'administration</h1>
  <p class="sub">Œnologie App</p>
  <label for="pw">Mot de passe</label>
  <input type="password" id="pw" placeholder="••••••••" autofocus>
  <button onclick="login()">Se connecter</button>
  <div class="err" id="err">Mot de passe incorrect</div>
</div>
<script>
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') login(); });
async function login() {
  const pw = document.getElementById('pw').value;
  const r  = await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
  if(r.ok) { location.href='/admin/'; return; }
  document.getElementById('err').style.display='block';
  document.getElementById('pw').value='';
  document.getElementById('pw').focus();
}
</script>
</body></html>
